}

function drawTower(t){
  const alive = t.hp>0;
  const w = t.kind==='king'?58:44, h= t.kind==='king'?42:36;
  ctx.save();
  // sombra no chão pra dar peso/profundidade à torre — mais macia (com blur),
  // parece uma sombra projetada de verdade em vez de uma elipse dura
  if(alive){
    ctx.save();
    if(SUPPORTS_CTX_FILTER) ctx.filter = 'blur(3px)';
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(t.x, t.y+h/2+5, w*0.54, 8, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = alive?1:0.25;
  ctx.shadowColor = 'rgba(0,0,0,.5)';
  ctx.shadowBlur = 9;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = t.owner==='player' ? '#4FC3F7' : '#FF6B6B';
  roundRect(ctx, t.x-w/2, t.y-h/2, w, h, 8);
  ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle='#2B1055'; ctx.lineWidth=2; ctx.stroke();
  // brilho sutil no topo pra dar volume (efeito de textura/material)
  const grad = ctx.createLinearGradient(0, t.y-h/2, 0, t.y+h/2);
  grad.addColorStop(0, 'rgba(255,255,255,.32)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  roundRect(ctx, t.x-w/2, t.y-h/2, w, h, 8);
  ctx.fill();
  // reflexo de luz lateral (rim light), tipo metal/pedra polida pegando luz de canto
  ctx.save();
  ctx.globalAlpha = 0.35;
  const rim = ctx.createLinearGradient(t.x-w/2, 0, t.x-w/2+10, 0);
  rim.addColorStop(0, 'rgba(255,255,255,.6)');
  rim.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rim;
  roundRect(ctx, t.x-w/2, t.y-h/2, w, h, 8);
  ctx.fill();
  ctx.restore();
  ctx.font = (t.kind==='king'?'22px':'18px')+' sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(t.kind==='king'?'🏰':'🗼', t.x, t.y);
  ctx.restore();
  if(alive){
    drawHPBar(t.x, t.y-h/2-8, w, t.hp, t.maxhp, t.owner);
    if(t.level){
      ctx.save();
      ctx.font='9px "Baloo 2", sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='rgba(0,0,0,.45)';
      ctx.fillText('Nv '+t.level, t.x+1, t.y-h/2-15+1);
      ctx.fillStyle='#FFD93D';
      ctx.fillText('Nv '+t.level, t.x, t.y-h/2-15);
      ctx.restore();
    }
    // congelada pelo feitiço de Gelo: não consegue atacar enquanto durar
    if(t.freezeTimer>0){
      ctx.save();
      const pulse = 0.8 + 0.2*Math.sin(Date.now()/180);
      ctx.globalAlpha = pulse;
      ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowBlur=9; ctx.shadowColor='#4FC3F7';
      ctx.fillText('❄️', t.x, t.y-h/2-24);
      ctx.restore();
    }
  }
}

const OWNER_COLORS = {
  player: {light:'#6EC6FF', main:'#2F8FDE', dark:'#164E8C'},
  enemy:  {light:'#FF9B9B', main:'#E14848', dark:'#8C1E1E'},
};

/* ---------- FOTOS NA ARENA (opcional, ver fotos.js) ----------
   Mesma ideia das fotos nas telas de cartas: se a chave estiver
   preenchida no fotos.js, usamos ela; senão tentamos sozinhos os
   arquivos fotos/<chave>.jpg, .jpeg, .png e .webp, nessa ordem. A
   primeira imagem que existir é pré-carregada aqui e passa a ser
   desenhada por cima do emoji, com um pequeno enquadramento (fundo
   arredondado + borda clara), direto na tropa lutando na arena. Enquanto
   a imagem não carrega (ou se nenhuma opção existir), o emoji de sempre
   continua sendo desenhado normalmente — nada trava. */
const cardPhotoImages = {};
function tryLoadCardPhoto(key){
  const entry = cardPhotoImages[key];
  if(!entry || !entry.queue.length){ if(entry) entry.failed = true; return; }
  const src = entry.queue.shift();
  const img = new Image();
  img.onload = ()=>{ entry.img = img; entry.loaded = true; entry.failed = false; };
  img.onerror = ()=>{ tryLoadCardPhoto(key); };
  img.src = src;
}
function getCardPhotoImage(key){
  let entry = cardPhotoImages[key];
  if(entry===undefined){
    const manual = (typeof FOTOS_CARTAS !== 'undefined' && FOTOS_CARTAS && FOTOS_CARTAS[key]) ? FOTOS_CARTAS[key] : '';
    const queue = manual ? [manual] : FOTO_EXTENSOES.map(ext=>`fotos/${key}.${ext}`);
    entry = {img:null, loaded:false, failed:false, queue};
    cardPhotoImages[key] = entry;
    tryLoadCardPhoto(key);
  }
  return (entry.loaded && !entry.failed) ? entry.img : null;
}
// Desenha o ícone da carta centrado em (0,0) no contexto já transladado:
// foto (com enquadramento) se disponível, senão o emoji de sempre.
function drawCardIcon(key, emoji, cy, size){
  const photo = getCardPhotoImage(key);
  if(photo){
    ctx.save();
    roundRect(ctx, -size/2, cy-size/2, size, size, 4);
    ctx.clip();
    ctx.drawImage(photo, -size/2, cy-size/2, size, size);
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=1.2;
    roundRect(ctx, -size/2, cy-size/2, size, size, 4);
    ctx.stroke();
  } else {
    ctx.font=size+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(emoji, 0, cy);
  }
}

function drawTroop(t){
  if(t.state==='dying'){ drawSmoke(t); return; }
  // Odin camuflado: o inimigo fica totalmente escondido; o próprio dono vê uma silhueta translúcida
  if(t.invisible){
    if(t.owner==='enemy') return;
    ctx.save();
    ctx.globalAlpha = 0.4;
  }
  const def = CARD_TYPES[t.key];
  const oc = OWNER_COLORS[t.owner];
  const giant = !!def.giant;
  const building = !!def.isBuilding;
  const isPortal = t.key==='portaldemoniaco';
  const w = giant?40:(isPortal?30:(building?36:26)), h = giant?52:(isPortal?22:(building?40:36));

  // sombra no chão — todo mundo projeta uma (gigantes têm uma bem mais forte, pesada)
  if(!building || isPortal){
    ctx.save();
    ctx.globalAlpha = giant ? 0.32 : 0.22;
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(t.x, t.y+h/2+(giant?3:2), w*(giant?0.55:0.42), giant?6:3.5, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  let rot = 0, lungeX = 0, lungeY = 0, scaleBoost = 1;
  if(t.attackAnim!==null){
    const progress = Math.min(1, t.attackAnim/ATTACK_ANIM_DURATION);
    const ease = Math.sin(progress*Math.PI); // sobe suave até o meio e volta — fluido
    if(!def.projectileKind){
      // ataque corpo a corpo: a carta se joga pra cima do alvo e retorna
      const lunge = 15*ease;
      lungeX = (t.atkDirX||0)*lunge;
      lungeY = (t.atkDirY||0)*lunge - ease*3;
      rot = ease*0.26*t.tiltDir;
      scaleBoost = 1 + ease*0.14;
    } else if(!building){
      rot = ease*0.32*t.tiltDir;
    }
  }

  ctx.save();
  ctx.translate(t.x+lungeX, t.y+lungeY);
  ctx.rotate(rot);
  if(scaleBoost!==1) ctx.scale(scaleBoost, scaleBoost);

  if(building){
    if(t.key==='portaldemoniaco'){
      // Portal Demoníaco: um portal roxo achatado no chão, com anéis girando e brilho pulsante —
      // bem diferente da base metálica das outras construções
      const pr = 17;
      const spin = (Date.now()/480)%(Math.PI*2);
      const pulse = 0.82 + 0.18*Math.sin(Date.now()/260);
      ctx.globalAlpha = 0.5*pulse;
      const outerGrad = ctx.createRadialGradient(0,6,2,0,6,pr*1.3);
      outerGrad.addColorStop(0,'rgba(179,136,255,.55)');
      outerGrad.addColorStop(0.6,'rgba(123,47,247,.28)');
      outerGrad.addColorStop(1,'rgba(61,15,110,0)');
      ctx.fillStyle = outerGrad;
      ctx.beginPath(); ctx.ellipse(0,6,pr*1.3,pr*0.56,0,0,Math.PI*2); ctx.fill();

      ctx.globalAlpha = 0.92*pulse;
      const coreGrad = ctx.createRadialGradient(0,6,1,0,6,pr);
      coreGrad.addColorStop(0,'rgba(240,220,255,.95)');
      coreGrad.addColorStop(0.45,'rgba(179,136,255,.85)');
      coreGrad.addColorStop(1,'rgba(74,14,122,.85)');
      ctx.fillStyle = coreGrad;
      ctx.beginPath(); ctx.ellipse(0,6,pr,pr*0.42,0,0,Math.PI*2); ctx.fill();

      ctx.lineWidth = 2.4; ctx.shadowBlur=10; ctx.shadowColor='#7B2FF7';
      ctx.strokeStyle = '#D9A8E0';
      ctx.beginPath(); ctx.ellipse(0,6,pr*0.78,pr*0.32,spin,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle = '#3D1F5C'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0,6,pr*0.48,pr*0.2,-spin*1.5,0,Math.PI*2); ctx.stroke();

      ctx.shadowBlur=0;
      ctx.strokeStyle = 'rgba(217,168,224,.55)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(0,6,pr*1.15,pr*0.5,0,0,Math.PI*2); ctx.stroke();
    } else if(t.key==='portalragnarok'){
      // Portal Guerreiros do Ragnarok: uma casinha de madeira nórdica com telhado triangular
      // e uma porta que brilha suavemente — de onde os guerreiros saem
      const hw = 17, hh = 13;
      const bodyGrad = ctx.createLinearGradient(0,-hh*0.4,0,hh*1.4);
      bodyGrad.addColorStop(0,'#A9713D'); bodyGrad.addColorStop(1,'#6B4423');
      ctx.fillStyle = bodyGrad;
      roundRect(ctx, -hw, -hh*0.2, hw*2, hh*1.6, 3);
      ctx.fill();
      ctx.strokeStyle = '#3E2A15'; ctx.lineWidth = 2; ctx.stroke();
      // ripas de madeira (detalhe)
      ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
      for(let lx=-hw+6; lx<hw; lx+=7){
        ctx.beginPath(); ctx.moveTo(lx,-hh*0.2+2); ctx.lineTo(lx,hh*1.4-2); ctx.stroke();
      }
      // telhado triangular
      ctx.fillStyle = '#7B241C';
      ctx.beginPath();
      ctx.moveTo(-hw-5, -hh*0.2);
      ctx.lineTo(0, -hh*0.2-17);
      ctx.lineTo(hw+5, -hh*0.2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#4A0E0E'; ctx.lineWidth = 2; ctx.stroke();
      // porta brilhando (pulsa suavemente, como se algo estivesse prestes a sair)
      const doorPulse = 0.6 + 0.4*Math.sin(Date.now()/320);
      ctx.fillStyle = `rgba(255,214,120,${doorPulse.toFixed(2)})`;
      ctx.shadowBlur=6; ctx.shadowColor='#FFD93D';
      roundRect(ctx, -5, hh*0.35, 10, hh*0.75, 2);
      ctx.fill();
      ctx.strokeStyle='#2B1A0A'; ctx.lineWidth=1.4; ctx.stroke();
    } else {
    // construção: base metálica quadrada com cano apontando pro último alvo
    const grad = ctx.createLinearGradient(0,-h/2,0,h/2);
    grad.addColorStop(0, '#90A4AE'); grad.addColorStop(1, '#455A64');
    ctx.fillStyle = grad;
    roundRect(ctx, -w/2, -h/2, w, h, 5);
    ctx.fill();
    ctx.strokeStyle = oc.dark; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.4;
    roundRect(ctx, -w/2+3, -h/2+3, w-6, h-6, 3); ctx.stroke();
    ctx.save();
    const barrelAng = Math.atan2(t.atkDirY||-1, t.atkDirX||0.0001);
    ctx.rotate(barrelAng);
    ctx.fillStyle='#263238';
    roundRect(ctx, 0, -4, 18, 8, 3); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
    drawCardIcon(t.key, def.emoji, 3, 18);
    }
  } else {
    // cartão retangular em pé (tropas normais e gigantes)
    const grad = ctx.createLinearGradient(0,-h/2,0,h/2);
    grad.addColorStop(0, oc.light);
    grad.addColorStop(1, oc.dark);
    ctx.fillStyle = grad;
    roundRect(ctx, -w/2, -h/2, w, h, giant?9:7);
    ctx.fill();
    ctx.strokeStyle = '#1a0a2e';
    ctx.lineWidth = giant?3:2.5;
    ctx.stroke();
    // faixa interna clara (detalhe do "cartão")
    ctx.strokeStyle = 'rgba(255,255,255,.4)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, -w/2+3, -h/2+3, w-6, h-6, 4);
    ctx.stroke();
    // ícone da carta
    drawCardIcon(t.key, def.emoji, -2, giant?22:16);
  }
  ctx.restore();

  // congelado pelo feitiço de Gelo: cristais/névoa ciano em cima da tropa
  if(t.iceFreezeTimer>0){
    ctx.save();
    ctx.translate(t.x, t.y-h/2-6);
    const pulse = 0.8 + 0.2*Math.sin(Date.now()/180);
    ctx.globalAlpha = pulse;
    ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=8; ctx.shadowColor='#4FC3F7';
    ctx.fillText('❄️', 0, 0);
    ctx.restore();
  } else if(t.stunTimer>0){
    // faíscas elétricas em cima de quem está paralisado por Zeus
    ctx.save();
    ctx.translate(t.x, t.y-h/2-6);
    ctx.strokeStyle='#FFEB3B'; ctx.lineWidth=2;
    ctx.shadowBlur=8; ctx.shadowColor='#FFEB3B';
    ctx.beginPath();
    ctx.moveTo(-6,-6); ctx.lineTo(-1,0); ctx.lineTo(-4,2); ctx.lineTo(2,8);
    ctx.stroke();
    ctx.restore();
  }

  // aparência de estar pegando fogo (lança de Ares — acumulativa e permanente)
  if(t.fireLances && t.fireLances.length){
    ctx.save();
    const stacks = Math.min(t.fireLances.length, 6);
    const tt = Date.now()*0.006;
    for(let i=0;i<stacks;i++){
      const fx = t.x + Math.sin(tt+i*1.7)*w*0.28;
      const fy = t.y - Math.abs(Math.sin(tt*1.6+i))*h*0.5 - 2;
      const r = 4 + Math.sin(tt*2+i)*1.4;
      const grad = ctx.createRadialGradient(fx,fy,0,fx,fy,r*1.8);
      grad.addColorStop(0,'#FFF3B0'); grad.addColorStop(.5,'#FF8C42'); grad.addColorStop(1,'rgba(255,60,20,0)');
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.arc(fx,fy,r*1.8,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // Perdão (Breath wallenHaish): aro colorido pulsante ao redor dos pés — fica permanentemente
  // enquanto ela estiver viva, e brilha mais forte a cada stack acumulado
  if(t.dmgBuffStacks>0){
    ctx.save();
    const pulse = 0.5+0.5*Math.sin(Date.now()/140);
    const colors = ['#4FC3F7','#FF3CAC','#FFD93D','#FF4B3E','#2ECC71'];
    const stackBoost = Math.min(t.dmgBuffStacks*0.06, 0.4);
    ctx.globalAlpha = 0.55+0.25*pulse+stackBoost;
    ctx.lineWidth = 2.2 + Math.min(t.dmgBuffStacks*0.4, 3);
    const segAngle = (Math.PI*2)/colors.length;
    colors.forEach((col,i)=>{
      ctx.beginPath();
      ctx.shadowBlur=10; ctx.shadowColor=col;
      ctx.strokeStyle=col;
      const a0 = segAngle*i, a1 = segAngle*(i+1)-0.1;
      ctx.ellipse(t.x, t.y+h/2-2, w*0.62, 7, 0, a0, a1);
      ctx.stroke();
    });
    ctx.restore();
  }

  // nível da carta — pequeno retângulo azul escuro embaixo da carta, número branco
  ctx.save();
  const lvlText = String(t.level||1);
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const boxW = Math.max(16, ctx.measureText(lvlText).width+10);
  const boxH = 12;
  const boxY = t.y + h/2 + 9;
  ctx.fillStyle = '#0D2B52';
  roundRect(ctx, t.x-boxW/2, boxY-boxH/2, boxW, boxH, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
  roundRect(ctx, t.x-boxW/2, boxY-boxH/2, boxW, boxH, 3);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillText(lvlText, t.x, boxY+0.5);
  ctx.restore();

  drawHPBar(t.x, t.y-h/2-10, w+2, t.hp, t.maxhp, t.owner);
  if(t.invisible) ctx.restore();
}

function drawSmoke(t){
  const progress = Math.min(1, t.dieElapsed/DIE_DURATION);
  ctx.save();
  for(let i=0;i<4;i++){
    const offset = i*0.14;
    const p = Math.min(1, Math.max(0,(progress-offset))*1.4);
    if(p<=0) continue;
    const r = 5 + p*13;
    const yOff = -p*32;
    const xOff = (i-1.5)*6;
    ctx.globalAlpha = (1-p) * 0.55;
    ctx.fillStyle = '#B9B7C7';
    ctx.beginPath();
    ctx.arc(t.x+xOff, t.y+yOff, r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawHPBar(x,y,w,hp,maxhp,owner){
  const pct = Math.max(0,hp/maxhp);
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.fillRect(x-w/2,y,w,5);
  ctx.fillStyle = owner==='player' ? '#4FE37A' : '#FF6B6B';
  ctx.fillRect(x-w/2,y,w*pct,5);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ============================================================
   SISTEMA DE SALVAMENTO (3 slots / campanhas + Modo ADM)
   ============================================================ */
const SAVE_PREFIX = 'daviyo_save_';
const ACTIVE_SLOT_KEY = 'daviyo_active_slot';
const NUM_SLOTS = 3;
let activeSlot = 1;

function defaultState(){
  const col={}, lvl={}, evo={};
  CARD_KEYS.forEach(k=>{ col[k]=0; lvl[k]=1; evo[k]=0; });
  // As cartas do deck inicial já começam desbloqueadas (1 cópia cada);
  // o resto da coleção fica travada (cadeado) até o jogador abrir baús.
  STARTER_DECK.forEach(k=>{ col[k]=1; });
  return { coins:3, collection:col, cardLevels:lvl, evolutions:evo, towerLevel:1, selectedArenaBet:ARENAS.map(a=>a.bets[0]), selectedDeck:STARTER_DECK.slice(), maxChestOpen:1, wildcards:{comum:0,raro:0,epico:0,lendaria:0}, shopBannerId:null, shopBannerElapsedMs:0, bailoutsUsed:0, chestsOpenedCount:0, savedAt:null };
}
function getCurrentStateSnapshot(){
  return {
    coins, collection:{...collection}, cardLevels:{...cardLevels}, evolutions:{...evolutions}, towerLevel,
    selectedArenaBet:[...selectedArenaBet], selectedDeck:[...selectedDeck], maxChestOpen, wildcards:{...wildcards},
    shopBannerId, shopBannerElapsedMs, bailoutsUsed, chestsOpenedCount, savedAt:Date.now()
  };
}
function applyState(state){
  coins = state.coins ?? 3;
  collection = {...(state.collection||{})};
  cardLevels = {...(state.cardLevels||{})};
  evolutions = {...(state.evolutions||{})};
  towerLevel = state.towerLevel ?? 1;
  selectedArenaBet = state.selectedArenaBet ? [...state.selectedArenaBet] : ARENAS.map(a=>a.bets[0]);
  selectedDeck = state.selectedDeck ? [...state.selectedDeck] : STARTER_DECK.slice();
  maxChestOpen = state.maxChestOpen ?? 1;
  wildcards = {comum:0, raro:0, epico:0, lendaria:0, ...(state.wildcards||{})};
  bailoutsUsed = state.bailoutsUsed ?? 0;
  // Saves criados ANTES desse recurso existir não têm esse campo — nesse
  // caso já não são mais "o início da conta", então não faz sentido ativar
  // a garantia retroativamente; entram direto com o valor no limite (como
  // se já tivessem usado os 2 baús garantidos). Campanhas novas (criadas
  // depois dessa atualização) sempre começam do 0 normalmente via defaultState().
  chestsOpenedCount = state.chestsOpenedCount ?? CHEST_GUARANTEE_LIMIT;
  // Banner da loja: cada save/campanha guarda o seu próprio banner atual e o
  // tempo de jogo já acumulado nele, pra trocar de campanha não bagunçar a
  // rotação de ninguém. Save antigo sem esses campos ganha um banner novo
  // sorteado do zero (ensureShopBannerInitialized cuida disso).
  shopBannerId = state.shopBannerId ?? null;
  shopBannerElapsedMs = state.shopBannerElapsedMs ?? 0;
  ensureShopBannerInitialized();
  lastShopTickAt = Date.now();
  ensureValidDeck();
  // completa apostas de arenas novas caso o save seja antigo (menos arenas do que o jogo atual)
  ARENAS.forEach((a,i)=>{ if(selectedArenaBet[i]===undefined) selectedArenaBet[i]=a.bets[0]; });
  CARD_KEYS.forEach(k=>{
    if(collection[k]===undefined) collection[k]=0;
    if(cardLevels[k]===undefined) cardLevels[k]=1;
    if(evolutions[k]===undefined) evolutions[k]=0;
  });
}
function saveToSlot(slot){
  try{ localStorage.setItem(SAVE_PREFIX+slot, JSON.stringify(getCurrentStateSnapshot())); }
  catch(e){ console.warn('Não foi possível salvar o jogo:', e); }
}
function loadSlotData(slot){
  try{
    const raw = localStorage.getItem(SAVE_PREFIX+slot);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
/* Chame saveGame() sempre que algo importante mudar (moedas, cartas, níveis) */
function saveGame(){
  saveToSlot(activeSlot);
  try{ localStorage.setItem(ACTIVE_SLOT_KEY, String(activeSlot)); }catch(e){}
}
function initSaveSystem(){
  let savedActive = null;
  try{ savedActive = localStorage.getItem(ACTIVE_SLOT_KEY); }catch(e){}
  activeSlot = Number(savedActive);
  if(!(activeSlot>=1 && activeSlot<=NUM_SLOTS)) activeSlot = 1;
  const data = loadSlotData(activeSlot);
  if(data){ applyState(data); }
  else{ applyState(defaultState()); saveToSlot(activeSlot); }
  try{ localStorage.setItem(ACTIVE_SLOT_KEY, String(activeSlot)); }catch(e){}
}

/* ---------- SALVAMENTO AUTOMÁTICO ----------
   Além de saveGame() já ser chamado manualmente logo depois de cada ação
   importante (comprar baú, subir de nível, evoluir carta, trocar deck etc.),
   isso aqui garante um salvamento periódico de segurança a cada poucos
   segundos, e também salva no exato instante em que o jogador sai do jogo
   (troca de aba, minimiza ou fecha), pra nunca perder progresso mesmo se
   alguma ação específica esquecer de chamar saveGame(). */
const AUTOSAVE_INTERVAL_MS = 10*1000; // salva a cada 10s
setInterval(()=>{ saveGame(); }, AUTOSAVE_INTERVAL_MS);
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) saveGame(); // saiu/minimizou: salva na hora
});
window.addEventListener('pagehide', ()=>{ saveGame(); });
window.addEventListener('beforeunload', ()=>{ saveGame(); });

/* ---------- PAINEL DE CONFIGURAÇÕES ---------- */
function openSettings(){
  renderSettingsMain();
  document.getElementById('settings-overlay').classList.remove('hidden');
}
function closeSettings(){
  document.getElementById('settings-overlay').classList.add('hidden');
}
function renderSettingsMain(){
  const el = document.getElementById('settings-overlay');
  el.innerHTML = `
    <div class="settings-panel">
      <h2 class="settings-title">⚙️ Configurações</h2>
      <button class="menu-btn btn-cards" style="padding:14px;font-size:17px;" onclick="renderSavesScreen()">💾 Saves</button>
      <button class="menu-btn btn-chest" style="padding:14px;font-size:17px;" onclick="activateAdminMode()">👑 Modo ADM</button>
      <button class="menu-btn btn-quit" style="padding:12px;font-size:15px;" onclick="closeSettings()">✖ Fechar</button>
    </div>`;
}
function renderSavesScreen(){
  const el = document.getElementById('settings-overlay');
  let slotsHTML = '';
  for(let i=1;i<=NUM_SLOTS;i++){
    const data = loadSlotData(i);
    const isActive = (i===activeSlot);
    if(data){
      const date = data.savedAt ? new Date(data.savedAt).toLocaleString('pt-BR') : '—';
      slotsHTML += `
        <div class="save-slot${isActive?' active':''}">
          <div class="save-slot-title">Slot ${i}${isActive?' (Atual)':''}</div>
          <div class="save-slot-info">🪙 ${data.coins} moedas<br>💾 Salvo em ${date}</div>
          <div class="save-slot-btns">
            ${isActive?'' : `<button class="menu-btn btn-play" onclick="switchToSlot(${i})">Selecionar</button>`}
            <button class="menu-btn btn-export" onclick="exportSlot(${i})">📤 Exportar</button>
            <button class="menu-btn btn-quit" onclick="deleteSlot(${i})">🗑️ Excluir</button>
          </div>
        </div>`;
    } else {
      slotsHTML += `
        <div class="save-slot">
          <div class="save-slot-title">Slot ${i} — vazio</div>
          <div class="save-slot-info">Nenhuma campanha aqui ainda</div>
          <div class="save-slot-btns">
            <button class="menu-btn btn-play" onclick="switchToSlot(${i})">➕ Nova Campanha</button>
          </div>
        </div>`;
    }
  }
  el.innerHTML = `
    <div class="settings-panel">
      <h2 class="settings-title">💾 Saves</h2>
      ${slotsHTML}
      <div class="save-slot-info" style="text-align:center;margin:10px 0 2px;">
        📦 Backup: exporte seu progresso pra um arquivo, ou importe um backup salvo antes.
      </div>
      <div class="save-slot-btns">
        <button class="menu-btn btn-export" onclick="exportAllSaves()">📤 Exportar tudo</button>
        <button class="menu-btn btn-export" onclick="triggerImportFile()">📥 Importar backup</button>
      </div>
      <button class="menu-btn btn-quit" style="padding:12px;font-size:15px;" onclick="renderSettingsMain()">⬅ Voltar</button>
    </div>`;
}
function switchToSlot(slot){
  if(slot===activeSlot){ closeSettings(); return; }
  saveToSlot(activeSlot); // preserva o progresso da campanha atual antes de trocar
  const data = loadSlotData(slot);
  applyState(data ? data : defaultState());
  activeSlot = slot;
  saveGame();
  closeSettings();
  goMenu();
}
function deleteSlot(slot){
  if(!confirm(`Excluir o Slot ${slot}? Essa campanha será perdida para sempre.`)) return;
  try{ localStorage.removeItem(SAVE_PREFIX+slot); }catch(e){}
  if(slot===activeSlot){
    applyState(defaultState());
    saveGame();
    closeSettings();
    goMenu();
    return;
  }
  renderSavesScreen();
}

/* ============================================================
   EXPORTAR / IMPORTAR SAVE (backup em arquivo .json)
   ============================================================
   Isso é uma camada de segurança A MAIS além do salvamento automático
   no navegador (localStorage). Se o jogador limpar os dados do
   navegador, trocar de celular, desinstalar o app, ou o localStorage
   corromper por qualquer motivo, o progresso salvo SÓ no aparelho se
   perde — mas se ele tiver exportado um backup antes, é só importar de
   novo e o progresso volta certinho. Recomendado exportar de vez em
   quando, e sempre antes de trocar de celular ou reinstalar o jogo. */
function downloadJSON(obj, filename){
  try{
    const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ alert('Não foi possível exportar o save: '+e.message); }
}
function dateStamp(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}
// Exporta só 1 slot/campanha específico.
function exportSlot(slot){
  const data = (slot===activeSlot) ? getCurrentStateSnapshot() : loadSlotData(slot);
  if(!data){ alert('Esse slot está vazio, não há nada pra exportar.'); return; }
  if(slot===activeSlot) saveToSlot(slot); // garante que o que tá salvo bate com o que tá em jogo agora
  const payload = { type:'god-defense-save', version:1, slot, exportedAt:Date.now(), state:data };
  downloadJSON(payload, `god-defense-slot${slot}-${dateStamp()}.json`);
}
// Exporta os 3 slots de uma vez só (backup completo do progresso).
function exportAllSaves(){
  saveToSlot(activeSlot); // garante que o slot ativo tá atualizado antes do backup
  const slots = {};
  for(let i=1;i<=NUM_SLOTS;i++){
    const d = loadSlotData(i);
    if(d) slots[i] = d;
  }
  if(Object.keys(slots).length===0){ alert('Não há nenhuma campanha salva pra exportar ainda.'); return; }
  const payload = { type:'god-defense-backup', version:1, exportedAt:Date.now(), activeSlot, slots };
  downloadJSON(payload, `god-defense-backup-completo-${dateStamp()}.json`);
}
function triggerImportFile(){
  let input = document.getElementById('save-import-input');
  if(!input){
    input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.id = 'save-import-input';
    input.style.display = 'none';
    input.addEventListener('change', handleImportFileSelected);
    document.body.appendChild(input);
  }
  input.value = ''; // permite selecionar o mesmo arquivo de novo, se precisar
  input.click();
}
function handleImportFileSelected(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert('Esse arquivo não é um save válido do God Defense (JSON inválido).'); return; }
    if(parsed && parsed.type==='god-defense-backup' && parsed.slots){
      importFullBackup(parsed);
    } else if(parsed && parsed.type==='god-defense-save' && parsed.state){
      renderImportSlotChoice(parsed.state);
    } else {
      alert('Esse arquivo não parece ser um save do God Defense.');
    }
  };
  reader.onerror = () => alert('Não foi possível ler esse arquivo.');
  reader.readAsText(file);
}
// Backup completo (vários slots de uma vez): pede confirmação e substitui
// os slots correspondentes de uma vez só.
function importFullBackup(parsed){
  const qtd = Object.keys(parsed.slots).length;
  if(!confirm(`Importar backup completo (${qtd} campanha${qtd>1?'s':''})? Isso vai SUBSTITUIR os saves que já existem nesse aparelho nos slots correspondentes. Essa ação não pode ser desfeita.`)) return;
  Object.keys(parsed.slots).forEach(slotStr=>{
    const slot = Number(slotStr);
    if(slot>=1 && slot<=NUM_SLOTS){
      try{ localStorage.setItem(SAVE_PREFIX+slot, JSON.stringify(parsed.slots[slotStr])); }catch(e){}
    }
  });
  const newActive = (parsed.activeSlot>=1 && parsed.activeSlot<=NUM_SLOTS) ? parsed.activeSlot : activeSlot;
  activeSlot = newActive;
  const data = loadSlotData(activeSlot) || defaultState();
  applyState(data);
  saveGame();
  alert('✅ Backup importado com sucesso!');
  renderSavesScreen();
  refreshCurrentScreen();
}
// Save de 1 slot só: deixa o jogador escolher em qual dos 3 slots do
// aparelho esse save vai entrar, avisando se for sobrescrever algo.
function renderImportSlotChoice(state){
  const el = document.getElementById('settings-overlay');
  let btns = '';
  for(let i=1;i<=NUM_SLOTS;i++){
    const existing = loadSlotData(i);
    const warn = existing ? ' (substitui um save existente)' : ' (vazio)';
    btns += `<button class="menu-btn btn-play" style="margin-bottom:8px;" onclick="confirmImportIntoSlot(${i})">Importar para Slot ${i}${warn}</button>`;
  }
  window.__pendingImportState = state;
  el.innerHTML = `
    <div class="settings-panel">
      <h2 class="settings-title">📥 Importar Save</h2>
      <div class="save-slot-info" style="margin-bottom:10px;text-align:center;">Escolha em qual slot esse save vai entrar:</div>
      ${btns}
      <button class="menu-btn btn-quit" style="padding:12px;font-size:15px;" onclick="window.__pendingImportState=null;renderSavesScreen()">⬅ Cancelar</button>
    </div>`;
}
function confirmImportIntoSlot(slot){
  const state = window.__pendingImportState;
  if(!state){ renderSavesScreen(); return; }
  const existing = loadSlotData(slot);
  const msg = existing
    ? `O Slot ${slot} já tem uma campanha salva. Importar vai SUBSTITUIR esse progresso pra sempre. Continuar?`
    : `Importar esse save pro Slot ${slot}?`;
  if(!confirm(msg)) return;
  try{ localStorage.setItem(SAVE_PREFIX+slot, JSON.stringify(state)); }catch(e){}
  if(slot===activeSlot){
    applyState(state);
    saveGame();
    refreshCurrentScreen();
  }
  window.__pendingImportState = null;
  alert('✅ Save importado com sucesso!');
  renderSavesScreen();
}

/* ---------- MODO ADM ---------- */
function activateAdminMode(){
  coins = 999999999;
  saveGame();
  closeSettings();
  refreshCurrentScreen();
  alert('👑 Modo ADM ativado! Dinheiro infinito liberado.');
}
function refreshCurrentScreen(){
  if(!document.getElementById('menu-screen').classList.contains('hidden')) renderMenu();
  else if(!document.getElementById('chests-screen').classList.contains('hidden')) renderChestsScreen();
  else if(!document.getElementById('cards-screen').classList.contains('hidden')) renderCollectionScreen();
  else if(!document.getElementById('tower-screen').classList.contains('hidden')) renderTowerScreen();
  else if(!document.getElementById('shop-screen').classList.contains('hidden')) renderShopScreen();
}

/* ---------- START ---------- */
initSaveSystem();
goMenu();

/* ---------- REGISTRO DO SERVICE WORKER (PWA) ----------
   Faz o navegador reconhecer o jogo como app instalável e permite
   abrir offline depois da primeira visita. Se o arquivo sw.js não
   existir (ex: rodando localmente sem servidor), o jogo continua
   funcionando normal — só não fica instalável/offline. */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
