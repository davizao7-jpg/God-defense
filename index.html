<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>God Defense</title>

<!-- ---------- PWA ---------- -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B1055">
<meta name="description" content="God Defense — jogo de cartas e defesa de torres com deuses, heróis e demônios.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="God Defense">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF3CAC; --purple:#7B2FF7; --yellow:#FFD93D; --green:#2ECC71;
    --blue:#4FC3F7; --orange:#FF8C42; --dark:#2B1055;
    /* tema dinâmico do menu — muda conforme o cenário selecionado no carrossel */
    --th1:#8FD98A; --th2:#1B5E20; --th-glow:rgba(60,140,60,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Fredoka',sans-serif;font-weight:600;background:#3a1263;}
  #app{position:relative;width:100%;height:100vh;max-width:480px;margin:0 auto;overflow:hidden;
       background:linear-gradient(160deg,var(--th2),var(--th1) 60%,var(--th2) 130%);
       transition:background 1.1s ease;
       /* cores mais intensas e chamativas em tudo (menu + jogo) */
       filter:saturate(1.28) contrast(1.08) brightness(1.03);}
  /* textura de tecido/material (hachura diagonal bem sutil por baixo do
     grão), pra parar de parecer uma cor lisa de vetor e ganhar corpo */
  #app::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 1px, transparent 7px);
    mix-blend-mode:overlay;
  }
  /* textura de grão bem sutil, só pra dar um pouco de peso sem escurecer a tela */
  #app::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:50;mix-blend-mode:overlay;opacity:.18;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/></svg>");
  }

  /* ---------- MENU ---------- */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
          justify-content:flex-start;padding:16px;overflow-y:auto;}
  .hidden{display:none !important;}

  /* luz "de palco" vinda de cima, dá profundidade e foco ao centro da tela,
     como se houvesse uma fonte de luz real iluminando o menu (aplicada
     como background do próprio elemento — sempre atrás do conteúdo,
     sem risco de tampar botões por cima) */
  #menu-screen{gap:10px;background:radial-gradient(ellipse 140% 55% at 50% -8%, rgba(255,255,255,.22), rgba(255,255,255,0) 70%);}
  .petal{position:absolute;border-radius:50%;opacity:.55;filter:blur(1px);animation:float 9s linear infinite;pointer-events:none;}
  @keyframes float{
    0%{transform:translateY(110vh) rotate(0deg);}
    100%{transform:translateY(-15vh) rotate(360deg);}
  }
  .title-wrap{text-align:center;margin-bottom:0;}
  .game-title{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:52px; margin:2px 0 0;
    background:linear-gradient(90deg,var(--th1),#ffffff,var(--th2),var(--th1));
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:2px rgba(0,0,0,.4);
    text-shadow:0 3px 8px rgba(0,0,0,.35), 0 0 22px var(--th-glow), 0 0 44px var(--th-glow);
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));
    animation:shine 4s linear infinite, pop 1.2s cubic-bezier(.34,1.56,.64,1);
    letter-spacing:1px; transition:background 1.1s ease;
  }
  @keyframes shine{to{background-position:300% 0;}}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
  .subtitle{color:#FFF6E0;font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase;opacity:.9;margin-top:-4px;margin-bottom:4px;text-shadow:0 1px 3px rgba(0,0,0,.3);}

  .coin-pill{
    position:relative; overflow:hidden;
    background:linear-gradient(180deg,#FFE066,#FFB627);
    border:1px solid rgba(0,0,0,.1);
    color:#7A4B00;font-weight:800;font-size:19px;padding:7px 18px;border-radius:30px;
    box-shadow:0 4px 0 #B9800E, 0 8px 16px -4px rgba(0,0,0,.4), inset 0 1px 2px rgba(255,255,255,.7);
    display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:6;
  }
  .coin-pill::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.65) 48%, rgba(255,255,255,0) 66%);
    background-size:250% 100%;
    animation:coinShine 3.4s ease-in-out infinite;
  }
  @keyframes coinShine{0%{background-position:130% 0;}55%,100%{background-position:-40% 0;}}

  .menu-btn{
    position:relative; overflow:hidden;
    border:none; border-radius:16px; font-family:'Baloo 2',sans-serif;
    font-weight:800; color:#fff; cursor:pointer; letter-spacing:1px;
    box-shadow:0 6px 0 rgba(0,0,0,.32), 0 10px 18px -6px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.4);
    transition:transform .08s, background 1.1s ease, box-shadow .08s;
    -webkit-text-stroke:.5px rgba(0,0,0,.25);
    text-shadow:0 2px 3px rgba(0,0,0,.4);
    border:1px solid rgba(0,0,0,.15);
  }
  /* reflexo tipo vidro/verniz na metade de cima do botão, dá aspecto de
     material brilhante (plástico/laca) em vez de cor lisa */
  .menu-btn::before{
    content:'';position:absolute;top:0;left:0;right:0;height:52%;border-radius:16px 16px 50% 50%/16px 16px 100% 100%;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0));
    pointer-events:none;
  }
  .menu-btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.3);}
  .btn-play{background:linear-gradient(180deg,var(--th1),var(--th2));}
  .btn-chest{background:linear-gradient(180deg,var(--th1),var(--th2));filter:brightness(1.08);}
  .btn-cards{background:linear-gradient(180deg,var(--th1),var(--th2));filter:brightness(1.16);}
  .btn-tower{background:linear-gradient(180deg,var(--th1),var(--th2));filter:brightness(.94);}
  .btn-shop{background:linear-gradient(180deg,var(--th1),var(--th2));filter:brightness(1.24);}

  .bottom-btns{display:flex;gap:10px;width:100%;max-width:340px;margin-top:6px;}
  .bottom-btns .menu-btn{flex:1;padding:15px 6px;font-size:17px;}

  /* ---------- CARROSSEL DE ARENAS ---------- */
  #carousel-wrap{width:100%;max-width:340px;overflow:hidden;border-radius:22px;touch-action:pan-y;}
  #carousel-track{display:flex;}
  .arena-slide{flex-shrink:0;padding:2px;}
  .arena-card{
    background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);border-radius:14px;
    padding:14px;text-align:center;backdrop-filter:blur(4px);
    box-shadow:0 0 30px -4px var(--th-glow), 0 10px 24px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.5);
  }
  .arena-card h2{
    font-family:'Baloo 2';font-weight:800;color:#fff;font-size:21px;margin:0 0 8px;
    -webkit-text-stroke:.5px rgba(0,0,0,.25); text-shadow:0 2px 4px rgba(0,0,0,.35);
  }
  .arena-visual{
    width:100%;height:158px;border-radius:8px;position:relative;overflow:hidden;
    border:2px solid rgba(255,255,255,.55);cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.25), 0 12px 22px -4px rgba(0,0,0,.45), inset 0 0 28px rgba(0,0,0,.16), inset 0 2px 0 rgba(255,255,255,.25);
    filter:saturate(1.2) contrast(1.05);
  }
  .arena-visual:active{transform:scale(.97);}
  .av-river{position:absolute;left:0;right:0;top:44%;height:22%;}
  .av-bridge{position:absolute;top:40%;height:30%;width:22%;}
  .av-tower{position:absolute;font-size:20px;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 1px rgba(0,0,0,.4));}
  .av-tower.king{font-size:26px;}
  .av-decor{position:absolute;font-size:13px;opacity:.9;}
  .arena-tap-hint{color:#FFE8FA;font-size:12px;font-weight:700;margin-top:6px;opacity:.85;letter-spacing:.5px;}

  .bet-row{display:flex;gap:8px;justify-content:center;margin-top:10px;}
  .bet-chip{
    flex:1;padding:9px 0;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.28);color:#fff;
    font-weight:800;font-size:15px;cursor:pointer;font-family:'Baloo 2';transition:border-color 1.1s ease,background 1.1s ease;
  }
  .bet-chip.selected{border-color:#fff;background:var(--th2);transform:translateY(-2px);box-shadow:0 0 12px -2px var(--th-glow);}
  .bet-chip:disabled{opacity:.35;}

  /* ---------- EFEITOS ESPECIAIS DE ARENA ---------- */
  .fx-tree{position:absolute;font-size:24px;transform-origin:50% 92%;
    animation:treeSway 3s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,40,0,.4));}
  @keyframes treeSway{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}
  .fx-grass{position:absolute;font-size:14px;opacity:.95;filter:drop-shadow(0 2px 1px rgba(0,30,0,.3));
    animation:grassSway 2.2s ease-in-out infinite;transform-origin:50% 100%;}
  @keyframes grassSway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
  .fx-sun-glow{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 8%,rgba(255,240,190,.4),transparent 58%);
    animation:glowPulse 3.4s ease-in-out infinite;}
  .fx-sparkle{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFFAE0;
    box-shadow:0 0 6px 2px rgba(255,245,200,.85);animation:sparklePop 2.4s ease-in-out infinite;}
  @keyframes sparklePop{0%,100%{opacity:0;transform:scale(.4);}50%{opacity:.95;transform:scale(1.1);}}
  .fx-haze{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,0) 65%,rgba(0,0,0,.16) 100%);}

  .fx-wire{position:absolute;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#4FC3F7,#B6FFFA,#4FC3F7,transparent);
    box-shadow:0 0 6px 1px #4FC3F7,0 0 14px 3px rgba(79,195,247,.6);
    animation:wireGlow 1.6s ease-in-out infinite;}
  .fx-wire1{top:16%;transform:rotate(-4deg);}
  .fx-wire2{top:48%;transform:rotate(3deg);}
  .fx-wire3{top:80%;transform:rotate(-2deg);}
  @keyframes wireGlow{0%,100%{opacity:.45;}50%{opacity:1;}}
  .fx-spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#DFFFFC;
    box-shadow:0 0 9px 3px #4FC3F7;animation:sparkPulse 1.1s ease-in-out infinite;}
  @keyframes sparkPulse{0%,100%{transform:scale(.55);opacity:.35;}50%{transform:scale(1.25);opacity:1;}}

  /* --- tecnologia: grade neon + hologramas flutuantes --- */
  .fx-tech-glow{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 25%,rgba(79,195,247,.4),transparent 58%),
               radial-gradient(circle at 50% 82%,rgba(183,109,255,.32),transparent 62%);
    animation:glowPulse 2.8s ease-in-out infinite;}
  .fx-grid{position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(79,195,247,.22) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(79,195,247,.22) 1px,transparent 1px);
    background-size:22px 22px;opacity:.55;animation:gridScroll 3.5s linear infinite;}
  @keyframes gridScroll{0%{background-position:0 0,0 0;}100%{background-position:0 22px,22px 0;}}
  .fx-holo{position:absolute;width:6px;height:6px;background:#DABBFF;
    box-shadow:0 0 9px 3px rgba(183,109,255,.9);animation:holoFloat 3.2s ease-in-out infinite;}
  @keyframes holoFloat{0%,100%{transform:translateY(0) scale(1);opacity:.4;}50%{transform:translateY(-16px) scale(1.35);opacity:1;}}

  .fx-ember{position:absolute;bottom:4%;width:5px;height:5px;border-radius:50%;
    background:radial-gradient(circle,#FFE066,#FF5722);box-shadow:0 0 7px 2px rgba(255,87,34,.85);
    animation:emberRise 2.4s ease-in infinite;}
  @keyframes emberRise{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-130px) scale(.25);opacity:0;}}

  /* --- vulcão: lava, rachaduras e fumaça --- */
  .fx-lava-glow{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 88%,rgba(255,110,30,.55),transparent 62%);
    animation:glowPulse 2.4s ease-in-out infinite;}
  .fx-crack{position:absolute;height:3px;width:26%;
    background:linear-gradient(90deg,transparent,#FF7A1A,#FFD93D,#FF7A1A,transparent);
    box-shadow:0 0 9px 2px rgba(255,122,26,.85);animation:crackPulse 1.7s ease-in-out infinite;}
  @keyframes crackPulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  .fx-smoke{position:absolute;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle,rgba(130,130,130,.55),transparent 70%);
    animation:smokeRise 4.2s ease-in infinite;}
  @keyframes smokeRise{0%{transform:translateY(0) scale(.6);opacity:.55;}100%{transform:translateY(-95px) scale(1.7);opacity:0;}}

  .fx-cloud{position:absolute;width:36px;height:15px;background:#fff;border-radius:50px;
    box-shadow:9px 3px 0 -2px #fff,-9px 2px 0 -3px #fff,0 0 14px 4px rgba(255,255,255,.75);
    opacity:.9;animation:cloudDrift 6s ease-in-out infinite;}
  @keyframes cloudDrift{0%,100%{transform:translateX(0);}50%{transform:translateX(8px);}}
  .fx-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,217,61,.35),transparent 65%);
    animation:glowPulse 3s ease-in-out infinite;}
  @keyframes glowPulse{0%,100%{opacity:.5;}50%{opacity:.9;}}

  /* --- haven: raios divinos, penas e estrelas --- */
  .fx-godray{position:absolute;top:-15%;width:24px;height:140%;
    background:linear-gradient(180deg,rgba(255,248,220,.6),transparent 78%);
    filter:blur(2px);transform-origin:top center;animation:rayShift 5s ease-in-out infinite;}
  @keyframes rayShift{0%,100%{opacity:.3;transform:rotate(-4deg);}50%{opacity:.65;transform:rotate(4deg);}}
  .fx-feather{position:absolute;top:-10%;color:#FFF3C4;font-size:13px;opacity:0;
    text-shadow:0 0 6px rgba(255,240,180,.9);animation:featherFall 7s ease-in-out infinite;}
  @keyframes featherFall{
    0%{transform:translateY(-10%) translateX(0) rotate(0deg);opacity:0;}
    10%{opacity:.9;}
    100%{transform:translateY(190%) translateX(-20px) rotate(-170deg);opacity:.1;}
  }
  .fx-star{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFF7D6;
    box-shadow:0 0 7px 2px rgba(255,247,214,.9);animation:sparklePop 2s ease-in-out infinite;}

  /* --- neve: brilho frio + flocos caindo --- */
  .fx-snow-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 10%,rgba(220,246,255,.6),transparent 65%);
    animation:glowPulse 3.4s ease-in-out infinite;}
  .fx-snowflake{position:absolute;top:-12%;color:#fff;font-size:13px;opacity:0;
    text-shadow:0 0 5px rgba(255,255,255,.9),0 0 2px rgba(180,225,255,.8);
    animation:snowFall 6s linear infinite;pointer-events:none;}
  @keyframes snowFall{
    0%{transform:translateY(-12%) translateX(0) rotate(0deg);opacity:0;}
    8%{opacity:.95;}
    100%{transform:translateY(200%) translateX(16px) rotate(220deg);opacity:.15;}
  }

  /* --- deserto: calor + poeira/areia voando --- */
  .fx-heat{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,222,150,.16),transparent 42%);
    animation:glowPulse 3.2s ease-in-out infinite;}
  .fx-dust{position:absolute;width:4px;height:4px;border-radius:50%;
    background:radial-gradient(circle,#FFEFC8,#DFA24F);opacity:.4;
    box-shadow:0 0 4px 1px rgba(255,220,150,.5);
    animation:dustDrift 5.5s ease-in-out infinite;pointer-events:none;}
  @keyframes dustDrift{
    0%,100%{transform:translate(0,0);opacity:.2;}
    50%{transform:translate(12px,-8px);opacity:.65;}
  }

  #dots{display:flex;gap:8px;justify-content:center;margin-top:8px;}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;}
  .dot.active{background:#fff;width:22px;border-radius:6px;}

  /* ---------- BATTLE ---------- */
  #battle-screen{padding:0;justify-content:flex-start;overflow:hidden;}
  #hud-top{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; background:linear-gradient(180deg,#3a1263,#2B1055);
    border-bottom:3px solid #FFD93D; z-index:5;
  }
  .crown-count{display:flex;align-items:center;gap:4px;color:#fff;font-weight:800;font-size:15px;}
  #timer{font-family:'Baloo 2';font-size:23px;color:#FFD93D;font-weight:800;-webkit-text-stroke:.5px rgba(0,0,0,.3);}
  #pause-btn{
    background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;
    width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;
  }
  #suddendeath-banner{
    position:absolute; top:52px; left:50%; transform:translateX(-50%); z-index:20;
    background:linear-gradient(90deg,#FF3CAC,#7B2FF7); color:#fff; font-family:'Baloo 2';
    font-weight:800; font-size:16px; padding:6px 18px; border-radius:30px; letter-spacing:1px;
    box-shadow:0 4px 12px rgba(0,0,0,.4); animation:pulse 1s infinite;
  }
  @keyframes pulse{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.06);}}
  #double-banner{
    position:absolute; top:0; right:0; z-index:20;
    background:linear-gradient(90deg,#FFD93D,#FF8C42); color:#3a1263; font-family:'Baloo 2';
    font-weight:800; font-size:8px; padding:3px 9px; border-radius:0 0 0 14px; letter-spacing:.5px;
    box-shadow:0 2px 6px rgba(0,0,0,.4); animation:pulseCorner 1s infinite; transform-origin:top right;
  }
  @keyframes pulseCorner{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

  #arena-wrap{position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  /* canvas renderiza numa resolução interna maior (arena 30% maior) mas o tamanho
     na tela é mantido, dando o efeito de câmera afastada + imagem mais nítida */
  canvas{display:block;touch-action:none;width:380px;height:600px;max-width:100%;max-height:100%;}

  #mythic-ability-btn{
    position:absolute; right:8px; bottom:8px; z-index:12;
    width:40px; height:40px; border-radius:50%; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, #FF6FD8, #B01E7A 70%);
    border:2px solid #FFD93D; color:#fff; cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.5); transition:opacity .15s, transform .1s;
  }
  #mythic-ability-btn:active{transform:scale(.92);}
  #mythic-ability-btn.on-cooldown{background:radial-gradient(circle at 35% 30%, #8a8a8a, #444 70%); border-color:#999;}
  #mythic-ability-btn.cant-afford{opacity:.5;}
  #mythic-ability-emoji{font-size:13px;line-height:1;}
  #mythic-ability-cost{font-family:'Baloo 2';font-size:10px;font-weight:800;line-height:1;margin-top:1px;}

  #hud-bottom{
    width:100%; background:linear-gradient(180deg,#2B1055,#1a0a2e);
    border-top:3px solid #FFD93D; padding:8px 10px 12px; z-index:5;
  }
  #elixir-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  #elixir-bar{
    position:relative; flex:1; height:22px; background:#3a1263; border-radius:12px; overflow:hidden;
    border:2px solid #8B5CF6; display:flex;
  }
  /* enchimento contínuo e suave (nada de saltar de segmento em segmento) */
  #elixir-fill{
    position:absolute; top:0; left:0; height:100%; width:0%;
    background:linear-gradient(180deg,#C77DFF,#7B2FF7);
    box-shadow:inset 0 1px 4px rgba(255,255,255,.35), 0 0 8px rgba(199,125,255,.6);
    transition:width .12s linear;
  }
  #elixir-segs{position:absolute;inset:0;display:flex;pointer-events:none;}
  .elixir-seg{flex:1;border-right:1px solid rgba(0,0,0,.15);background:transparent;}
  #elixir-num{font-family:'Baloo 2';color:#FFD93D;font-weight:800;font-size:18px;min-width:26px;text-align:center;}
  .droplet{font-size:16px;}

  #hand-row{display:flex;gap:8px;justify-content:center;align-items:flex-end;}

  /* ---------- DECK BUILDER ---------- */

    position:fixed;pointer-events:none;z-index:100;width:70px;height:88px;border-radius:14px;

  .deck-drag-ghost .emoji{font-size:26px;}
  .deck-drag-ghost .cname{font-size:9px;color:#fff;font-weight:800;text-align:center;line-height:1.1;margin-top:2px;}

  #card-filters{width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}

  /* ---------- ENGRENAGEM / CONFIGURAÇÕES ---------- */
  #gear-btn{
    position:absolute; top:10px; right:10px; z-index:45;

    position:absolute;inset:0;background:rgba(20,8,40,.9);z-index:50;

    position:absolute;inset:0;background:rgba(20,8,40,.94);z-index:50;

  .wc-card-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;}

  .wc-card-level{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);}

  .settings-panel .menu-btn{width:100%;}

<body>
<div id="app">

  <!-- MENU -->
  <div id="menu-screen" class="screen"></div>

  <!-- BATTLE -->
  <div id="battle-screen" class="screen hidden">
    <div id="hud-top">
      <div class="crown-count">👑<span id="player-crowns">0</span>/3</div>
      <div id="timer">3:00</div>
      <button id="pause-btn" onclick="openPause()">⏸</button>
      <div class="crown-count">👑<span id="enemy-crowns">0</span>/3</div>
    </div>
    <div id="arena-wrap">
      <div id="suddendeath-banner" class="hidden">⚡ MORTE SÚBITA ⚡</div>
      <div id="double-banner" class="hidden">⏩ DOBRO DE ELIXIR 2x ⏩</div>
      <canvas id="arena" width="494" height="780"></canvas>
      <div id="pause-overlay" class="hidden">
        <h2>⏸ Pausado</h2>
        <button class="menu-btn btn-resume" onclick="resumeGame()">▶️ Continuar</button>
        <button class="menu-btn btn-quit" onclick="quitToMenu()">🏠 Voltar ao Menu</button>
      </div>
      <button id="mythic-ability-btn" class="hidden" onclick="activateMythicAbility()">
        <span id="mythic-ability-emoji">✨</span>
        <span id="mythic-ability-cost">2</span>
      </button>
    </div>
    <div id="hud-bottom">
      <div id="elixir-row">
        <span class="droplet">💧</span>
        <div id="elixir-bar">
          <div id="elixir-fill"></div>
          <div id="elixir-segs">
            <div class="elixir-seg"></div><div class="elixir-seg"></div><div class="elixir-seg"></div>
            <div class="elixir-seg"></div><div class="elixir-seg"></div><div class="elixir-seg"></div>
            <div class="elixir-seg"></div><div class="elixir-seg"></div><div class="elixir-seg"></div>
            <div class="elixir-seg"></div>
          </div>
        </div>
        <span id="elixir-num">0</span>
      </div>
      <div id="hand-row">
        <div class="card-slot" id="card-0"></div>
        <div class="card-slot" id="card-1"></div>
        <div class="card-slot" id="card-2"></div>
        <div class="card-slot" id="card-3"></div>
        <div style="text-align:center;">
          <div id="next-card"></div>
          <div id="next-label">PRÓXIMA</div>
        </div>
      </div>
    </div>
  </div>

  <!-- BAÚS -->
  <div id="chests-screen" class="screen hidden" style="align-items:center;"></div>

  <!-- COLEÇÃO -->
  <div id="cards-screen" class="screen hidden" style="align-items:center;"></div>

  <!-- TORRE -->
  <div id="tower-screen" class="screen hidden" style="align-items:center;"></div>

  <!-- LOJA -->
  <div id="shop-screen" class="screen hidden" style="align-items:center;"></div>


  <!-- END -->
  <div id="end-screen" class="screen hidden" style="justify-content:center;">
    <div id="end-title">VITÓRIA!</div>
    <div id="end-sub">Você destruiu mais torres!</div>
    <div id="end-coins">+0 🪙</div>
    <div id="end-bailout" class="hidden"></div>
    <button class="menu-btn btn-play" style="margin-top:18px;padding:15px 40px;font-size:19px;" onclick="goMenu()">Voltar ao Menu</button>
  </div>

  <!-- ENGRENAGEM / CONFIGURAÇÕES -->
  <button id="gear-btn" onclick="openSettings()">⚙️</button>
  <div id="settings-overlay" class="hidden"></div>
  <div id="wildcard-overlay" class="hidden"></div>

</div>

<!-- fotos.js é OPCIONAL: arquivo separado (mesma pasta deste HTML) onde
     você cola as fotos dos personagens. Se ele não existir, o navegador
     simplesmente ignora essa linha e o jogo segue normal com os emojis. -->
<script src="fotos.js"></script>
<script>
/* ============================================================
   God Defense — Sistema Base de Jogo
   ============================================================ */

/* ---------- ESTADO GLOBAL / ECONOMIA ---------- */
let coins = 3;
let currentBet = 1;

/* ---------- FOTOS DOS PERSONAGENS (opcional) ----------
   Duas formas de mostrar foto no lugar do emoji (baú, coleção, deck,
   curinga, mão):
   1) MANUAL: preenchendo a chave da carta no fotos.js (link, caminho ou
      base64). Se preenchida, ela tem prioridade.
   2) AUTOMÁTICA: se a chave NÃO estiver preenchida no fotos.js, o jogo
      tenta sozinho os arquivos fotos/<chave>.jpg, fotos/<chave>.jpeg,
      fotos/<chave>.png e fotos/<chave>.webp, nessa ordem — o primeiro
      que existir é usado. Ou seja: basta colocar a imagem com o nome
      exato da carta (ex.: zeus.jpg) dentro da pasta "fotos" do lado do
      HTML, sem precisar editar nada no fotos.js.
   Se nenhuma foto for encontrada (manual ou automática) ou ela falhar
   ao carregar, cai automaticamente pro emoji de sempre. O jogo funciona
   100% normal sem fotos; elas são só um complemento visual. */
const FOTO_EXTENSOES = ['jpg','jpeg','png','webp'];
function cardVisualHTML(key){
  const c = CARD_TYPES[key];
  const emoji = c ? c.emoji : '';
  const manual = (typeof FOTOS_CARTAS !== 'undefined' && FOTOS_CARTAS && FOTOS_CARTAS[key]) ? FOTOS_CARTAS[key] : '';
  if(manual){
    return `<img class="card-photo-img" src="${manual}" alt="" data-fallback="${emoji}" onerror="this.replaceWith(document.createTextNode(this.dataset.fallback))">`;
  }
  const chain = FOTO_EXTENSOES.map(ext=>`fotos/${key}.${ext}`);
  const first = chain[0];
  const rest = JSON.stringify(chain.slice(1)).replace(/"/g,'&quot;');
  return `<img class="card-photo-img" src="${first}" alt="" data-fallback="${emoji}" data-tryqueue="${rest}" onerror="cardImgTryNext(this)">`;
}
// Quando uma foto automática falha, tenta a próxima extensão da fila;
// se acabar a fila, volta pro emoji de sempre (nada trava).
function cardImgTryNext(img){
  let queue = [];
  try{ queue = JSON.parse((img.dataset.tryqueue||'[]').replace(/&quot;/g,'"')); }catch(e){ queue = []; }
  if(queue.length){
    const next = queue.shift();
    img.dataset.tryqueue = JSON.stringify(queue).replace(/"/g,'&quot;');
    img.src = next;
  } else {
    img.replaceWith(document.createTextNode(img.dataset.fallback));
  }
}

/* ---------- ROTAÇÃO DA LOJA (o banner ativo troca a cada 5 min de TEMPO DE JOGO) ----------
   Importante: isso NÃO é baseado no relógio do aparelho (Date.now()). Se fosse,
   o banner mudaria sozinho enquanto o jogador está com o jogo fechado, o que é
   exatamente o comportamento que não queremos. Em vez disso, guardamos:
   - shopBannerId: qual banner está ativo agora (salvo no save do jogador);
   - shopBannerElapsedMs: quanto tempo de jogo (só contando enquanto o app
     está aberto e em primeiro plano) já se passou dentro da janela atual.
   Um ticker roda a cada 1s (ver tickShopBanner mais abaixo) e só soma tempo
   quando a aba/app está visível — fechar ou minimizar o jogo simplesmente
   pausa a contagem, e ela retoma de onde parou ao reabrir. Só quando
   shopBannerElapsedMs atinge 5 minutos de jogo é que sorteamos um novo
   banner (evitando repetir o mesmo de novo em seguida) e zeramos a contagem
   (guardando o excedente, caso o dt de um tick seja maior que o restante).
   TODOS os baús da loja (Comum, Raro, Épico, Lendário e Místico) continuam
   com as mesmas chances de raridade de sempre, mas só sorteiam personagens
   do banner ativo. O Baú Místico também entra nessa rotação — a fatia de 1%
   de chance de vir Mítico só produz carta de verdade quando o banner ativo
   tem algum Mítico (Heróis tem o Breath wallenHaish, Bíblicos tem o Jesus);
   nos outros banners com pelo menos uma raridade "comum e acima" compatível,
   essa fatia cai pra raridade mais alta disponível. Já quando o banner ativo
   não tem NENHUMA carta em NENHUMA raridade que aquele baú oferece (ex.:
   Construções só tem carta Comum, e o Baú Místico nunca oferece Comum), esse
   baú específico simplesmente não é exibido nessa janela — ver
   chestAvailableForBanner() e o filtro em renderChestsScreen(). */
const SHOP_ROTATION_MS = 5*60*1000;
let shopBannerId = null;         // salvo no save do jogador
let shopBannerElapsedMs = 0;     // salvo no save do jogador
function pickRandomBannerId(excludeId){
  let pool = BANNERS.map(b=>b.id);
  if(excludeId && pool.length>1) pool = pool.filter(id=>id!==excludeId);
  return pool[Math.floor(Math.random()*pool.length)];
}
function ensureShopBannerInitialized(){
  if(!shopBannerId || !BANNER_INFO[shopBannerId]){
    shopBannerId = pickRandomBannerId();
    shopBannerElapsedMs = 0;
  }
}
function currentShopBanner(){
  ensureShopBannerInitialized();
  return BANNER_INFO[shopBannerId];
}
// Chamado a cada tick real (ver setInterval mais abaixo). Só deve receber
// deltaMs referente a tempo em que o jogo estava realmente aberto e visível.
// Retorna true se o banner ativo trocou nesse tick (pra saber se precisa
// re-renderizar a tela de Baús).
function tickShopBanner(deltaMs){
  ensureShopBannerInitialized();
  shopBannerElapsedMs += deltaMs;
  let changed = false;
  while(shopBannerElapsedMs >= SHOP_ROTATION_MS){
    shopBannerElapsedMs -= SHOP_ROTATION_MS;
    shopBannerId = pickRandomBannerId(shopBannerId);
    changed = true;
  }
  if(changed) saveGame();
  return changed;
}

   precisam somar 1 (são relativos), e nunca chegam a exatamente 0 pra não
   tornar a raridade seguinte literalmente impossível — só muito rara. */
const ARENA_RARITY_WEIGHTS = [
  {comum:0.90, raro:0.10, epico:0.001, lendaria:0.001, mitico:0.001}, // Arena Grama
  {comum:0.60, raro:0.28, epico:0.12,  lendaria:0.001, mitico:0.001}, // Arena de Neve
  {comum:0.40, raro:0.30, epico:0.22,  lendaria:0.08,  mitico:0.001}, // Arena Deserto

  {comum:0.15, raro:0.23, epico:0.30,  lendaria:0.25,  mitico:0.07 }, // Arena Vulcão
  {comum:0.10, raro:0.18, epico:0.28,  lendaria:0.34,  mitico:0.10 }, // Floresta Mística (6ª)
  {comum:0.10, raro:0.18, epico:0.27,  lendaria:0.33,  mitico:0.12 }, // Arena Haven (7ª)
];
/* Probabilidade de a IA ter cada nível de evolução (0 a 5) numa carta,
   também por arena. Arena 1 nunca tem evolução nenhuma; o resto sobe
   gradualmente, e evoluções altas (4/5) só aparecem com força nas
   últimas arenas. */
const ARENA_EVO_WEIGHTS = [
  [1.00, 0,    0,    0,    0,    0   ], // Arena Grama — sem evolução
  [0.85, 0.15, 0,    0,    0,    0   ], // Arena de Neve
  [0.55, 0.30, 0.15, 0,    0,    0   ], // Arena Deserto
  [0.30, 0.32, 0.23, 0.15, 0,    0   ], // Arena Tecnológica
  [0.15, 0.20, 0.25, 0.25, 0.15, 0   ], // Arena Vulcão
  [0.08, 0.12, 0.20, 0.25, 0.25, 0.10], // Floresta Mística (6ª)
  [0.05, 0.08, 0.15, 0.20, 0.27, 0.25], // Arena Haven (7ª)
];
function weightedPick(weights){
  const total = weights.reduce((s,w)=>s+w, 0) || 1;
  let r = Math.random()*total, acc=0;
  for(let i=0;i<weights.length;i++){
    acc += weights[i];
    if(r<=acc) return i;
  }
  return weights.length-1;
}

function enemyLevelRange(arenaIdx, betIdx){
  const arena = ARENAS[arenaIdx];
  const range = arena.enemyLevels[betIdx] || arena.enemyLevels[arena.enemyLevels.length-1];
  return range;
}
function rollEnemyLevels(arenaIdx, betIdx){
  const [lo,hi] = enemyLevelRange(arenaIdx, betIdx);
  const evoWeights = ARENA_EVO_WEIGHTS[clamp(arenaIdx, 0, ARENA_EVO_WEIGHTS.length-1)];
  CARD_KEYS.forEach(k=>{
    enemyCardLevels[k] = lo + Math.floor(Math.random()*(hi-lo+1));
    enemyEvolutions[k] = weightedPick(evoWeights);
  });
  enemyTowerLevel = lo + Math.floor(Math.random()*(hi-lo+1));
}

/* ---------- EVOLUÇÃO DAS CARTAS (via cópias de baús) ----------
   Cada carta pode evoluir até 5 vezes. Cada evolução NÃO desbloqueia
   nenhuma habilidade nova — ela só aumenta HP e ATK em uma porcentagem
   fixa, que se soma ao bônus normal de nível. O custo em cópias pra
   evoluir continua o mesmo de antes. */
let evolutions = {};
CARD_KEYS.forEach(k=>evolutions[k]=0);

const EVOLUTION_THRESHOLDS = {
  comum:    [10,30,100,200,400],
  raro:     [10,20,50,100,200],
  epico:    [10,20,40,80,150],
  lendaria: [5,10,20,40,80],
  mitico:   [5,10,20,35,60],
};
// Bônus percentual de HP e ATK por nível de evolução (índice = evoLvl, de 0 a 5).
// Evo 1: +20% | Evo 2: +40% | Evo 3: +60% | Evo 4: +80% | Evo 5: +110%
const EVOLUTION_STAT_BONUS = [0, 0.20, 0.40, 0.60, 0.80, 1.10];
// Cor do contorno da carta de acordo com o nível de evolução atual (0 a 5).
const EVOLUTION_BORDER_COLORS = ['#2ECC71','#4FC3F7','#FFD93D','#FF8C42','#E53935','#111111'];
function evoBorderColor(evoLvl){
  return EVOLUTION_BORDER_COLORS[Math.max(0,Math.min(5,evoLvl||0))];
}
function evoStatMult(evoLvl){
  return 1 + (EVOLUTION_STAT_BONUS[evoLvl||0] || 0);
}
const MAX_EVO = 5;
function maxEvoFor(key){ return MAX_EVO; }
function canEvolve(key){
  const c = CARD_TYPES[key];
  const lvl = evolutions[key]||0;
  if(lvl>=maxEvoFor(key)) return false;
  const need = EVOLUTION_THRESHOLDS[c.rarity][lvl];
  return (collection[key]||0) >= need;
}
function evolveCard(key){
  if(!canEvolve(key)) return;
  const c = CARD_TYPES[key];
  const lvl = evolutions[key]||0;
  const need = EVOLUTION_THRESHOLDS[c.rarity][lvl];
  evolutions[key] = lvl+1;
  collection[key] = Math.max(0, (collection[key]||0) - need); // gasta só a quantidade necessária, mantém o excedente
  saveGame();
  renderCollectionScreen();
}

function cardsByRarity(rarity, banner){
  return CARD_KEYS.filter(k=>CARD_TYPES[k].rarity===rarity && (!banner || CARD_TYPES[k].banner===banner));
}

/* ---------- GARANTIA DOS 2 PRIMEIROS BAÚS (anti-início frustrado) ----------
   O jogador começa com pouquíssima moeda (3🪙) e só o deck inicial
   desbloqueado. Se o sorteio normal desse azar logo de cara e devolvesse
   cartas repetidas (que o jogador já tem), a sensação de progresso no
   começo do jogo fica ruim. Pra evitar isso, os 2 primeiros baús abertos
   em cada conta/campanha — não importa qual baú for escolhido — sempre
   saem como carta Comum NOVA (uma que o jogador ainda não tem). A partir
   do 3º baú em diante, o sorteio volta a ser 100% normal (pelas odds de
   cada baú) pro resto da campanha, pra sempre. */
const CHEST_GUARANTEE_LIMIT = 2;
function pickGuaranteedNewCommon(excludeKeys){
  // Todas as cartas Comuns do jogo (qualquer banner/tema) que o jogador
  // ainda não tem nenhuma cópia, e que não foram usadas ainda nesse
  // mesmo baú (excludeKeys), pra nunca repetir dentro do próprio baú.
  const pool = cardsByRarity('comum').filter(k=>(collection[k]||0)===0 && !excludeKeys.includes(k));
  if(pool.length>0) return pool[Math.floor(Math.random()*pool.length)];
  // Rede de segurança: se por algum motivo já não sobrar nenhuma Comum
  // nova (coleção quase completa logo de cara — praticamente impossível
  // nos 2 primeiros baús), cai pro sorteio normal do baú/banner.
  return null;
}
// banner (opcional): se informado, só sorteia cartas daquele banner/tema.
// Se o banner não tiver nenhuma carta na raridade sorteada, cai pra outra
// raridade dentro do MESMO banner antes de desistir do filtro por completo.
const RARITY_ORDER = ['comum','raro','epico','lendaria','mitico'];
// As porcentagens do baú são reais, não decorativas: pra cada raridade que o
// baú oferece (com chance > 0), só entra no sorteio se o banner ativo tiver
// pelo menos 1 carta daquela raridade. As chances das raridades disponíveis
// são renormalizadas entre si (mantendo a proporção original do baú) — nunca
// "sobe" pra uma raridade melhor que não foi sorteada, e nunca pula direto
// pra Mítico só porque a raridade sorteada não existe naquele banner.
// Retorna o mapa {raridade: peso} das raridades que esse baú realmente pode
// sortear dado o banner ativo (interseção entre o que o baú oferece e o que
// o banner tem carta). Usado tanto pelo sorteio quanto pra decidir se um baú
// deve aparecer na loja durante essa janela.
function availableRaritiesForChest(chest, banner){
  const available = {};
  let total = 0;
  for(const rar of RARITY_ORDER){
    const w = chest.odds[rar]||0;
    if(w<=0) continue;
    if(cardsByRarity(rar, banner).length>0){
      available[rar] = w;
      total += w;
    }
  }
  return {available, total};
}
// Um baú só deve ser exibido/comprável num banner se existir pelo menos uma
// raridade em comum entre o que o baú oferece e o que o banner tem carta.
// Ex.: Baú Místico nunca oferece Comum, e o banner Construções só tem carta
// Comum → não há interseção, então o Baú Místico não aparece nesse banner
// (não faz sentido "forçar" uma carta Comum saindo de um baú que promete
// nunca dar Comum, nem vazar pra outro banner — mais simples e correto é
// simplesmente não oferecer esse baú específico nessa janela).
function chestAvailableForBanner(chest, banner){
  return availableRaritiesForChest(chest, banner).total > 0;
}
function drawCardFromChest(chest, banner){
  const {available, total} = availableRaritiesForChest(chest, banner);
  let rarity = null;
  if(total>0){
    const r = Math.random()*total;
    let acc = 0;
    for(const rar of RARITY_ORDER){
      if(!(rar in available)) continue;
      acc += available[rar];
      if(r<=acc){ rarity = rar; break; }
    }
    if(!rarity) rarity = Object.keys(available)[Object.keys(available).length-1];
  }
  if(rarity){
    const pool = cardsByRarity(rarity, banner);
    return pool[Math.floor(Math.random()*pool.length)];
  }
  // Não deveria acontecer: a tela de Baús já filtra com chestAvailableForBanner()
  // pra nunca deixar comprar um baú sem nenhuma raridade compatível com o
  // banner ativo. Isso aqui é só uma rede de segurança de última instância
  // pra nunca travar a compra.
  const anyBannerPool = CARD_KEYS.filter(k=>CARD_TYPES[k].banner===banner);
  if(anyBannerPool.length) return anyBannerPool[Math.floor(Math.random()*anyBannerPool.length)];
  return CARD_KEYS[Math.floor(Math.random()*CARD_KEYS.length)];
}

function chestCardHTML(c, banner){
  const multiN = bestAffordableMulti(c);
  // Mostra as chances REAIS pro banner ativo, não as chances "base" do baú.
  // Antes disso, o card sempre mostrava, por exemplo, "Lendária 20%" mesmo
  // quando o banner ativo (ex.: Feitiços, Construções, Demônios...) não tem
  // nenhuma carta Lendária — essa fatia nunca podia realmente sair, só que a
  // tela continuava anunciando ela como se pudesse, dando a impressão de que
  // "não girava" pra lendária. Agora a % exibida já vem renormalizada entre
  // só as raridades que esse banner realmente tem, então o que a tela promete
  // é exatamente o que pode sair.
  const {available} = availableRaritiesForChest(c, banner.id);
  const total = Object.values(available).reduce((a,b)=>a+b,0);
  const oddsHTML = Object.entries(available)
    .map(([r,v])=>{
      const pct = total>0 ? (v/total)*100 : 0;
      return `<span style="color:${RARITY_INFO[r].color}">${RARITY_INFO[r].label} ${pct<1?'<1':Math.round(pct)}%</span>`;
    }).join(' &nbsp;·&nbsp; ');
  return `<div class="chest-card" style="background:linear-gradient(180deg,${c.color1},${c.color2});">
      <div class="chest-emoji">${c.emoji}</div>
      <div class="chest-name">${c.name}</div>
      <div class="chest-odds">${oddsHTML}</div>
      <div class="chest-btn-row">
        <button class="menu-btn btn-chest" style="padding:10px 18px;" onclick="buyChest('${c.id}',1)">Abrir 1 — ${c.price} 🪙</button>
        ${multiN ? `<button class="menu-btn btn-multi" style="padding:10px 18px;" onclick="buyChest('${c.id}',${multiN})">Abrir ${multiN} — ${c.price*multiN} 🪙</button>` : ''}
      </div>
    </div>`;
}
function bestAffordableMulti(chest){
  for(let n=maxChestOpen; n>=2; n--){
    if(chest.price*n <= coins) return n;
  }
  return null;
}
// Sempre resorteia o banner ativo pelo relógio no momento da compra, pra garantir
// que a compra bate exatamente com o banner mostrado na tela (mesmo se a janela
// tiver virado no instante entre renderizar a tela e clicar no botão).
function buyChest(id, count){
  count = Math.max(1, Math.min(count||1, maxChestOpen));
  const chest = CHESTS.find(c=>c.id===id);
  if(!chest) return;
  const banner = currentShopBanner();
  if(!chestAvailableForBanner(chest, banner.id)){
    // Defensivo: a tela já não mostra o botão nesse caso, mas se a janela
    // virou entre renderizar e clicar, não deixa comprar um baú que não
    // teria carta compatível pra sortear com o banner novo.
    renderChestsScreen();
    return;
  }
  const totalPrice = chest.price*count;
  if(coins<totalPrice){ alert('Moedas insuficientes!'); return; }
  coins -= totalPrice;
  const drawn = [];
  for(let j=0;j<count;j++){
    const chestDrawnKeys = []; // cartas já saídas NESSE baú específico (evita repetir dentro do mesmo baú durante a garantia)
    const useGuarantee = chestsOpenedCount < CHEST_GUARANTEE_LIMIT;
    for(let i=0;i<CARDS_PER_CHEST;i++){
      let key = useGuarantee ? pickGuaranteedNewCommon(chestDrawnKeys) : null;
      if(!key) key = drawCardFromChest(chest, banner.id); // sorteio normal (garantia esgotada ou coleção já completa)
      chestDrawnKeys.push(key);
      collection[key] = (collection[key]||0)+1;
      drawn.push(key);
    }
    chestsOpenedCount++; // conta esse baú como aberto, independe de qual tipo/raridade foi
  }
  saveGame();
  renderChestResult(chest, banner, drawn);
}
function renderChestResult(chest, banner, drawn){
  const el = document.getElementById('chests-screen');
  el.innerHTML = `
    <div class="coin-pill">🪙 <span>${coins}</span></div>
    <h2 class="section-title">${chest.emoji} ${banner.emoji} Você recebeu:</h2>
    <div id="chest-result-list">
      ${drawn.map(k=>{
        const c = CARD_TYPES[k];
        const evoLvl = evolutions[k]||0;
        const lvl = cardLevels[k]||1;
        return `<div class="result-card" style="border-color:${evoBorderColor(evoLvl)}">
          <div class="result-art">${cardVisualHTML(k)}</div>
          <div class="evo-level-pill result-level" style="background:${evoBorderColor(evoLvl)}">Nv ${lvl}</div>
        </div>`;
      }).join('')}
    </div>
    <button class="menu-btn btn-play" style="margin-top:16px;width:200px;padding:12px;" onclick="renderChestsScreen()">Continuar</button>
  `;
}
// Atualiza só o texto da contagem regressiva (não re-renderiza a tela toda).
function updateShopRotationCountdown(){
  const msLeft = Math.max(0, SHOP_ROTATION_MS - shopBannerElapsedMs);
  const totalSec = Math.ceil(msLeft/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  const span = document.getElementById('shop-rotation-countdown');
  if(span) span.textContent = `${mm}:${ss}`;
}
// Ticker global do banner da loja: roda a cada 1s e SÓ soma tempo quando o
// jogo está aberto e visível (aba em primeiro plano) — é isso que faz a
// troca ser por TEMPO DE JOGO e não por tempo real. Enquanto o jogo está
// fechado/minimizado nenhum tick roda, então shopBannerElapsedMs fica
// parado exatamente onde estava e o banner não muda sozinho nesse meio tempo.
let lastShopTickAt = Date.now();
setInterval(()=>{
  const now = Date.now();
  const dt = now - lastShopTickAt;
  lastShopTickAt = now;
  if(document.hidden) return; // app em segundo plano: não conta como tempo de jogo
  // trava o dt em no máximo 2s: se o navegador atrasou o tick (aba estava
  // ocupada, throttling, etc.), evita somar um salto gigante de uma vez.
  const safeDt = Math.max(0, Math.min(dt, 2000));
  const changed = tickShopBanner(safeDt);
  const scr = document.getElementById('chests-screen');
  if(!scr || scr.classList.contains('hidden')) return;
  if(changed){
    renderChestsScreen(); // o banner trocou: re-renderiza a loja com o banner novo
  } else {
    updateShopRotationCountdown();
  }
}, 1000);
// Ao voltar a ficar visível (o jogador reabriu/trouxe a aba pra frente),
// realinha o relógio interno pra não contar de forma retroativa o tempo em
// que a aba ficou em segundo plano.
document.addEventListener('visibilitychange', ()=>{
  lastShopTickAt = Date.now();
});

let cardFilter = 'all';   // 'all' | 'comum' | 'raro' | 'epico' | 'lendaria'
let cardSort = 'default'; // 'default' | 'cost' | 'level'
function getFilteredSortedKeys(){
  let keys = CARD_KEYS.slice();
  if(cardFilter!=='all') keys = keys.filter(k=>CARD_TYPES[k].rarity===cardFilter);
  if(cardSort==='cost'){
    keys.sort((a,b)=> CARD_TYPES[a].cost - CARD_TYPES[b].cost);
  } else if(cardSort==='level'){
    keys.sort((a,b)=> (cardLevels[a]||1) - (cardLevels[b]||1));
  }
  // Prioriza as cartas que o jogador já tem (aparecem primeiro); as travadas
  // (cadeado) sempre vão pro final da lista. Sort estável — a ordenação de
  // custo/nível escolhida acima continua valendo dentro de cada grupo.
  keys.sort((a,b)=>{
    const ownedA = (collection[a]||0)>0 ? 0 : 1;
    const ownedB = (collection[b]||0)>0 ? 0 : 1;
    return ownedA - ownedB;
  });
  return keys;
}
function filterPillHTML(r){
  const active = cardFilter===r;
  const label = r==='all' ? 'Todas' : RARITY_INFO[r].label;

/* ---------- ARRASTAR/REMOVER CARTAS DO DECK ---------- */
let deckDragState = {active:false, dragging:false, fromIdx:null, startX:0, startY:0, ghost:null, pointerId:null, sourceEl:null, overIdx:null};

function beginDeckDrag(e, idx){
  e.stopPropagation();
  const el = e.currentTarget;
  deckDragState = {active:true, dragging:false, fromIdx:idx, startX:e.clientX, startY:e.clientY,
                    ghost:null, pointerId:e.pointerId, sourceEl:el, overIdx:idx};
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  el.addEventListener('pointermove', onDeckDragMove);
  el.addEventListener('pointerup', onDeckDragEnd);
  el.addEventListener('pointercancel', onDeckDragCancel);
}
function onDeckDragMove(e){
  if(!deckDragState.active) return;
  const dx = e.clientX-deckDragState.startX, dy = e.clientY-deckDragState.startY;
  if(!deckDragState.dragging && Math.hypot(dx,dy) > 10){
    deckDragState.dragging = true;
    if(deckDragState.sourceEl) deckDragState.sourceEl.style.opacity = '0.3';
    const key = selectedDeck[deckDragState.fromIdx];
    const c = CARD_TYPES[key];
    const g = document.createElement('div');
    g.className = 'deck-drag-ghost';
    g.innerHTML = `<div class="emoji">${cardVisualHTML(key)}</div><div class="cname">${c.name}</div>`;
    document.body.appendChild(g);
    deckDragState.ghost = g;
  }
  if(deckDragState.dragging && deckDragState.ghost){
    deckDragState.ghost.style.left = e.clientX+'px';
    deckDragState.ghost.style.top = e.clientY+'px';
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const slotEl = el ? el.closest('.deck-slot') : null;
    document.querySelectorAll('.deck-slot.drag-over').forEach(s=>s.classList.remove('drag-over'));
    if(slotEl){
      slotEl.classList.add('drag-over');
      deckDragState.overIdx = Number(slotEl.dataset.idx);
    }
  }
}
function onDeckDragEnd(e){
  if(!deckDragState.active) return;
  if(deckDragState.dragging){
    const from = deckDragState.fromIdx, to = deckDragState.overIdx;
    if(to!==null && to!==from) moveDeckCard(from, to);
  } else {
    // toque simples (sem arrastar) -> remove a carta do deck
    if(deckDragState.fromIdx < selectedDeck.length){
      selectedDeck.splice(deckDragState.fromIdx, 1);
      saveGame();
    }
  }
  finishDeckDrag();
}
function onDeckDragCancel(){ finishDeckDrag(); }
function finishDeckDrag(){
  const el = deckDragState.sourceEl;
  if(el){
    el.removeEventListener('pointermove', onDeckDragMove);
    el.removeEventListener('pointerup', onDeckDragEnd);
    el.removeEventListener('pointercancel', onDeckDragCancel);
    try{ el.releasePointerCapture(deckDragState.pointerId); }catch(err){}
    el.style.opacity = '';
  }
  if(deckDragState.ghost) deckDragState.ghost.remove();
  document.querySelectorAll('.deck-slot.drag-over').forEach(s=>s.classList.remove('drag-over'));
  deckDragState = {active:false, dragging:false, fromIdx:null, ghost:null, pointerId:null, sourceEl:null, overIdx:null};
  renderCollectionScreen();
}
function moveDeckCard(from, to){
  if(from<0 || from>=selectedDeck.length) return;
  const [item] = selectedDeck.splice(from,1);
  const insertAt = Math.min(to, selectedDeck.length);
  selectedDeck.splice(insertAt,0,item);
  saveGame();
}
function toggleDeckMembership(key){
  if(selectedDeck.includes(key)){
    selectedDeck = selectedDeck.filter(k=>k!==key);
  } else {
    if(selectedDeck.length>=DECK_SIZE){ alert(`Seu deck já tem ${DECK_SIZE} cartas! Remova uma antes de adicionar essa.`); return; }
    if(CARD_TYPES[key].rarity==='mitico' && selectedDeck.some(k=>CARD_TYPES[k].rarity==='mitico')){
      alert('Você só pode ter 1 carta Mítica no deck! Remova a mítica atual antes de adicionar outra.');
      return;
    }
    selectedDeck.push(key);
  }
  saveGame();
  renderCollectionScreen();
}
function speedLabel(def){ return (def.speed/70).toFixed(1)+'x'; }
function rangeLabel(def){ return def.range<=30?'Curto':(def.range<=100?'Médio':'Longo'); }

function collectionCardHTML(k){
  const c = CARD_TYPES[k]; const ri = RARITY_INFO[c.rarity];
  const owned = collection[k]||0;
  // Carta ainda não desbloqueada: mostra só nome, foto e cadeado — nada de status,
  // nível, raridade ou botões, pra não entregar informação de carta que o jogador
  // ainda não tem.
  if(owned<=0){
    return `<div class="collection-card cc-locked" style="border-color:${evoBorderColor(0)}">
        <div class="cc-art-wrap">
          <div class="cc-art cc-emoji-locked">${cardVisualHTML(k)}</div>
          <div class="cc-lock">🔒</div>
        </div>
        <div class="cc-body">
          <div class="cc-name">${c.name}</div>
        </div>
      </div>`;
  }
  const lvl = cardLevels[k]||1;
  const cost = levelUpCost(k);
  const evoLvl = evolutions[k]||0;

/* ---------- CICLO DE BARALHO (idêntico ao Clash) ---------- */
function makeDeck(){ return CARD_KEYS.slice(); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Embaralha, mas dando peso por raridade de acordo com a arena (ver
// ARENA_RARITY_WEIGHTS) — cartas de raridade favorecida tendem a vir
// primeiro na lista, o que faz elas serem escolhidas com mais prioridade
// na montagem do baralho da IA.
function weightedShuffleByRarity(keys, arenaIdx){
  const weights = ARENA_RARITY_WEIGHTS[clamp(arenaIdx||0, 0, ARENA_RARITY_WEIGHTS.length-1)];
  const pool = keys.map(k=>({ k, w: Math.max(0.001, weights[CARD_TYPES[k].rarity] || 0.001) }));
  const result = [];
  while(pool.length){
    const total = pool.reduce((s,o)=>s+o.w, 0);
    let r = Math.random()*total, idx=0, acc=0;
    for(; idx<pool.length; idx++){
      acc += pool[idx].w;
      if(r<=acc) break;
    }
    if(idx>=pool.length) idx = pool.length-1;
    result.push(pool[idx].k);
    pool.splice(idx,1);
  }
  return result;
}

/* ---------- CLASSIFICAÇÃO DE CARTAS (usada pela IA pra montar deck e jogar) ---------- */
function ctIsSpell(def){ return !!def.isSpell; }
function ctIsBuilding(def){ return !!def.isBuilding; }
function ctIsTank(def){ return !ctIsSpell(def) && !ctIsBuilding(def) && (!!def.giant || (def.hp||0)>=45); }
function ctIsSplash(def){ return !!(def.splashRadius || def.meleeSplash || (ctIsSpell(def) && (def.dmg||0)>0 && def.spellRadius)); }
function ctIsFastCheap(def){ return !ctIsSpell(def) && !ctIsBuilding(def) && (def.cost||0)<=3 && (def.speed||0)>=40; }
function ctUnitsCount(def){ return def.swarmCount || (def.twin?2:1); }
function ctDps(def){ return (def.dmg||0) * (1000/(def.atkSpeed||1000)) * ctUnitsCount(def); }
function ctEffHp(def){ return (def.hp||0) * ctUnitsCount(def); }

function makeEnemyDeck(arenaIdx){
  // baralho com regras pra garantir que a IA nunca fique com um deck cheio
  // de construção/feitiço — ela precisa de tropas de verdade pra conseguir
  // atacar e defender — e também que a raridade das cartas faça sentido com
  // a arena (arena 1 é praticamente só comum, e raridades mais altas vão
  // surgindo aos poucos conforme a arena avança).
  const pool = weightedShuffleByRarity(CARD_KEYS, arenaIdx);
  const spellKeys    = pool.filter(k=>ctIsSpell(CARD_TYPES[k]));
  const buildingKeys = pool.filter(k=>ctIsBuilding(CARD_TYPES[k]));
  const troopKeys    = pool.filter(k=>!ctIsSpell(CARD_TYPES[k]) && !ctIsBuilding(CARD_TYPES[k]));

  let spellCount = 1 + (Math.random()<0.4 ? 1 : 0);        // 1 ou 2 feitiços
  let buildingCount = Math.random()<0.55 ? 1 : (Math.random()<0.25 ? 2 : 0); // 0, 1 ou 2 construções
  const MAX_NON_TROOP = 3; // nunca mais que 3 das 8 cartas sem tropa (garante >=5 tropas)
  if(spellCount+buildingCount > MAX_NON_TROOP) buildingCount = Math.max(0, MAX_NON_TROOP-spellCount);
  spellCount = Math.min(spellCount, spellKeys.length);
  buildingCount = Math.min(buildingCount, buildingKeys.length);

  let deck = [];
  deck.push(...spellKeys.slice(0, spellCount));
  deck.push(...buildingKeys.slice(0, buildingCount));
  const remaining = DECK_SIZE - deck.length;
  deck.push(...troopKeys.slice(0, remaining));
  if(deck.length < DECK_SIZE){
    for(const k of pool){
      if(deck.length>=DECK_SIZE) break;
      if(!deck.includes(k)) deck.push(k);
    }
  }

  function ensure(predicate, sourceList){
    if(deck.some(k=>predicate(CARD_TYPES[k]))) return;
    const candidate = sourceList.find(k=>predicate(CARD_TYPES[k]) && !deck.includes(k));
    if(!candidate) return;
    const troopIdxs = deck.map((k,i)=>({k,i}))
      .filter(o=>!ctIsSpell(CARD_TYPES[o.k]) && !ctIsBuilding(CARD_TYPES[o.k]))
      .map(o=>o.i);
    if(troopIdxs.length===0) return;
    const idx = troopIdxs[Math.floor(Math.random()*troopIdxs.length)];
    deck[idx] = candidate;
  }
  ensure(ctIsTank, troopKeys);
  ensure(ctIsSplash, pool);
  ensure(ctIsFastCheap, troopKeys);

  return shuffleArray(deck.slice(0, DECK_SIZE));
}

function currentHand(deck){ return deck.slice(0,4); }
function nextCard(deck){ return deck[4]; }
function playFromDeck(deck, idx){
  const card = deck.splice(idx,1)[0];
  deck.push(card);
  return card;
}

/* ---------- CARROSSEL (arrastar) ---------- */
function setupCarousel(){
  const wrap = document.getElementById('carousel-wrap');
  const track = document.getElementById('carousel-track');
  const n = ARENAS.length;
  track.style.width = (n*100)+'%';
  document.querySelectorAll('.arena-slide').forEach(s=>{ s.style.width = (100/n)+'%'; });
  let startX=0, deltaX=0, dragging=false;

  const onDown = (x)=>{ dragging=true; startX=x; deltaX=0; track.style.transition='none'; };
  const onMove = (x)=>{
    if(!dragging) return;
    deltaX = x-startX;
    track.style.transform = `translateX(calc(${-(carouselIndex*100/n)}% + ${deltaX}px))`;
  };
  const onUp = ()=>{
    if(!dragging) return;
    dragging=false;
    track.style.transition='transform .3s cubic-bezier(.22,.9,.4,1)';
    if(deltaX < -50 && carouselIndex<n-1) carouselIndex++;
    else if(deltaX > 50 && carouselIndex>0) carouselIndex--;
    goToSlide(carouselIndex);
  };

  wrap.onpointerdown = (e)=>onDown(e.clientX);
  wrap.onpointermove = (e)=>onMove(e.clientX);
  wrap.onpointerup = onUp;
  wrap.onpointerleave = onUp;

  document.querySelectorAll('.dot').forEach(dot=>{
    dot.onclick = ()=>{ carouselIndex = Number(dot.dataset.i); goToSlide(carouselIndex); };
  });
}
function goToSlide(i){
  const track = document.getElementById('carousel-track');
  const n = ARENAS.length;
  track.style.transform = `translateX(${-(i*100/n)}%)`;
  document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('active', idx===i));
  applyMenuTheme(i);
}

/* ============================================================
   INÍCIO DA BATALHA
   ============================================================ */
function startBattle(arenaIdx){
  ensureValidDeck();
  if(selectedDeck.length < DECK_SIZE){
    alert(`Monte seu deck com ${DECK_SIZE} cartas antes de batalhar! Vá em 🃏 Cartas.`);
    openCollection();
    return;
  }
  const bet = selectedArenaBet[arenaIdx];
  if(bet<=0 || bet>coins){ alert('Moedas insuficientes para essa aposta!'); return; }
  currentBet = bet;
  activeArena = ARENAS[arenaIdx];
  coins -= currentBet;

  const betIdx = Math.max(0, activeArena.bets.indexOf(bet));
  rollEnemyLevels(arenaIdx, betIdx);

  playerDeck = selectedDeck.slice();
  enemyDeck = makeEnemyDeck(arenaIdx);
  towers = buildTowers();
  troops = [];
  mythicTroopOrder = [];
  activeMythicTroopId = null;
  document.getElementById('mythic-ability-btn').classList.add('hidden');
  projectiles = [];
  particles = [];
  beams = [];
  spellEffects = [];
  buffZones = [];
  pendingExplosions = [];
  playerElixir = 5; enemyElixir = 5;
  elixirAccum = 0; enemyElixirAccum = 0;
  elixirRegenMs = 2800;
  matchTime = 180;
  suddenDeath = false;
  doubleElixir = false;
  selectedSlot = null;
  aiTimer = 0;
  aiState = { comboPending:null };
  paused = false;

  document.getElementById('suddendeath-banner').classList.add('hidden');
  document.getElementById('double-banner').classList.add('hidden');
  document.getElementById('pause-overlay').classList.add('hidden');
  show('battle-screen');
  canvas = document.getElementById('arena');
  // ---------- ALTA RESOLUÇÃO (HiDPI) ----------
  // O canvas tinha resolução fixa (494x780px) mesmo em telas retina/alta
  // densidade, então o navegador esticava a imagem e tudo ficava borrado.
  // Aqui a "tela de desenho" real (canvas.width/height) passa a ter várias
  // vezes mais pixels — o tamanho exibido na tela continua o mesmo (W x H
  // em CSS), só que agora cada pixel do jogo é desenhado com muito mais
  // detalhe por trás, ficando nítido em qualquer celular.
  CANVAS_DPR = Math.min(window.devicePixelRatio || 1, 3); // teto de 3x pra não pesar demais
  canvas.width = Math.round(W*CANVAS_DPR);
  canvas.height = Math.round(H*CANVAS_DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(CANVAS_DPR,0,0,CANVAS_DPR,0,0);
  canvas.onclick = onCanvasClick;

  renderHand();
  running = true;
  lastFrame = performance.now();
  requestAnimationFrame(loop);
}
