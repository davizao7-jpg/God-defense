/* ============================================================
   LOOP PRINCIPAL
   ============================================================ */
function loop(ts){
  if(!running) return;
  if(paused){ requestAnimationFrame(loop); lastFrame = ts; return; }
  const dt = Math.min(ts-lastFrame, 60);
  lastFrame = ts;

  updateElixir(dt);
  updateTimer(dt);
  updateAI(dt);
  updateTroops(dt);
  updateTowers(dt);
  updateRegen(dt);
  updateIceSlow(dt);
  updateBlindness(dt);
  updateBleeds(dt);
  updateFireLances(dt);
  updateBuildingDecay(dt);
  updateInvisCloak(dt);
  updatePendingExplosions(dt);
  updateProjectiles(dt);
  updateBeams(dt);
  updateSpellEffects(dt);
  updateBuffZones(dt);
  updateParticles(dt);
  updateMythicAbilityUI(dt);
  if(shakeMag>0) shakeMag = Math.max(0, shakeMag - dt*0.045);
  draw();
  checkWinConditions();

  requestAnimationFrame(loop);
}

/* ---------- HABILIDADE ATIVA (cartas MÍTICAS) ---------- */
function updateMythicAbilityUI(dt){
  const btn = document.getElementById('mythic-ability-btn');
  if(!btn) return;
  // mantém na lista só tropas do jogador ainda vivas em campo
  mythicTroopOrder = mythicTroopOrder.filter(id => troops.some(t=>t.id===id && t.owner==='player' && t.state!=='dying'));
  // só a última mítica colocada mostra o botão
  activeMythicTroopId = mythicTroopOrder.length ? mythicTroopOrder[mythicTroopOrder.length-1] : null;

  if(activeMythicTroopId===null){ btn.classList.add('hidden'); return; }
  const troop = troops.find(t=>t.id===activeMythicTroopId);
  const def = troop ? CARD_TYPES[troop.key] : null;
  const ability = def ? def.activeAbility : null;
  if(!troop || !ability){ btn.classList.add('hidden'); return; }

  if(troop.abilityCooldownRemaining>0){
    troop.abilityCooldownRemaining = Math.max(0, troop.abilityCooldownRemaining - dt);
  }
  const ready = troop.abilityCooldownRemaining<=0;
  const canAfford = playerElixir >= ability.cost;

  btn.classList.remove('hidden');
  btn.classList.toggle('on-cooldown', !ready);
  btn.classList.toggle('cant-afford', ready && !canAfford);
  document.getElementById('mythic-ability-emoji').textContent = ready ? '✨' : Math.ceil(troop.abilityCooldownRemaining/1000)+'s';
  document.getElementById('mythic-ability-cost').textContent = ready ? ability.cost : '';
}
function activateMythicAbility(){
  if(!running || paused || activeMythicTroopId===null) return;
  const troop = troops.find(t=>t.id===activeMythicTroopId);
  if(!troop) return;
  const def = CARD_TYPES[troop.key];
  const ability = def.activeAbility;
  if(!ability) return;
  if(troop.abilityCooldownRemaining>0) return;
  if(playerElixir < ability.cost){ flashInvalid(); return; }

  playerElixir -= ability.cost;
  troop.abilityCooldownRemaining = ability.cooldown;

  // ---------- Perdão (Breath wallenHaish) ----------
  // Cura 20% do HP, aumenta o próprio dano em 30% por um tempo e crava no chão
  // um círculo ritual azul/rosa/amarelo/vermelho/verde que causa 60% do dano em área.
  if(ability.key==='perdao'){
    // cura
    troop.hp = Math.min(troop.maxhp, troop.hp + troop.maxhp*ability.healPct);
    spawnBurst(troop.x, troop.y-14, 14, ['#8BFFAE','#DFFFE8','#FFFFFF'], 90, 10, 340);
    particles.push({x:troop.x,y:troop.y-14,kind:'flash',life:0,maxLife:150,r0:2,r1:22,color:'rgba(140,255,170,.9)'});

    // buff de dano PERMANENTE e acumulativo: cada uso soma mais um stack de +dmgBoostPct,
    // e o buff nunca expira enquanto a tropa estiver viva (só reinicia quando ela morre)
    troop.dmgBuffStacks = (troop.dmgBuffStacks||0) + 1;

    // círculo ritual multicolorido no chão
    spawnPerdaoRing(troop, ability);
  }

  // ---------- Mundo dos Sonhos (Jesus) ----------
  // Imobiliza (congela) todos os inimigos do campo de batalha por alguns segundos.
  if(ability.key==='dreamworld'){
    const freezeMs = ability.freezeMs || 4000;
    const oppOwner = troop.owner==='player' ? 'enemy' : 'player';
    for(const o of troops){
      if(o.owner!==oppOwner || o.state==='dying') continue;
      if(o.stunTimer!==undefined) o.stunTimer = Math.max(o.stunTimer||0, freezeMs);
    }
    // a arena inteira muda visualmente: chão fica coberto por cores neon
    // (verde, azul, vermelho, amarelo, rosa) se mexendo, durante o congelamento;
    // some assim que os inimigos voltam a se mexer
    spawnDreamworldFloor(freezeMs);
  }
}

/* ---------- MUNDO DOS SONHOS: chão neon multicolorido cobrindo a arena inteira ---------- */
function spawnDreamworldFloor(ms){
  spellEffects.push({kind:'dreamworldFloor', life:0, maxLife:ms});
}
function drawDreamworldFloor(){
  const NEON = [[57,255,20],[0,224,255],[255,26,70],[255,232,0],[255,45,220]]; // verde, azul, vermelho, amarelo, rosa
  for(const s of spellEffects){
    if(s.kind!=='dreamworldFloor') continue;
    const fadeIn = Math.min(1, s.life/280);
    const fadeOut = 1 - Math.max(0, (s.life-(s.maxLife-400))/400);
    const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
    if(alpha<=0) continue;
    const t = Date.now()/1000;

    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();

    // leve véu escuro pra as cores neon contrastarem no chão
    ctx.globalAlpha = 0.35*alpha;
    ctx.fillStyle = '#050014';
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation = 'lighter';
    NEON.forEach(([r,g,b],i)=>{
      const speed = 0.32 + i*0.06;
      const bx = W/2 + Math.sin(t*speed + i*1.9) * (W*0.44);
      const by = H/2 + Math.cos(t*speed*1.3 + i*2.3) * (H*0.44);
      const rad = 105 + Math.sin(t*0.7 + i*1.4) * 26;
      const grad = ctx.createRadialGradient(bx,by,0,bx,by,rad);
      grad.addColorStop(0, `rgba(${r},${g},${b},${0.5*alpha})`);
      grad.addColorStop(0.6, `rgba(${r},${g},${b},${0.22*alpha})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(bx,by,rad,0,Math.PI*2); ctx.fill();
    });

    // finas linhas neon serpenteando pelo chão, uma cor por vez
    ctx.lineWidth = 2.2;
    NEON.forEach(([r,g,b],i)=>{
      ctx.globalAlpha = 0.45*alpha;
      ctx.strokeStyle = `rgb(${r},${g},${b})`;
      ctx.shadowBlur = 10; ctx.shadowColor = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      for(let x=0;x<=W;x+=10){
        const y = H/2 + Math.sin(x*0.045 + t*(1.6+i*0.35) + i*1.3) * (H*0.34) + (i-2)*22;
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    });

    ctx.restore();
  }
}

/* ---------- CÍRCULO RITUAL DO PERDÃO (Breath wallenHaish) — efeito único: um aro
   no chão com cinco cores (azul, rosa, amarelo, vermelho, verde) que causa 60% do
   dano da tropa a tudo que estiver na área ao redor dela ---------- */
function spawnPerdaoRing(t, ability){
  const dmg = Math.round(t.dmg * (ability.ringDmgPct||0.6));
  const radius = ability.ringRadius || 130;
  const oppOwner = t.owner==='player' ? 'enemy' : 'player';
  for(const o of troops){
    if(o.owner!==oppOwner || o.state==='dying' || o.invisible) continue;
    if(dist(t,o) <= radius) applyDamage(o, dmg, false);
  }
  for(const tw of towers){
    if(tw.owner!==oppOwner || tw.hp<=0) continue;
    if(dist(t,tw) <= radius) applyDamage(tw, dmg, false);
  }

  const PERDAO_COLORS = ['#4FC3F7','#FF3CAC','#FFD93D','#FF4B3E','#2ECC71'];
  spellEffects.push({kind:'perdaoRing', x:t.x, y:t.y, radius, life:0, maxLife:700});
  spawnBurst(t.x, t.y, 30, PERDAO_COLORS, 190, 15, 480);
  particles.push({x:t.x,y:t.y,kind:'shockwave',life:0,maxLife:420,r0:8,r1:radius,color:'rgba(255,255,255,.35)'});
  particles.push({x:t.x,y:t.y,kind:'flash',life:0,maxLife:220,r0:4,r1:40,color:'rgba(255,255,255,.9)'});
  // pequenas chamas coloridas subindo ao longo da borda do círculo, uma cor por vez
  const flamesPerColor = 4;
  for(let i=0;i<PERDAO_COLORS.length*flamesPerColor;i++){
    const ang = (Math.PI*2/(PERDAO_COLORS.length*flamesPerColor))*i;
    const px = t.x + Math.cos(ang)*radius, py = t.y + Math.sin(ang)*radius*0.48;
    particles.push(mkParticle(px, py, (Math.random()-0.5)*8, -30-Math.random()*30,
      480+Math.random()*220, 5+Math.random()*4, PERDAO_COLORS[i%PERDAO_COLORS.length], 'fire'));
  }
}

/* ---------- ELIXIR ---------- */
function updateElixir(dt){
  elixirAccum += dt;
  enemyElixirAccum += dt;
  if(elixirAccum >= elixirRegenMs){
    elixirAccum -= elixirRegenMs;
    if(playerElixir<10){ playerElixir++; renderHand(); }
  }
  if(enemyElixirAccum >= elixirRegenMs){
    enemyElixirAccum -= elixirRegenMs;
    if(enemyElixir<10) enemyElixir++;
  }
  updateElixirBarUI();
}

/* ---------- TIMER / MORTE SÚBITA ---------- */
function updateTimer(dt){
  matchTime -= dt/1000;
  if(matchTime<0) matchTime=0;
  const m = Math.floor(matchTime/60), s = Math.floor(matchTime%60);
  document.getElementById('timer').textContent =
    (suddenDeath? '⚡ ' : '') + m+':'+String(s).padStart(2,'0');

  // Dobro: no último minuto de partida, o elixir passa a recarregar 2x mais rápido pros dois lados
  if(!doubleElixir && !suddenDeath && matchTime<=60 && matchTime>0){
    doubleElixir = true;
    elixirRegenMs = 1400;
    document.getElementById('double-banner').classList.remove('hidden');
  }

  if(matchTime<=0 && !suddenDeath){
    const pKingDown = towers.find(t=>t.id==='e_king').hp<=0;
    const eKingDown = towers.find(t=>t.id==='p_king').hp<=0;
    if(pKingDown || eKingDown) return;

    const playerDestroyed = towers.filter(t=>t.owner==='enemy' && t.kind==='princess' && t.hp<=0).length;
    const enemyDestroyed  = towers.filter(t=>t.owner==='player'&& t.kind==='princess' && t.hp<=0).length;

    if(playerDestroyed>enemyDestroyed) return endMatch(true, 'Você destruiu mais torres!');
    if(enemyDestroyed>playerDestroyed) return endMatch(false, 'O rival destruiu mais torres!');
    suddenDeath = true;
    elixirRegenMs = 1400;
    matchTime = 999999;
    document.getElementById('double-banner').classList.add('hidden');
    document.getElementById('suddendeath-banner').classList.remove('hidden');
    document.getElementById('timer').textContent='⚡ SÚBITA';
  }
}

/* ---------- IA DO INIMIGO ----------
   A IA joga em duas fases a cada decisão:
   1) DEFESA — se houver tropa(s) do jogador ameaçando as torres, ela reage:
      enxame -> dano em área/feitiço; ameaça só-contra-construção -> isca de
      construção num ponto estratégico; ameaça forte isolada -> melhor "conter"
      disponível na mão (prioriza alcance, HP e vantagem de dano).
   2) ATAQUE — sem ameaças, ela ataca com variedade: tropa rápida na ponte de
      surpresa, combo de tanque na frente + suporte atrás, isca de construção
      proativa, ou só uma jogada eficiente — sempre mirando o lado mais fraco
      do jogador.
*/
const AI_Y_MIN = 18;
const AI_Y_MAX = RIVER_Y0 - 18;
const AI_FRONT_Y = AI_Y_MAX;                                        // beira da ponte (ponto de interceptação)
const AI_MID_Y   = AI_Y_MIN + Math.round((AI_Y_MAX-AI_Y_MIN)*0.55);  // meio do território dela
const AI_BACK_Y  = AI_Y_MIN + Math.round((AI_Y_MAX-AI_Y_MIN)*0.18);  // fundo, perto da torre principal

function aiClampSpot(x,y){ return { x: clamp(x, 16, W-16), y: clamp(y, AI_Y_MIN, AI_Y_MAX) }; }

function getPlayerThreats(){
  // tropas do jogador que já cruzaram o rio, ou estão perto o bastante da
  // ponte pra já merecerem uma resposta da IA
  return troops.filter(t => t.owner==='player' && t.state!=='dying' && !t.invisible &&
    (t.crossed || t.y < RIVER_Y0 + 90));
}
function hasUrgentThreat(){
  const threats = getPlayerThreats();
  if(threats.length>=3) return true; // enxame grande
  for(const t of threats){
    if(!t.crossed) continue;
    for(const tw of towers){
      if(tw.owner==='enemy' && tw.hp>0 && dist(t,tw) <= (tw.range+90)) return true;
    }
  }
  return false;
}
function clusterThreatsByLane(threats){
  const lanes = { left:[], right:[] };
  for(const t of threats) lanes[t.x < W/2 ? 'left' : 'right'].push(t);
  return lanes;
}
function laneThreatScore(cluster){
  let s = 0;
  for(const t of cluster) s += (t.hp||0) + (t.dmg||0)*6;
  return s;
}
function counterScore(candidateDef, threatDef){
  let s = ctEffHp(candidateDef)*0.6 + ctDps(candidateDef)*3;
  if(candidateDef.ranged && !threatDef.ranged) s += 22;      // consegue "kitar" quem só bate de perto
  if((candidateDef.range||30) > (threatDef.range||30)) s += 12;
  if(ctIsSplash(candidateDef)) s += 10;                       // ajuda se vier escoltado
  if(threatDef.targetsOnly==='buildings' && candidateDef.isBuilding) s += 45;
  if((candidateDef.cost||1) <= (threatDef.cost||1)) s += 8;   // troca de elixir favorável
  return s;
}

// escolhe e joga a melhor resposta defensiva contra as ameaças atuais; true se jogou algo
function tryDefend(threats, affordable){
  const lanes = clusterThreatsByLane(threats);
  let laneKey=null, cluster=null, bestScore=-1;
  for(const lk of ['left','right']){
    if(lanes[lk].length===0) continue;
    const sc = laneThreatScore(lanes[lk]);
    if(sc>bestScore){ bestScore=sc; laneKey=lk; cluster=lanes[lk]; }
  }
  if(!cluster) return false;

  const isSwarmThreat = cluster.length>=3 || (cluster.length>=2 && cluster.every(t=>t.hp<=10));
  const mainThreat = cluster.reduce((a,b)=> (b.hp+b.dmg*4) > (a.hp+a.dmg*4) ? b : a);
  const mainDef = CARD_TYPES[mainThreat.key];
  const cx = cluster.reduce((s,t)=>s+t.x,0)/cluster.length;
  const cy = cluster.reduce((s,t)=>s+t.y,0)/cluster.length;

  // golpe de misericórdia: feitiço que mata a ameaça principal sozinho é sempre uma ótima troca
  const spellKill = affordable.filter(c=>c.def.isSpell && (c.def.dmg||0)>0)
    .find(c=> (statsAtLevel(c.k, enemyCardLevels[c.k]||1, enemyEvolutions[c.k]||0).dmg) >= mainThreat.hp*0.95);
  if(spellKill){
    enemyElixir -= spellKill.def.cost;
    playFromDeck(enemyDeck, spellKill.i);
    castSpell(spellKill.k, 'enemy', cx, cy);
    return true;
  }

  if(isSwarmThreat){
    // enxame: prioriza dano em área (feitiço ou tropa com splash)
    const splashOptions = affordable.filter(c=>ctIsSplash(c.def)).sort((a,b)=>ctDps(b.def)-ctDps(a.def));
    if(splashOptions.length>0){
      const c = splashOptions[0];
      enemyElixir -= c.def.cost;
      playFromDeck(enemyDeck, c.i);
      if(c.def.isSpell) castSpell(c.k, 'enemy', cx, cy);
      else { const s=aiClampSpot(laneBridgeX(laneKey), AI_FRONT_Y); spawnTroop(c.k,'enemy',s.x,s.y); }
      return true;
    }
    // sem dano em área na mão: manda o "corpo" com mais HP total pra segurar o enxame
    const bulky = affordable.filter(c=>!c.def.isSpell).sort((a,b)=>ctEffHp(b.def)-ctEffHp(a.def))[0];
    if(bulky){
      enemyElixir -= bulky.def.cost;
      playFromDeck(enemyDeck, bulky.i);
      const s = aiClampSpot(laneBridgeX(laneKey), AI_FRONT_Y);
      spawnTroop(bulky.k, 'enemy', s.x, s.y);
      return true;
    }
    return false;
  }

  // ameaça que só ataca construções (ex: gigante/titã): distrai com uma
  // construção num ponto estratégico mais pro meio do território, puxando
  // o bicho pra longe da torre principal
  if(mainDef.targetsOnly === 'buildings'){
    const buildingOptions = affordable.filter(c=>c.def.isBuilding).sort((a,b)=>ctEffHp(b.def)-ctEffHp(a.def));
    if(buildingOptions.length>0){
      const c = buildingOptions[0];
      enemyElixir -= c.def.cost;
      playFromDeck(enemyDeck, c.i);
      const s = aiClampSpot(mainThreat.x, AI_MID_Y);
      spawnTroop(c.k, 'enemy', s.x, s.y);
      return true;
    }
  }

  // ameaça forte isolada: procura o melhor "conter" disponível na mão
  const counters = affordable.filter(c=>!c.def.isSpell).sort((a,b)=>counterScore(b.def,mainDef)-counterScore(a.def,mainDef));
  if(counters.length>0){
    const c = counters[0];
    enemyElixir -= c.def.cost;
    playFromDeck(enemyDeck, c.i);
    const s = c.def.isBuilding ? aiClampSpot(mainThreat.x, AI_MID_Y)
                                : aiClampSpot(laneBridgeX(laneKey), AI_FRONT_Y);
    spawnTroop(c.k, 'enemy', s.x, s.y);
    return true;
  }

  // só resta feitiço utilitário (gelo/cólera/furacão): usa pra ao menos atrapalhar o avanço
  const utilitySpell = affordable.find(c=>c.def.isSpell);
  if(utilitySpell){
    enemyElixir -= utilitySpell.def.cost;
    playFromDeck(enemyDeck, utilitySpell.i);
    castSpell(utilitySpell.k, 'enemy', cx, cy);
    return true;
  }
  return false;
}

// depois de mandar um tanque pra ponte, manda o suporte (dano/alcance) atrás dele
function tryFollowUpCombo(affordable){
  const pending = aiState.comboPending;
  if(!pending) return false;
  if(Date.now() - pending.at > 6000){ aiState.comboPending = null; return false; }
  const support = affordable.filter(c=>!c.def.isSpell && !c.def.isBuilding && !ctIsTank(c.def))
    .sort((a,b)=>ctDps(b.def)-ctDps(a.def))[0];
  if(!support) return false;
  enemyElixir -= support.def.cost;
  playFromDeck(enemyDeck, support.i);
  const s = aiClampSpot(pending.x, pending.y - Math.round(45*ARENA_SCALE));
  spawnTroop(support.k, 'enemy', s.x, s.y);
  aiState.comboPending = null;
  return true;
}

// sem ameaças no campo: ataca com variedade, sempre mirando o lado mais fraco do jogador
function tryOffense(affordable){
  const pl = towers.find(t=>t.id==='p_left'), pr = towers.find(t=>t.id==='p_right');
  let laneKey = 'left';
  if(pl && pr){
    if(pl.hp<=0) laneKey='right';
    else if(pr.hp<=0) laneKey='left';
    else laneKey = pl.hp<=pr.hp ? 'left' : 'right';
  } else if(Math.random()<0.5) laneKey='right';
  if(Math.random()<0.25) laneKey = laneKey==='left' ? 'right' : 'left'; // imprevisibilidade

  const roll = Math.random();

  // 1) tropa rápida direto na ponte, de surpresa
  if(roll < 0.30){
    const fast = affordable.filter(c=>ctIsFastCheap(c.def)).sort((a,b)=>b.def.speed-a.def.speed)[0];
    if(fast){
      enemyElixir -= fast.def.cost;
      playFromDeck(enemyDeck, fast.i);
      const s = aiClampSpot(laneBridgeX(laneKey), AI_FRONT_Y);
      spawnTroop(fast.k, 'enemy', s.x, s.y);
      return;
    }
  }

  // 2) combo: tanque na frente agora, suporte vem assim que possível
  if(roll < 0.62){
    const tank = affordable.filter(c=>ctIsTank(c.def)).sort((a,b)=>ctEffHp(b.def)-ctEffHp(a.def))[0];
    if(tank){
      enemyElixir -= tank.def.cost;
      playFromDeck(enemyDeck, tank.i);
      const s = aiClampSpot(laneBridgeX(laneKey), AI_FRONT_Y);
      spawnTroop(tank.k, 'enemy', s.x, s.y);
      aiState.comboPending = { lane:laneKey, x:s.x, y:s.y, at:Date.now() };
      return;
    }
  }

  // 3) isca de construção proativa no meio do território, se ainda não tiver nenhuma em campo
  const hasBuildingOnField = troops.some(t=>t.owner==='enemy' && CARD_TYPES[t.key].isBuilding && t.state!=='dying');
  if(!hasBuildingOnField && roll < 0.78){
    const building = affordable.find(c=>c.def.isBuilding);
    if(building){
      enemyElixir -= building.def.cost;
      playFromDeck(enemyDeck, building.i);
      const s = aiClampSpot(W/2 + (Math.random()-0.5)*60, AI_MID_Y);
      spawnTroop(building.k, 'enemy', s.x, s.y);
      return;
    }
  }

  // 4) padrão: joga uma carta razoavelmente eficiente pra manter a pressão
  const nonSpellOptions = affordable.filter(c=>!c.def.isSpell);
  const pool = (nonSpellOptions.length>0 ? nonSpellOptions : affordable).sort((a,b)=>b.def.cost-a.def.cost);
  const pick = pool[Math.floor(Math.random()*Math.min(2,pool.length))];
  if(!pick) return;
  enemyElixir -= pick.def.cost;
  playFromDeck(enemyDeck, pick.i);
  if(pick.def.isSpell){
    const x = 30 + Math.random()*(W-60);
    const y = RIVER_Y1+20 + Math.random()*(H-RIVER_Y1-40);
    castSpell(pick.k, 'enemy', x, y);
  } else {
    const s = aiClampSpot(laneBridgeX(laneKey) + (Math.random()-0.5)*40, AI_MID_Y + (Math.random()-0.5)*30);
    spawnTroop(pick.k, 'enemy', s.x, s.y);
  }
}

function updateAI(dt){
  if(aiTimer>0){
    if(aiTimer>320 && hasUrgentThreat()) aiTimer = 320; // reage mais rápido a perigo iminente
    aiTimer -= dt;
  }
  if(aiTimer>0) return;
  aiTimer = 650 + Math.random()*900;

  const hand = currentHand(enemyDeck).map((k,i)=>({k, i, def:CARD_TYPES[k]}));
  const affordable = hand.filter(c=>c.def.cost <= enemyElixir);
  if(affordable.length===0) return;

  const threats = getPlayerThreats();
  if(threats.length>0 && tryDefend(threats, affordable)) return;

  if(aiState.comboPending && tryFollowUpCombo(affordable)) return;

  if(Math.random()<0.2) return; // segura elixir de vez em quando, como um jogador de verdade

  tryOffense(affordable);
}

/* ---------- CARTAS NA MÃO (UI) ---------- */
function renderHand(){
  if(dragState.active) return; // não redesenha a mão enquanto uma carta está sendo arrastada
  const hand = currentHand(playerDeck);
  hand.forEach((key,i)=>{
    const c = CARD_TYPES[key];
    const el = document.getElementById('card-'+i);
    const affordable = c.cost<=Math.floor(playerElixir);
    const evoLvl = evolutions[key]||0;
    const lvl = cardLevels[key]||1;
    el.style.background = `linear-gradient(180deg, ${c.color}, ${shade(c.color,-25)})`;
    el.style.borderColor = (selectedSlot===i) ? '#FFD93D' : evoBorderColor(evoLvl);
    el.style.borderWidth = '3px';
    el.innerHTML = `<div class="card-art">${cardVisualHTML(key)}</div>
                     <div class="cost-badge ${affordable?'':'cant'}">${c.cost}</div>
                     <div class="evo-level-pill card-slot-level" style="background:${evoBorderColor(evoLvl)}">Nv ${lvl}</div>`;
    el.classList.toggle('selected', selectedSlot===i);
    el.onpointerdown = (e)=>beginCardDrag(e,i);
  });
  const nx = nextCard(playerDeck);
  const nc = CARD_TYPES[nx];
  document.getElementById('next-card').innerHTML = cardVisualHTML(nx);
  document.getElementById('next-card').style.background = shade(nc.color,-10);
  updateElixirBarUI();
}
// Atualiza só o preenchimento/número do elixir (chamado todo frame) sem
// reconstruir a mão inteira — é isso que deixa a barra encher devagarzinho
// em vez de saltar de um número pro outro.
function updateElixirBarUI(){
  const numEl = document.getElementById('elixir-num');
  const fillEl = document.getElementById('elixir-fill');
  if(!numEl || !fillEl) return;
  numEl.textContent = Math.floor(playerElixir);
  const frac = playerElixir + Math.min(0.999, elixirAccum/elixirRegenMs);
  fillEl.style.width = Math.max(0, Math.min(100, frac/10*100)) + '%';
}
function shade(hex, pct){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+Math.round(255*pct/100), g=((n>>8)&255)+Math.round(255*pct/100), b=(n&255)+Math.round(255*pct/100);
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}

/* ---------- CLIQUE NO CAMPO PARA JOGAR CARTA ---------- */
function onCanvasClick(e){
  if(paused) return;
  if(selectedSlot===null) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX-rect.left) * (W/rect.width);
  const y = (e.clientY-rect.top) * (H/rect.height);

  const hand = currentHand(playerDeck);
  const key = hand[selectedSlot];
  const def = CARD_TYPES[key];
  const cost = def.cost;
  if(cost > playerElixir){ flashInvalid(); return; }

  if(def.isSpell){
    if(x<6 || x>W-6 || y<6 || y>H-6){ flashInvalid(); return; }
  } else if(y < RIVER_Y1+10 || y > H-10){ flashInvalid(); return; }

  playerElixir -= cost;
  playFromDeck(playerDeck, selectedSlot);
  if(def.isSpell) castSpell(key, 'player', x, y);
  else spawnTroop(key, 'player', x, y);
  selectedSlot = null;
  renderHand();
}
function flashInvalid(){
  canvas.style.filter='brightness(1.4)';
  setTimeout(()=>canvas.style.filter='',120);
}

/* ---------- ARRASTAR CARTA DIRETO PARA A ARENA ---------- */
let dragState = {active:false, dragging:false, slot:null, key:null, startX:0, startY:0, ghost:null, pointerId:null, sourceEl:null};

function beginCardDrag(e, slotIndex){
  if(!running || paused) return;
  const el = e.currentTarget;
  dragState = {active:true, dragging:false, slot:slotIndex, key:currentHand(playerDeck)[slotIndex],
               startX:e.clientX, startY:e.clientY, ghost:null, pointerId:e.pointerId, sourceEl:el};
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  el.addEventListener('pointermove', onCardDragMove);
  el.addEventListener('pointerup', onCardDragEnd);
  el.addEventListener('pointercancel', onCardDragCancel);
}
function onCardDragMove(e){
  if(!dragState.active) return;
  const dx = e.clientX-dragState.startX, dy = e.clientY-dragState.startY;
  if(!dragState.dragging && Math.hypot(dx,dy) > 10){
    dragState.dragging = true;
    if(dragState.sourceEl) dragState.sourceEl.style.opacity = '0.3';
    const c = CARD_TYPES[dragState.key];
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    g.style.background = `linear-gradient(180deg, ${c.color}, ${shade(c.color,-25)})`;
    g.innerHTML = `<div class="emoji">${cardVisualHTML(dragState.key)}</div><div class="cname">${c.name}</div>`;
    document.body.appendChild(g);
    dragState.ghost = g;
  }
  if(dragState.dragging && dragState.ghost){
    dragState.ghost.style.left = e.clientX+'px';
    dragState.ghost.style.top = e.clientY+'px';
  }
  // guarda a posição pra desenhar o círculo de alcance da carta sobre a arena
  dragState.lastClientX = e.clientX;
  dragState.lastClientY = e.clientY;
}
// devolve {x,y} em coordenadas do mundo do jogo (0..W, 0..H) a partir de um ponto
// de tela, ou null se o ponto estiver fora do canvas
function clientToWorld(clientX, clientY){
  if(!canvas) return null;
  const rect = canvas.getBoundingClientRect();
  if(clientX<rect.left || clientX>rect.right || clientY<rect.top || clientY>rect.bottom) return null;
  return { x:(clientX-rect.left)*(W/rect.width), y:(clientY-rect.top)*(H/rect.height) };
}
// desenha um círculo transparente mostrando o alcance da carta que está sendo
// segurada/arrastada, centrado onde o dedo/mouse está sobre a arena
function drawHeldCardRange(){
  if(!dragState.active || !dragState.dragging) return;
  const pos = clientToWorld(dragState.lastClientX, dragState.lastClientY);
  if(!pos) return;
  const def = CARD_TYPES[dragState.key];
  if(!def) return;
  let radius = def.isSpell ? (def.spellRadius||0) : (def.range||0);
  if(!radius) return;
  const valid = def.isSpell
    ? (pos.x>=6 && pos.x<=W-6 && pos.y>=6 && pos.y<=H-6)
    : (pos.y>=RIVER_Y1+10 && pos.y<=H-10);
  ctx.save();
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, radius, 0, Math.PI*2);
  ctx.fillStyle = valid ? 'rgba(255,255,255,0.14)' : 'rgba(255,60,60,0.16)';
  ctx.fill();
  ctx.setLineDash([6,5]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = valid ? 'rgba(255,255,255,0.75)' : 'rgba(255,90,90,0.85)';
  ctx.stroke();
  ctx.setLineDash([]);
  // marca o centro (ponto de queda da carta)
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 4, 0, Math.PI*2);
  ctx.fillStyle = valid ? 'rgba(255,255,255,0.85)' : 'rgba(255,90,90,0.9)';
  ctx.fill();
  ctx.restore();
}
function onCardDragEnd(e){
  if(!dragState.active) return;
  if(dragState.dragging){
    // se soltar a carta de volta em cima da mão (fileira de cartas), cancela — não joga na arena
    const handRow = document.getElementById('hand-row');
    const overHand = handRow && (()=>{
      const r = handRow.getBoundingClientRect();
      return e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
    })();
    if(!overHand) tryPlaceCardAtClient(dragState.slot, e.clientX, e.clientY);
  } else {
    selectedSlot = (selectedSlot===dragState.slot) ? null : dragState.slot;
  }
  finishDrag();
}
function onCardDragCancel(e){
  if(!dragState.active) return;
  finishDrag(); // gesto cancelado (ex: SO interceptou o toque) -> carta volta ao normal
}
function finishDrag(){
  const el = dragState.sourceEl;
  if(el){
    el.removeEventListener('pointermove', onCardDragMove);
    el.removeEventListener('pointerup', onCardDragEnd);
    el.removeEventListener('pointercancel', onCardDragCancel);
    try{ el.releasePointerCapture(dragState.pointerId); }catch(err){}
    el.style.opacity = '';
  }
  if(dragState.ghost) dragState.ghost.remove();
  dragState = {active:false, dragging:false, slot:null, key:null, ghost:null, pointerId:null, sourceEl:null};
  renderHand(); // reconstrói a mão do zero, garantindo que a carta volte ao lugar certo
}
function tryPlaceCardAtClient(slotIndex, clientX, clientY){
  if(!running || paused || !canvas) return;
  const rect = canvas.getBoundingClientRect();
  if(clientX<rect.left || clientX>rect.right || clientY<rect.top || clientY>rect.bottom) return;
  const x = (clientX-rect.left) * (W/rect.width);
  const y = (clientY-rect.top) * (H/rect.height);

  const hand = currentHand(playerDeck);
  const key = hand[slotIndex];
  const def = CARD_TYPES[key];
  const cost = def.cost;
  if(cost > playerElixir){ flashInvalid(); return; }

  if(def.isSpell){
    if(x<6 || x>W-6 || y<6 || y>H-6){ flashInvalid(); return; }
  } else if(y < RIVER_Y1+10 || y > H-10){ flashInvalid(); return; }

  playerElixir -= cost;
  playFromDeck(playerDeck, slotIndex);
  if(def.isSpell) castSpell(key, 'player', x, y);
  else spawnTroop(key, 'player', x, y);
  if(selectedSlot===slotIndex) selectedSlot=null;
}

/* ---------- TROPAS ---------- */
const ATTACK_ANIM_DURATION = 260; // ms - inclinada em direção ao inimigo
const DIE_DURATION = 650;         // ms - vira fumaça e some

function spawnTroop(key, owner, x, y){
  const def = CARD_TYPES[key];
  if(def.swarmCount){
    const n = def.swarmCount;
    for(let i=0;i<n;i++){
      const col = i%3, row = Math.floor(i/3);
      const ox = (col-1)*18;
      const oy = row*18 - 9;
      spawnSingleTroop(key, owner, x+ox, y+oy);
    }
    return;
  }
  if(def.twin){
    spawnSingleTroop(key, owner, x-14, y);
    spawnSingleTroop(key, owner, x+14, y);
    return;
  }
  if(def.summonCloneKey){
    spawnSingleTroop(key, owner, x, y);
    const off = 26;
    const dirY = owner==='player' ? -1 : 1; // frente = rumo à torre principal inimiga
    spawnSingleTroop(def.summonCloneKey, owner, x-off, y);      // esquerda
    spawnSingleTroop(def.summonCloneKey, owner, x+off, y);      // direita
    spawnSingleTroop(def.summonCloneKey, owner, x, y+dirY*off); // frente
    spawnSingleTroop(def.summonCloneKey, owner, x, y-dirY*off); // atrás
    return;
  }
  spawnSingleTroop(key, owner, x, y);
}
function spawnSingleTroop(key, owner, x, y){
  const def = CARD_TYPES[key];
  const level = owner==='player' ? (cardLevels[key]||1) : (enemyCardLevels[key]||1);
  const evoLvl = owner==='player' ? (evolutions[key]||0) : (enemyEvolutions[key]||0); // a IA também evolui, de acordo com a arena
  const stats = statsAtLevel(key, level, evoLvl); // já inclui o bônus % da evolução em HP e ATK
  const newTroop = {
    id: troopId++, key, owner, x, y, level, evoLvl,
    hp: stats.hp, maxhp: stats.hp, dmg: stats.dmg,
    lane: x<190?'left':'right',
    crossed: !!def.flying,
    lastAtk: 0, target:null,
    state:'alive', dieElapsed:0,
    attackAnim:null, tiltDir:1, atkDirX:0, atkDirY:0,
    bleeds: [], stunTimer: 0, iceFreezeTimer: 0, decayTimer: 0, regenTimer: 0,
    speedMult: 1, atkSpeedMult: 1, frozen: false, medusaStage: 0, medusaSourceId: null, iceSlowTimer: 0,
    carAmmo: def.carAmmoMax || 0,
    fireLances: [],
    invisible: !!def.invisibleRevealHits, atkHits: 0, timeSinceHit: 0,
    bruxaOwner: null,
    abilityCooldownRemaining: def.activeAbility ? 0 : undefined,
    dmgBuffStacks: 0, // Breath wallenHaish (Perdão): buff PERMANENTE e acumulativo de dano enquanto estiver vivo (zera ao morrer, pois é um contador da própria tropa)
  };
  troops.push(newTroop);

  // Mítica: registra a tropa recém-colocada como a "ativa" para o botão de habilidade
  if(owner==='player' && def.rarity==='mitico'){
    mythicTroopOrder.push(troopId-1);
  }

  // (Evolução não desbloqueia mais habilidades novas — só dá bônus de % em HP/ATK,
  // já aplicado acima em "stats". O antigo efeito "Chegada" do Zeus evoluído foi removido.)
  return newTroop;
}
function getNearestTower(t){
  const oppOwner = t.owner==='player'?'enemy':'player';
  let best=null, bestD=Infinity;
  for(const tw of towers){
    if(tw.owner!==oppOwner || tw.hp<=0) continue;
    const d = dist(t,tw);
    if(d<bestD){ bestD=d; best=tw; }
  }
  return best;
}
function getNearestBuildingTarget(t){
  // usado por unidades que só atacam estruturas (ex: T-Rex): considera torres E construções (ex: Canhão)
  const oppOwner = t.owner==='player'?'enemy':'player';
  let best=null, bestD=Infinity;
  for(const tw of towers){
    if(tw.owner!==oppOwner || tw.hp<=0) continue;
    const d = dist(t,tw);
    if(d<bestD){ bestD=d; best=tw; }
  }
  for(const o of troops){
    if(o.owner!==oppOwner || o.state==='dying' || o.invisible) continue;
    if(!CARD_TYPES[o.key].isBuilding) continue;
    const d = dist(t,o);
    if(d<bestD){ bestD=d; best=o; }
  }
  return best;
}
function laneBridgeX(lane){ return lane==='left' ? (BRIDGE_L.x0+BRIDGE_L.x1)/2 : (BRIDGE_R.x0+BRIDGE_R.x1)/2; }

function getTargetTower(t){
  // ataca sempre a torre inimiga mais próxima (mesmo que seja a principal)
  return getNearestTower(t);
}
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function updateTroops(dt){
  // avança animação de morte (fumaça) e remove quando terminar
  for(const t of troops){
    if(t.state==='dying') t.dieElapsed += dt;
  }
  troops = troops.filter(t=> !(t.state==='dying' && t.dieElapsed>=DIE_DURATION));

  for(const t of troops){
    if(t.state==='dying') continue;
    const def = CARD_TYPES[t.key];
    const oppOwner = t.owner==='player'?'enemy':'player';

    // Perdão (Breath wallenHaish): buff é permanente enquanto viva — sem contagem regressiva

    // paralisado pelo raio de Zeus: não anda nem ataca até o atraso acabar
    if(t.iceFreezeTimer>0) t.iceFreezeTimer = Math.max(0, t.iceFreezeTimer-dt);

    if(t.stunTimer>0){
      t.stunTimer = Math.max(0, t.stunTimer-dt);
      continue;
    }

    // petrificado pela Medusa (3º raio): vira estátua, não anda nem ataca até a Medusa morrer
    if(t.frozen){
      continue;
    }

    if(t.attackAnim!==null){
      t.attackAnim += dt;
      if(t.attackAnim>=ATTACK_ANIM_DURATION) t.attackAnim=null;
    }

    // Portal Demoníaco (e futuras construções parecidas): invoca tropas periodicamente sozinho,
    // sem precisar atacar nada
    if(def.spawnKey){
      t.spawnTimer = (t.spawnTimer||0) + dt;
      const interval = def.spawnIntervalMs || 5000;
      if(t.spawnTimer>=interval){
        t.spawnTimer -= interval;
        const n = def.spawnCount || 1;
        for(let i=0;i<n;i++){
          const ox = t.x + (Math.random()-0.5)*30;
          const oy = t.y + 16 + (Math.random()-0.5)*16;
          spawnSingleTroop(def.spawnKey, t.owner, ox, oy);
        }
        spawnBurst(t.x, t.y-4, 12, ['#B388FF','#7B2FF7','#3D1F5C'], 90, 10, 320);
        particles.push({x:t.x,y:t.y-4,kind:'flash',life:0,maxLife:160,r0:2,r1:22,color:'rgba(179,136,255,.85)'});
      }
    }

    let enemyTroop = null, bestD=Infinity;
    if(def.targetsOnly !== 'buildings' && !(t.blindTimer>0) && !def.neverAttacks){
      for(const o of troops){
        if(o.owner!==oppOwner || o.state==='dying' || o.invisible) continue;
        const oDef = CARD_TYPES[o.key];
        if(oDef.flying && oDef.onlyRangedCanHit && !def.ranged && !(t.carAmmo>0)) continue; // só quem atira (ou carro) acerta voadores
        if(oDef.flying && def.noAir) continue; // Colosso: não enxerga/ataca aéreos
        const d = dist(t,o);
        if(d<bestD){ bestD=d; enemyTroop=o; }
      }
    }
    let attackTarget=null, useCar=false;
    if(enemyTroop && bestD<=def.range+18 && !(CARD_TYPES[enemyTroop.key].flying && !def.ranged)) attackTarget=enemyTroop;

    // Demônio Gordo: se o alvo mais próximo está longe do corpo a corpo ou é aéreo, ele lança carros
    // (mesmo dano que o ataque normal), até 3 vezes, com o mesmo tempo de recarga do ataque.
    if(!attackTarget && enemyTroop && def.carThrow && t.carAmmo>0){
      const farOrFlying = CARD_TYPES[enemyTroop.key].flying || bestD > def.range+18;
      if(farOrFlying && bestD <= (def.carRange||140)){ attackTarget = enemyTroop; useCar = true; }
    }

    if(!attackTarget && !def.neverAttacks){
      const tower = def.targetsOnly==='buildings' ? getNearestBuildingTarget(t) : getTargetTower(t);
      if(tower && tower.hp>0 && (t.crossed || def.flying || def.hitsAcrossRiver)){
        const d = dist(t,tower);
        if(d<=def.range+22){ attackTarget=tower; if(t.key==='trex') t.hasArrived = true; }
      }
    }

    if(attackTarget){
      let effAtkSpeed = def.atkSpeed;
      effAtkSpeed *= (t.atkSpeedMult||1); // lentidão da Medusa (30%/50%) torna o ataque mais lento
      effAtkSpeed /= coleraMult(t); // Cólera: dentro da área, ataca mais rápido
      t.lastAtk += dt;
      if(t.lastAtk>=effAtkSpeed){
        t.lastAtk=0;
        t.attackAnim = 0;
        t.tiltDir = (attackTarget.x >= t.x) ? 1 : -1;

        // Miguel: se esta tropa estiver marcada com Paranoia, o golpe se volta contra o próprio aliado (ou torre) mais perto
        if(t.paranoiaMark){
          const redirect = findNearestAllyOrTower(t);
          t.paranoiaMark = false;
          if(redirect){
            attackTarget = redirect;
            useCar = false;
            spawnBurst(t.x, t.y-14, 10, ['#8E44AD','#3B0764','#D8B4FE'], 90, 10, 300);
          }
        }

        // Odin: fica camuflado e só se revela depois de atacar duas vezes
        if(def.invisibleRevealHits){
          t.atkHits = (t.atkHits||0)+1;
          if(t.atkHits>=def.invisibleRevealHits) t.invisible = false;
        }

        const adx = attackTarget.x - t.x, ady = attackTarget.y - t.y;
        const alen = Math.hypot(adx,ady) || 1;
        t.atkDirX = adx/alen; t.atkDirY = ady/alen;

        const dmgMult = auraDamageMultiplier(t);

        let extraMult = 1;

        if(useCar){
          // lança um carro no alvo — mesmo dano do ataque corpo a corpo, munição limitada
          spawnProjectile(t, attackTarget, Object.assign({}, def, {projectileKind:'car'}), Math.round(t.dmg*dmgMult*extraMult));
          t.carAmmo = Math.max(0, (t.carAmmo||0)-1);
        } else if(def.projectileKind){
          if(def.arrowCount){
            // Pandora: dispara várias flechas brancas em sequência, cada uma com pequeno dano em área
            spawnArrowVolley(t, attackTarget, def, Math.round(t.dmg*dmgMult*extraMult));
          } else {
            spawnProjectile(t, attackTarget, def, Math.round(t.dmg*dmgMult*extraMult));
            // Luke/Obione: campo de força visual saindo do personagem até o alvo
            if(def.knockback){
              beams.push({x1:t.x, y1:t.y-14, x2:attackTarget.x, y2:attackTarget.y-10, life:0, maxLife:260, color:'forcefield'});
            }
          }
        } else {
          applyDamage(attackTarget, Math.round(t.dmg*dmgMult*extraMult), def.bleed);
          // Hella: cada abate a deixa mais forte — ganha ATK e recupera vida, de forma permanente
          if(def.growOnKillPct && attackTarget.hp<=0){
            t.dmg = Math.round(t.dmg * (1+def.growOnKillPct));
            t.hp = Math.min(t.maxhp, t.hp + t.maxhp*def.growOnKillPct);
            spawnBurst(t.x, t.y-10, 12, ['#9C27B0','#4A0E4E','#D9A8E0'], 100, 11, 320);
            particles.push({x:t.x,y:t.y-10,kind:'flash',life:0,maxLife:140,r0:2,r1:20,color:'rgba(156,39,176,.85)'});
          }
          // Scar King: a cada ataque convoca elfos ao seu redor
          if(def.summonOnAttackKey){
            const n = def.summonOnAttackCount || 1;
            for(let i=0;i<n;i++){
              const ox = t.x + (Math.random()-0.5)*34;
              const oy = t.y + 14 + (Math.random()-0.5)*20;
              spawnSingleTroop(def.summonOnAttackKey, t.owner, ox, oy);
            }
            spawnBurst(t.x, t.y-6, 10, ['#2ECC71','#145A32','#A9DFBF'], 90, 9, 260);
          }
          // Abutre: rouba 2% do ATK do alvo a cada golpe. Contra torres, ele ainda ganha o bônus de ATK,
          // mas não consegue reduzir o ATK da torre (só funciona contra tropas). Sempre recupera 2% da própria vida.
          if(def.vultureSteal && attackTarget.dmg!==undefined){
            const isTowerTarget = towers.includes(attackTarget);
            const stolen = attackTarget.dmg*0.02;
            if(!isTowerTarget){
              attackTarget.dmg = Math.max(1, Math.round(attackTarget.dmg - stolen));
            }
            t.dmg = Math.round(t.dmg + stolen);
            t.hp = Math.min(t.maxhp, t.hp + t.maxhp*0.02);
            spawnBurst(t.x, t.y-10, 8, ['#6B4226','#3E2A1A','#C9A876'], 70, 8, 260);
          }
          // Hermes: se o golpe matar o alvo, ele dá um novo dash até o próximo inimigo por perto
          // e ataca de novo — pode empilhar vários dashes seguidos enquanto for matando.
          if(def.dashChain && attackTarget.hp<=0 && troops.includes(attackTarget)){
            let chainFrom = attackTarget;
            const DASH_RADIUS = 140, CONTACT = 26;
            let guard = 0;
            while(guard<20){
              guard++;
              let next=null, nd=Infinity;
              for(const o2 of troops){
                if(o2===chainFrom || o2.owner===t.owner || o2.state==='dying') continue;
                const dd = dist(chainFrom,o2);
                if(dd<=DASH_RADIUS && dd<nd){ nd=dd; next=o2; }
              }
              if(!next) break;
              const ddx = next.x-t.x, ddy = next.y-t.y, dl = Math.hypot(ddx,ddy)||1;
              t.x = next.x - (ddx/dl)*CONTACT;
              t.y = next.y - (ddy/dl)*CONTACT;
              t.tiltDir = (next.x >= t.x) ? 1 : -1;
              spawnBurst(t.x, t.y, 10, ['#F5F5F5','#DFF3FF'], 90, 10, 220);
              applyDamage(next, Math.round(t.dmg*dmgMult), def.bleed);
              if(next.hp>0) break; // só continua empilhando enquanto for matando
              chainFrom = next;
            }
          }
          // Atena: golpe corpo a corpo em área, acerta todos os inimigos próximos dela
          if(def.meleeSplash){
            const radius = def.meleeSplashRadius||55;
            for(const o2 of troops){
              if(o2===attackTarget || o2.owner===t.owner || o2.state==='dying') continue;
              if(dist(t,o2)<=radius) applyDamage(o2, Math.round(t.dmg*dmgMult*extraMult), def.bleed);
            }
          }
          // Thor: o golpe em área é elétrico e paralisa (stun) todo mundo atingido, incluindo o alvo principal
          if(def.meleeStun){
            spawnBurst(attackTarget.x, attackTarget.y-10, 12, ['#FFF9C4','#FFEB3B','#DFF3FF'], 130, 12, 300);
            if(attackTarget.stunTimer!==undefined) attackTarget.stunTimer = Math.max(attackTarget.stunTimer||0, def.stun||0);
            const radius = def.meleeSplashRadius||55;
            for(const o2 of troops){
              if(o2===attackTarget || o2.owner===t.owner || o2.state==='dying') continue;
              if(dist(t,o2)<=radius && o2.stunTimer!==undefined){
                o2.stunTimer = Math.max(o2.stunTimer||0, def.stun||0);
                spawnBurst(o2.x, o2.y-10, 8, ['#FFF9C4','#FFEB3B','#DFF3FF'], 100, 10, 260);
              }
            }
          }
          // Troll de Gelo / Breath (nórdico): ataque também congela quem é atingido, deixando-o lento por um tempo
          if(def.iceSlow){
            // impacto da pedra/sopro: estilhaços de gelo no ponto do golpe + névoa gélida saindo da tropa
            spawnBurst(attackTarget.x, attackTarget.y-10, 10, ['#8C8C8C','#B3E5FC','#FFFFFF'], 100, 11, 320);
            spawnBurst(t.x, t.y-10, 8, ['#DFF3FF','#B3E5FC'], 70, 8, 300);
            applyIceSlow(attackTarget, def.iceSlowMult, def.iceSlowDuration);
            if(def.meleeSplash){
              const radius = def.meleeSplashRadius||55;
              for(const o2 of troops){
                if(o2===attackTarget || o2.owner===t.owner || o2.state==='dying') continue;
                if(dist(t,o2)<=radius) applyIceSlow(o2, def.iceSlowMult, def.iceSlowDuration);
              }
            }
          }
        }
      }
      continue;
    }

    const dirY = t.owner==='player' ? -1 : 1;
    let destX, destY;
    if(!t.crossed){
      destX = laneBridgeX(t.lane);
      destY = t.owner==='player' ? RIVER_Y0-6 : RIVER_Y1+6;
      if(Math.abs(t.y-destY)<6 && Math.abs(t.x-destX)<6) t.crossed=true;
    } else {
      const tower = def.targetsOnly==='buildings' ? getNearestBuildingTarget(t) : getTargetTower(t);
      // se não sobrou nenhuma torre inimiga viva pra mirar (partida acabando/já perdida),
      // a tropa só fica parada nesse frame em vez de travar o jogo tentando ler uma torre nula
      if(!tower) continue;
      destX = tower.x; destY = tower.y + (dirY>0? -34: 34);
    }
    const ang = Math.atan2(destY-t.y, destX-t.x);
    const step = def.speed*(t.speedMult!==undefined?t.speedMult:1)*coleraMult(t)*(dt/1000);
    t.x += Math.cos(ang)*step;
    t.y += Math.sin(ang)*step;
  }
}

/* ---------- DANO / MORTE (compartilhado entre ataques corpo-a-corpo e projéteis) ---------- */
/* ---------- MULTIPLICADOR DE DANO POR BUFFS EM CAMPO ---------- */
function auraDamageMultiplier(t){
  let mult = 1;
  // Perdão (Breath wallenHaish): +30% de dano por stack, acumulado permanentemente enquanto viva
  if(t.dmgBuffStacks>0) mult *= (1 + CARD_TYPES.wallenhaish.activeAbility.dmgBoostPct * t.dmgBuffStacks);
  // Cólera: +30% de dano enquanto a tropa estiver dentro da área da fúria
  mult *= coleraMult(t);
  return mult;
}
function applyDamage(target, dmg, bleedOwner){
  if(!target) return;
  target.hp -= dmg;
  if(target.hp<0) target.hp=0;
  if('timeSinceHit' in target) target.timeSinceHit = 0;
  if(bleedOwner && target.bleeds){
    target.bleeds.push({dmgPerTick: dmg*0.05, ticksLeft:5, tickTimer:0});
  }
  if('state' in target && target.hp<=0 && target.state==='alive'){
    target.state='dying'; target.dieElapsed=0;
    onTroopDeath(target);
  }
}
/* ---------- MORTE ESPECIAL (Afrodite / Bruxa / Atreus Urso) ---------- */
function onTroopDeath(t){
  if(!t || !t.key) return;
  const def = CARD_TYPES[t.key];
  if(def && def.deathExplode==='love') applyLoveExplosion(t, def);
  if(def && def.deathExplode==='heart') scheduleHeartExplosion(t, def);
  if(t.key==='medusa') clearMedusaEffects(t.id);
  // Portal Demoníaco: ao ser destruído, libera vários demônios de uma vez no local
  if(def && def.deathSpawnKey){
    const n = def.deathSpawnCount || 1;
    for(let i=0;i<n;i++){
      const ang = (Math.PI*2*i/n) + Math.random()*0.4;
      const ox = t.x + Math.cos(ang)*16;
      const oy = t.y + Math.sin(ang)*10;
      spawnSingleTroop(def.deathSpawnKey, t.owner, ox, oy);
    }
    spawnBurst(t.x, t.y-4, 20, ['#B388FF','#7B2FF7','#3D1F5C','#D9A8E0'], 130, 12, 380);
    particles.push({x:t.x,y:t.y-4,kind:'shockwave',life:0,maxLife:300,r0:4,r1:40,color:'rgba(123,47,247,.5)'});
    particles.push({x:t.x,y:t.y-4,kind:'flash',life:0,maxLife:170,r0:2,r1:26,color:'rgba(217,168,224,.9)'});
  }
  // Atreus Urso: ao morrer, renasce como um Urso mais forte no mesmo lugar
  if(def && def.reviveAs){
    spawnSingleTroop(def.reviveAs, t.owner, t.x, t.y);
    spawnBurst(t.x, t.y-10, 16, ['#6B4423','#8FBF7A','#FFF6C8'], 120, 12, 340);
    particles.push({x:t.x,y:t.y-10,kind:'shockwave',life:0,maxLife:280,r0:2,r1:30,color:'rgba(107,68,35,.5)'});
    particles.push({x:t.x,y:t.y-10,kind:'flash',life:0,maxLife:150,r0:2,r1:22,color:'rgba(255,246,200,.9)'});
  }
  // Bruxa: se o alvo amaldiçoado morrer (não precisa ser o golpe final dela), ele vira um Demônio
  if(t.bruxaOwner && t.key!=='demonio'){
    spawnSingleTroop('demonio', t.bruxaOwner, t.x, t.y);
    spawnBurst(t.x, t.y-10, 14, ['#8E44AD','#3D1F5C','#D9A8E0'], 110, 12, 340);
    particles.push({x:t.x,y:t.y-10,kind:'shockwave',life:0,maxLife:260,r0:2,r1:26,color:'rgba(142,68,173,.5)'});
    particles.push({x:t.x,y:t.y-10,kind:'flash',life:0,maxLife:140,r0:2,r1:20,color:'rgba(220,180,255,.9)'});
  }
}
/* ---------- JESUS: quem ele mata renasce do lado de quem o matou ----------
   O inimigo abatido some e um novo aliado do mesmo tipo surge no lugar, já
   controlado pelo dono de Jesus (com pouquíssimo HP). Como esse novo aliado
   passa a pertencer ao lado de Jesus, o motor do jogo já faz ele atacar
   automaticamente sua própria base e antigos companheiros (que agora são
   o time adversário dele). */
function reviveAsTurncoat(deadTroop, newOwner, hpPct){
  if(!deadTroop || !deadTroop.key) return;
  const turncoat = spawnSingleTroop(deadTroop.key, newOwner, deadTroop.x, deadTroop.y);
  if(turncoat){
    turncoat.hp = Math.max(1, Math.round(turncoat.maxhp * hpPct));
  }
}
function applyLoveExplosion(t, def){
  const RADIUS = def.explodeRadius || 70;
  const oppOwner = t.owner==='player' ? 'enemy' : 'player';
  for(const o of troops){
    if(o.owner!==oppOwner || o.state==='dying' || o.invisible) continue;
    if(dist(t,o)<=RADIUS){
      o.dmg = Math.max(1, Math.round(o.dmg*0.8)); // perde 20% do ATK permanentemente
    }
  }
  for(const tw of towers){
    if(tw.owner!==oppOwner || tw.hp<=0) continue;
    if(dist(t,tw)<=RADIUS){
      tw.dmg = Math.max(1, Math.round(tw.dmg*0.95)); // torre perde só 5% do ATK permanentemente
    }
  }
  // explosão de corações e amor
  spawnBurst(t.x, t.y, 18, ['#FF6FA3','#FF3C7A','#FFD1E3','#FF99C8'], 120, 10, 500);
  particles.push({x:t.x,y:t.y,kind:'shockwave',life:0,maxLife:320,r0:4,r1:RADIUS,color:'rgba(255,110,160,.4)'});
  particles.push({x:t.x,y:t.y,kind:'flash',life:0,maxLife:150,r0:2,r1:30,color:'rgba(255,190,220,.9)'});
}
/* ---------- CORAÇÃO EXPLOSIVO (Demônio Gigante) ----------
   Ao morrer, deixa um coração no chão que explode 2s depois, causando 3x o
   ATK do Demônio Gigante numa área grande (tropas e torres inimigas). */
function scheduleHeartExplosion(t, def){
  pendingExplosions.push({
    x:t.x, y:t.y, owner:t.owner,
    dmg: Math.round((t.dmg||def.dmg)*3),
    radius: def.explodeRadius||110,
    timer: 2000,
  });
  spawnBurst(t.x, t.y-8, 10, ['#FF1744','#8B0000','#FFB3B3'], 70, 9, 320);
}
function updatePendingExplosions(dt){
  for(let i=pendingExplosions.length-1;i>=0;i--){
    const e = pendingExplosions[i];
    e.timer -= dt;
    if(e.timer<=0){
      triggerHeartExplosion(e);
      pendingExplosions.splice(i,1);
    }
  }
}
function triggerHeartExplosion(e){
  const oppOwner = e.owner==='player' ? 'enemy' : 'player';
  for(const tr of troops){
    if(tr.owner!==oppOwner || tr.state==='dying' || tr.invisible) continue;
    if(dist(e, tr) <= e.radius) applyDamage(tr, e.dmg, false);
  }
  for(const tw of towers){
    if(tw.owner!==oppOwner || tw.hp<=0) continue;
    if(dist(e, tw) <= e.radius) applyDamage(tw, e.dmg, false);
  }
  spawnBurst(e.x, e.y, 22, ['#FF1744','#FF6E7F','#8B0000','#FF4569','#FFD1D1'], 140, 13, 520);
  particles.push({x:e.x,y:e.y,kind:'shockwave',life:0,maxLife:360,r0:6,r1:e.radius,color:'rgba(255,20,60,.45)'});
  particles.push({x:e.x,y:e.y,kind:'flash',life:0,maxLife:170,r0:2,r1:36,color:'rgba(255,90,90,.9)'});
}
function drawPendingExplosions(){
  if(!pendingExplosions.length) return;
  const now = Date.now();
  for(const e of pendingExplosions){
    const pulse = 0.6+0.4*Math.sin(now/140);
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.font = (16+pulse*4)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('❤️', e.x, e.y-6);
    ctx.restore();
  }
}
function targetStillValid(target, isTower){
  if(!target) return false;
  if(isTower) return target.hp>0;
  return troops.includes(target) && target.state!=='dying' && target.hp>0;
}
/* ---------- KNOCKBACK (Luke/Obione/Poseidon): empurra a tropa alvo de volta para o campo dela, em direção à própria torre principal ---------- */
function knockbackFrom(target, srcX, srcY, amount){
  if(!target || !amount) return;
  // construções (ex: Canhão) não recuam — só tropas móveis sofrem empurrão. Torres já são
  // excluídas antes de chegar aqui em todos os pontos que chamam esta função.
  if(target.key && CARD_TYPES[target.key] && CARD_TYPES[target.key].isBuilding) return;
  // sempre empurra na direção da torre principal do próprio dono do alvo (player desce, enemy sobe)
  const dy = (target.owner==='player' ? 1 : -1);
  target.y += dy*amount;
  // mantém a tropa dentro dos limites do campo
  target.x = Math.max(12, Math.min(W-12, target.x));
  target.y = Math.max(10, Math.min(H-10, target.y));
}

/* ============================================================
   PROJÉTEIS (bola de fogo, balas, flechas, bala de canhão) — efeitos extravagantes
   ============================================================ */
const PROJECTILE_SPEED = { fireball:230, bullet:560, arrow:440, cannonball:260, car:210, parrow:480, spear:400, soulbolt:280, waterarrow:460, hexbolt:340, arcanebolt:400, freysword:420, towerarrow:440 };
// Definição usada pelas Torres (Principal e Pequenas) para disparar uma flechinha simples ao atacar
const TOWER_ARROW_DEF = { projectileKind:'towerarrow' };

function spawnProjectile(t, target, def, dmgOverride, opts){
  if(def.projectileKind==='lightning'){
    spawnLightningStrike(t, target, def, dmgOverride);
    return;
  }
  if(def.projectileKind==='medusaray'){
    spawnMedusaRay(t, target, def, dmgOverride);
    return;
  }
  if(def.projectileKind==='colossoray'){
    spawnColossusRay(t, target, def, dmgOverride);
    return;
  }
  if(def.projectileKind==='fireblast'){
    spawnFireBlast(t, target, def, dmgOverride);
    return;
  }
  if(def.projectileKind==='freysword'){
    spawnFreySword(t, target, def, dmgOverride);
    return;
  }
  if(def.projectileKind==='metratonsword'){
    spawnMetratonSword(t, target, def, dmgOverride);
    return;
  }
  if(def.projectileKind==='waterwave'){
    spawnPoseidonWave(t, target, def, dmgOverride);
    return;
  }
  opts = opts || {};
  const isTower = towers.includes(target);
  const muzzleX = t.x + (opts.muzzleOffsetX||0);
  const muzzleY = t.y - 10;
  const p = {
    id: projId++, kind: def.projectileKind,
    x: muzzleX, y: muzzleY,
    target, isTower,
    landOffsetX: opts.landOffsetX||0, landOffsetY: opts.landOffsetY||0,
    targetX: target.x + (opts.landOffsetX||0), targetY: target.y - (isTower?10:14) + (opts.landOffsetY||0),
    dmg: (dmgOverride!==undefined ? dmgOverride : t.dmg), owner: t.owner, bleedOwner: def.bleed,
    speed: PROJECTILE_SPEED[def.projectileKind] || 400,
    trailTimer: 0, spin: 0, evoLvl: t.evoLvl||0,
    splashRadius: def.splashRadius || 0,
    fireLance: !!def.fireLance,
    hitSet: opts.hitSet || null, // usado pra evitar que a mesma leva de flechas dê dano duplicado no mesmo alvo
    healOnKillPct: def.healOnKillPct || 0, sourceId: t.id,
    reviveEnemyOnKillPct: def.reviveEnemyOnKillPct || 0,
    knockback: def.knockback || 0,
    curseOnHit: !!def.curseOnHit,
    paranoiaOnHit: !!def.paranoiaOnHit,
    blindOnHit: !!def.blindOnHit,
  };
  projectiles.push(p);
  // flash de disparo na origem
  if(p.kind==='fireball') spawnBurst(muzzleX, muzzleY, 6, ['#FFD93D','#FF8C42'], 90, 18, 260);
  else if(p.kind==='bullet') spawnBurst(muzzleX, muzzleY, 4, ['#FFF6C8','#FFD93D'], 60, 10, 140);
  else if(p.kind==='arrow') spawnBurst(muzzleX, muzzleY, 4, ['#FFFFFF','#DFF3FF'], 50, 10, 160);
  else if(p.kind==='cannonball') spawnBurst(muzzleX, muzzleY, 8, ['#5A5A5A','#8C8C8C','#FFD93D'], 90, 12, 220);
  else if(p.kind==='car') spawnBurst(muzzleX, muzzleY, 8, ['#C0392B','#7A1F1F','#8C8C8C'], 80, 12, 220);
  else if(p.kind==='parrow') spawnBurst(muzzleX, muzzleY, 4, ['#FFFFFF','#F0F0F0'], 50, 10, 160);
  else if(p.kind==='spear') spawnBurst(muzzleX, muzzleY, 6, ['#FF6A2E','#B71C1C','#FFD93D'], 80, 12, 220);
  else if(p.kind==='soulbolt') spawnBurst(muzzleX, muzzleY, 6, ['#9C27B0','#4A0E4E','#D9A8E0'], 80, 12, 240);
  else if(p.kind==='waterarrow') spawnBurst(muzzleX, muzzleY, 4, ['#29B6F6','#B3E5FC'], 50, 10, 160);
  else if(p.kind==='hexbolt') spawnBurst(muzzleX, muzzleY, 6, ['#8E44AD','#3D1F5C','#D9A8E0'], 80, 12, 240);
  else if(p.kind==='arcanebolt') spawnBurst(muzzleX, muzzleY, 6, ['#7E57C2','#4A0E7A','#E1BEE7'], 80, 14, 240);
}

/* Pandora: dispara 3 flechas brancas ao mesmo tempo, espalhadas numa pequena área.
   Cada flecha carrega o dano cheio do ataque (ATK da carta), mas nenhum alvo é atingido
   duas vezes pela mesma leva — se duas flechas caírem perto do mesmo inimigo, só uma conta. */
function spawnArrowVolley(t, target, def, totalDmg){
  const n = def.arrowCount || 3;
  const hitSet = new Set();
  for(let i=0;i<n;i++){
    const ang = (i/n)*Math.PI*2 + (Math.random()-0.5)*0.5;
    const spread = 20;
    spawnProjectile(t, target, def, totalDmg, {
      landOffsetX: Math.cos(ang)*spread,
      landOffsetY: Math.sin(ang)*spread,
      muzzleOffsetX: (i-(n-1)/2)*8,
      hitSet,
    });
  }
}

/* ---------- RAIO DE ZEUS (instantâneo + paralisa o alvo) ---------- */
let beams = [];
function spawnLightningStrike(t, target, def, dmgOverride){
  const isTower = towers.includes(target);
  const tx = target.x, ty = target.y - (isTower?10:14);
  const dmg = (dmgOverride!==undefined ? dmgOverride : t.dmg);
  applyDamage(target, dmg, def.bleed);
  if(!isTower && target.stunTimer!==undefined){
    target.stunTimer = Math.max(target.stunTimer||0, def.stun||0);
  }
  beams.push({x1:t.x, y1:t.y-14, x2:tx, y2:ty, life:0, maxLife:220});
  spawnBurst(tx,ty, 16, ['#FFF9C4','#FFEB3B','#DFF3FF'], 150, 12, 340);
  particles.push({x:tx,y:ty,kind:'shockwave',life:0,maxLife:240,r0:2,r1:28,color:'rgba(255,235,80,.6)'});
  particles.push({x:tx,y:ty,kind:'flash',life:0,maxLife:130,r0:2,r1:24,color:'rgba(255,255,255,.9)'});
}
function updateBeams(dt){
  for(let i=beams.length-1;i>=0;i--){
    beams[i].life += dt;
    if(beams[i].life>=beams[i].maxLife) beams.splice(i,1);
  }
}

/* ---------- RAIO DA MEDUSA (lentidão progressiva + petrificação) ----------
   1º raio: -30% velocidade de movimento e ataque do alvo
   2º raio: -50% velocidade de movimento e ataque do alvo
   3º raio: o alvo vira estátua de pedra (não anda nem ataca)
   O debuff dura até a Medusa que o aplicou morrer; nesse momento todos os
   alvos afetados por ela (incluindo os petrificados) voltam ao normal. */
function spawnMedusaRay(t, target, def, dmgOverride){
  const isTower = towers.includes(target);
  const dmg = (dmgOverride!==undefined ? dmgOverride : t.dmg);
  applyDamage(target, dmg, false);
  const tx = target.x, ty = target.y - (isTower?10:14);
  if(!isTower && target.state==='alive'){
    if(target.medusaSourceId !== t.id){
      target.medusaSourceId = t.id;
      target.medusaStage = 0;
    }
    target.medusaStage = Math.min(3, (target.medusaStage||0)+1);
    if(target.medusaStage===1){
      target.speedMult = 0.7; target.atkSpeedMult = 1/0.7;
    } else if(target.medusaStage===2){
      target.speedMult = 0.5; target.atkSpeedMult = 1/0.5;
    } else if(target.medusaStage>=3){
      target.speedMult = 0; target.atkSpeedMult = 999;
      target.frozen = true;
      particles.push({x:tx,y:ty,kind:'shockwave',life:0,maxLife:340,r0:4,r1:36,color:'rgba(140,140,140,.55)'});
    }
  }
  beams.push({x1:t.x, y1:t.y-14, x2:tx, y2:ty, life:0, maxLife:220, color:'gray'});
  spawnBurst(tx,ty, 14, ['#B0B0B0','#8C8C8C','#D9D9D9'], 130, 12, 320);
  particles.push({x:tx,y:ty,kind:'flash',life:0,maxLife:130,r0:2,r1:22,color:'rgba(190,190,190,.85)'});
}
/* Ao morrer, a Medusa desfaz todos os efeitos (lentidão e petrificação) que aplicou. */
function clearMedusaEffects(medusaId){
  for(const o of troops){
    if(o.medusaSourceId===medusaId){
      o.medusaSourceId = null; o.medusaStage = 0;
      o.speedMult = 1; o.atkSpeedMult = 1; o.frozen = false;
    }
  }
}

/* ---------- RAIOS DO COLOSSO (dano em área pelos olhos, não acerta aéreos) ---------- */
function spawnColossusRay(t, target, def, dmgOverride){
  const isTower = towers.includes(target);
  const dmg = (dmgOverride!==undefined ? dmgOverride : t.dmg);
  const tx = target.x, ty = target.y - (isTower?10:14);
  const radius = def.splashRadius || 50;
  const oppOwner = t.owner==='player' ? 'enemy' : 'player';
  applyDamage(target, dmg, false);
  for(const o of troops){
    if(o===target || o.owner!==oppOwner || o.state==='dying' || o.invisible) continue;
    if(CARD_TYPES[o.key].flying) continue; // os raios do Colosso não acertam aéreos
    if(dist({x:tx,y:ty}, o) <= radius) applyDamage(o, dmg, false);
  }
  if(isTower){
    for(const tw of towers){
      if(tw===target || tw.owner!==oppOwner || tw.hp<=0) continue;
      if(dist({x:tx,y:ty}, tw) <= radius) applyDamage(tw, dmg, false);
    }
  }
  beams.push({x1:t.x-6, y1:t.y-16, x2:tx-5, y2:ty, life:0, maxLife:200, color:'blue'});
  beams.push({x1:t.x+6, y1:t.y-16, x2:tx+5, y2:ty, life:0, maxLife:200, color:'blue'});
  spawnBurst(tx,ty, 14, ['#4FC3F7','#0288D1','#B3E5FC'], 140, 12, 320);
  particles.push({x:tx,y:ty,kind:'shockwave',life:0,maxLife:260,r0:4,r1:radius,color:'rgba(79,195,247,.4)'});
  particles.push({x:tx,y:ty,kind:'flash',life:0,maxLife:140,r0:2,r1:26,color:'rgba(150,220,255,.9)'});
}
/* ---------- EXPLOSÃO DE FOGO DO SURT (não é uma bola de fogo viajando — é uma explosão
   instantânea em área no ponto de impacto, com chamas subindo; só atinge inimigos terrestres) ---------- */
function spawnFireBlast(t, target, def, dmgOverride){
  const isTower = towers.includes(target);
  const dmg = (dmgOverride!==undefined ? dmgOverride : t.dmg);
  const tx = target.x, ty = target.y - (isTower?10:14);
  const radius = def.splashRadius || 60;
  const oppOwner = t.owner==='player' ? 'enemy' : 'player';
  applyDamage(target, dmg, false);
  for(const o of troops){
    if(o===target || o.owner!==oppOwner || o.state==='dying' || o.invisible) continue;
    if(CARD_TYPES[o.key].flying) continue; // a explosão do Surt não atinge voadores
    if(dist({x:tx,y:ty}, o) <= radius) applyDamage(o, dmg, false);
  }
  if(isTower){
    for(const tw of towers){
      if(tw===target || tw.owner!==oppOwner || tw.hp<=0) continue;
      if(dist({x:tx,y:ty}, tw) <= radius) applyDamage(tw, dmg, false);
    }
  }
  // núcleo alaranjado + onda de choque + fagulhas de fogo subindo (sem projétil viajando)
  particles.push({x:tx,y:ty,kind:'flash',life:0,maxLife:180,r0:4,r1:34,color:'rgba(255,140,40,.95)'});
  particles.push({x:tx,y:ty,kind:'shockwave',life:0,maxLife:300,r0:6,r1:radius,color:'rgba(255,90,20,.55)'});
  spawnBurst(tx,ty, 16, ['#FFD93D','#FF8C42','#FF3C1A'], 150, 14, 340);
  for(let i=0;i<10;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 30+Math.random()*50;
    particles.push(mkParticle(tx,ty, Math.cos(ang)*spd, Math.sin(ang)*spd-20,
      380+Math.random()*220, 6+Math.random()*5,
      ['#FFD93D','#FF8C42','#FF5722','#FF3C1A'][Math.floor(Math.random()*4)], 'fire'));
  }
}

/* ---------- ESPADA DE FREY (não mira num único alvo — voa reto em linha, atravessa
   todo mundo que encontra pela frente até sumir no fim do alcance) ---------- */
function spawnFreySword(t, target, def, dmgOverride){
  const dmg = (dmgOverride!==undefined ? dmgOverride : t.dmg);
  const muzzleX = t.x, muzzleY = t.y-10;
  const isTower = towers.includes(target);
  const dx = target.x - muzzleX, dy = (target.y-(isTower?10:14)) - muzzleY;
  const len = Math.hypot(dx,dy) || 1;
  const dirX = dx/len, dirY = dy/len;
  const p = {
    id: projId++, kind:'freysword',
    x: muzzleX, y: muzzleY,
    dirX, dirY, angle: Math.atan2(dirY,dirX),
    dmg, owner: t.owner,
    speed: PROJECTILE_SPEED.freysword || 420,
    piercing: true, hitSet: new Set(),
    trailTimer: 0, spin: 0,
  };
  projectiles.push(p);
  spawnBurst(muzzleX, muzzleY, 6, ['#FFD93D','#FFF6C8','#FFEE58'], 90, 14, 260);
}

/* ---------- ESPADA GIGANTE DO METRATON (maior área do jogo — acerta terrestres e aéreos.

/* ---------- ONDA DE ÁGUA DO POSEIDON: explosão em área que empurra os inimigos para trás
   e deixa poças de água que os deixam mais lentos por um tempo ---------- */
function spawnPoseidonWave(t, target, def, dmgOverride){
  const dmg = (dmgOverride!==undefined ? dmgOverride : t.dmg);
  const isTower = towers.includes(target);
  const tx = target.x, ty = target.y - (isTower?10:14);
  const radius = def.splashRadius || 75;
  const oppOwner = t.owner==='player' ? 'enemy' : 'player';
  applyDamage(target, dmg, false);
  if(!isTower){
    knockbackFrom(target, t.x, t.y, def.knockback||0);
  }
  for(const o of troops){
    if(o===target || o.owner!==oppOwner || o.state==='dying' || o.invisible) continue;
    if(dist({x:tx,y:ty}, o) <= radius){
      applyDamage(o, dmg, false);
      knockbackFrom(o, t.x, t.y, def.knockback||0);
    }
  }
  if(isTower){
    for(const tw of towers){
      if(tw===target || tw.owner!==oppOwner || tw.hp<=0) continue;
      if(dist({x:tx,y:ty}, tw) <= radius) applyDamage(tw, dmg, false);
    }
  }
  spellEffects.push({kind:'waterwave', x:tx, y:ty, radius, life:0, maxLife:600});
  particles.push({x:tx,y:ty,kind:'shockwave',life:0,maxLife:480,r0:4,r1:radius,color:'rgba(41,182,246,.5)'});
  spawnBurst(tx,ty, 14, ['#4FC3F7','#0288D1','#B3E5FC','#E1F5FE'], 130, 12, 340);
}
function drawBeam(b){
  const life = Math.min(1, b.life/b.maxLife);
  const isGray = b.color==='gray';
  const isBlue = b.color==='blue';
  ctx.save();
  ctx.globalAlpha = 1-life*0.7;

  if(b.color==='forcefield'){
    // Luke/Obione: campo de força translúcido saindo do personagem até o alvo
    ctx.lineCap='round';
    ctx.shadowBlur=14; ctx.shadowColor='#5C7CFA';
    ctx.globalAlpha = (1-life)*0.55;
    ctx.strokeStyle='rgba(140,170,255,.5)'; ctx.lineWidth=9;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.globalAlpha = (1-life)*0.75;
    ctx.strokeStyle='rgba(200,220,255,.8)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    // ondas sutis atravessando o campo de força
    const segs=5;
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1.4;
    ctx.beginPath();
    for(let i=0;i<=segs;i++){
      const p = i/segs;
      const wob = Math.sin(p*Math.PI*3 + life*10)*3;
      const nx = -(b.y2-b.y1), ny = (b.x2-b.x1);
      const nlen = Math.hypot(nx,ny)||1;
      const mx = b.x1+(b.x2-b.x1)*p + (nx/nlen)*wob;
      const my = b.y1+(b.y2-b.y1)*p + (ny/nlen)*wob;
      if(i===0) ctx.moveTo(mx,my); else ctx.lineTo(mx,my);
    }
    ctx.stroke();
    ctx.restore();
    return;
  }
  if(isBlue){
    // Colosso: laser reto e limpo, com núcleo branco e brilho externo azul
    ctx.lineCap='round';
    ctx.shadowBlur=22; ctx.shadowColor='#4FC3F7';
    ctx.strokeStyle='rgba(79,195,247,.55)'; ctx.lineWidth=7;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.strokeStyle='#4FC3F7'; ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.restore();
    return;
  }

  ctx.strokeStyle = isGray ? '#B0B0B0' : '#FFF176';
  ctx.lineWidth=3.4;
  ctx.shadowBlur=18; ctx.shadowColor = isGray ? '#8C8C8C' : '#FFEB3B';
  ctx.lineCap='round';
  const segs=6;
  const pts=[{x:b.x1,y:b.y1}];
  for(let i=1;i<segs;i++){
    const p = i/segs;
    pts.push({
      x: b.x1+(b.x2-b.x1)*p + (Math.random()-0.5)*16,
      y: b.y1+(b.y2-b.y1)*p + (Math.random()-0.5)*16,
    });
  }
  pts.push({x:b.x2,y:b.y2});
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=1.3;
  ctx.stroke();
  // pequenos raios secundários se ramificando do bolt principal, como um raio de verdade
  ctx.lineWidth=1.4;
  ctx.strokeStyle = isGray ? 'rgba(176,176,176,.7)' : 'rgba(255,241,118,.75)';
  for(let i=1;i<pts.length-1;i+=2){
    if(Math.random()<0.55) continue;
    const a = pts[i];
    const ang = Math.atan2(pts[i+1].y-pts[i-1].y, pts[i+1].x-pts[i-1].x) + (Math.random()<0.5?1:-1)*(0.7+Math.random()*0.5);
    const len = 10+Math.random()*14;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(a.x+Math.cos(ang)*len, a.y+Math.sin(ang)*len);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- FEITIÇO: CHUVA DE FLECHAS ---------- */
let spellEffects = [];
let buffZones = []; // zonas de buff no chão (ex: Cólera) — tropas do dono só ganham o bônus enquanto estiverem dentro
function castSpell(key, owner, x, y){
  const def = CARD_TYPES[key];
  const level = owner==='player' ? (cardLevels[key]||1) : (enemyCardLevels[key]||1);
  const evoLvl = owner==='player' ? (evolutions[key]||0) : (enemyEvolutions[key]||0); // a IA também evolui, de acordo com a arena
  const stats = statsAtLevel(key, level, evoLvl); // já inclui o bônus % da evolução no dano
  const dmg = stats.dmg;
  const radius = def.spellRadius || 90;
  const oppOwner = owner==='player' ? 'enemy' : 'player';

  if(def.isBuffZone){
    // Cólera: cria uma área no chão que aumenta velocidade de movimento, velocidade de
    // ataque e dano das tropas do dono enquanto elas permanecerem dentro dela
    const dur = def.buffDuration || 5000;
    buffZones.push({x, y, radius, owner, pct: def.buffPct||0.3, life:0, maxLife:dur});
    spellEffects.push({kind:'coleraZone', x, y, radius, life:0, maxLife:dur});
    particles.push({x,y,kind:'shockwave',life:0,maxLife:500,r0:6,r1:radius,color:'rgba(255,80,0,.5)'});
    spawnBurst(x,y, 20, ['#FF4500','#FF8C42','#FFD93D','#B71C1C'], 130, 14, 420);
    return;
  }

  if(def.isFreezeZone){
    // Gelo: causa um pouco de dano e congela inimigos (e a torre) dentro da área,
    // que ficam sem poder andar nem atacar durante freezeDuration
    const dur = def.freezeDuration || 4000;
    for(const tr of troops){
      if(tr.owner!==oppOwner || tr.state==='dying' || tr.invisible) continue;
      if(dist({x,y}, tr) <= radius){
        applyDamage(tr, dmg, false);
        if(tr.stunTimer!==undefined) tr.stunTimer = Math.max(tr.stunTimer||0, dur);
        tr.iceFreezeTimer = Math.max(tr.iceFreezeTimer||0, dur); // controla o visual de congelado (ciano), separado da faísca do Zeus
      }
    }
    for(const tw of towers){
      if(tw.owner!==oppOwner || tw.hp<=0) continue;
      if(dist({x,y}, tw) <= radius){
        applyDamage(tw, dmg, false);
        tw.freezeTimer = Math.max(tw.freezeTimer||0, dur);
      }
    }
    spellEffects.push({kind:'geloZone', x, y, radius, life:0, maxLife:dur});
    particles.push({x,y,kind:'shockwave',life:0,maxLife:500,r0:6,r1:radius,color:'rgba(79,195,247,.55)'});
    spawnMistBurst(x,y, 16, radius);
    return;
  }

  if(key==='bolafogo'){
    // Bola de Fogo: explosão de fogo concentrada numa área média/pequena
    for(const tr of troops){
      if(tr.owner!==oppOwner || tr.state==='dying' || tr.invisible) continue;
      if(dist({x,y}, tr) <= radius) applyDamage(tr, dmg, false);
    }
    for(const tw of towers){
      if(tw.owner!==oppOwner || tw.hp<=0) continue;
      if(dist({x,y}, tw) <= radius) applyDamage(tw, dmg, false);
    }
    spellEffects.push({kind:'bolaFogoBlast', x, y, radius, life:0, maxLife:520});
    particles.push({x,y,kind:'shockwave',life:0,maxLife:420,r0:6,r1:radius,color:'rgba(255,107,53,.55)'});
    particles.push({x,y,kind:'flash',life:0,maxLife:180,r0:4,r1:radius*0.55,color:'rgba(255,217,61,.9)'});
    for(let i=0;i<14;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 30+Math.random()*60;
      particles.push(mkParticle(x,y, Math.cos(ang)*spd, Math.sin(ang)*spd-30,
        420+Math.random()*260, 6+Math.random()*5,
        ['#FFD93D','#FF8C42','#FF5722','#FF3C1A'][Math.floor(Math.random()*4)], 'fire'));
    }
    return;
  }

  if(key==='bombanuclear'){
    // Bomba Nuclear: área bem pequena mas dano devastador — flash branco, onda de choque
    // dupla (fuligem por fora, brasa por dentro) e um cogumelo de fumaça subindo do centro
    for(const tr of troops){
      if(tr.owner!==oppOwner || tr.state==='dying' || tr.invisible) continue;
      if(dist({x,y}, tr) <= radius) applyDamage(tr, dmg, false);
    }
    for(const tw of towers){
      if(tw.owner!==oppOwner || tw.hp<=0) continue;
      if(dist({x,y}, tw) <= radius) applyDamage(tw, dmg, false);
    }
    spellEffects.push({kind:'nuclearBlast', x, y, radius, life:0, maxLife:1800});
    particles.push({x,y,kind:'flash',life:0,maxLife:220,r0:4,r1:radius*1.4,color:'rgba(255,255,255,.95)'});
    particles.push({x,y,kind:'shockwave',life:0,maxLife:460,r0:6,r1:radius*1.6,color:'rgba(255,214,120,.55)'});
    particles.push({x,y,kind:'shockwave',life:0,maxLife:600,r0:4,r1:radius*2.1,color:'rgba(90,90,90,.4)'});
    for(let i=0;i<18;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 40+Math.random()*90;
      particles.push(mkParticle(x,y, Math.cos(ang)*spd, Math.sin(ang)*spd-40,
        500+Math.random()*300, 7+Math.random()*6,
        ['#FFD93D','#FF8C42','#FFFFFF','#FF5722'][Math.floor(Math.random()*4)], 'fire'));
    }
    triggerScreenShake(11);
    return;
  }

  if(key==='onda'){
    // Onda: alcance grande, dano baixo, mas empurra os inimigos pra trás com muito mais
    // força que um golpe normal (3x o empurrão do Obione)
    const push = def.waveKnockback || 0;
    for(const tr of troops){
      if(tr.owner!==oppOwner || tr.state==='dying' || tr.invisible) continue;
      if(dist({x,y}, tr) <= radius){
        applyDamage(tr, dmg, false);
        knockbackFrom(tr, x, y, push);
      }
    }
    for(const tw of towers){
      if(tw.owner!==oppOwner || tw.hp<=0) continue;
      if(dist({x,y}, tw) <= radius) applyDamage(tw, dmg, false);
    }
    spellEffects.push({kind:'ondaSpell', x, y, radius, owner, life:0, maxLife:650});
    particles.push({x,y,kind:'shockwave',life:0,maxLife:550,r0:6,r1:radius,color:'rgba(41,182,246,.5)'});
    spawnBurst(x,y, 18, ['#4FC3F7','#0288D1','#B3E5FC','#E1F5FE'], 150, 14, 380);
    return;
  }

  const pulled = [];
  for(const tr of troops){
    if(tr.owner!==oppOwner || tr.state==='dying' || tr.invisible) continue;
    if(dist({x,y}, tr) <= radius){
      applyDamage(tr, dmg, false);
      if(def.pullToCenter) pulled.push(tr);
    }
  }
  for(const tw of towers){
    if(tw.owner!==oppOwner || tw.hp<=0) continue;
    if(dist({x,y}, tw) <= radius){
      applyDamage(tw, dmg, false);
    }
  }
  if(def.pullToCenter && pulled.length){
    // Furacão: junta todos os inimigos atingidos bem no meio do olho da tempestade
    pulled.forEach((tr,i)=>{
      const ang = (Math.PI*2*i/pulled.length) + Math.random()*0.3;
      const r = Math.min(16, 4+pulled.length*1.4);
      tr.x = x + Math.cos(ang)*r;
      tr.y = y + Math.sin(ang)*r;
    });
    spellEffects.push({kind:'furacao', x, y, radius, life:0, maxLife:650});
    particles.push({x,y,kind:'shockwave',life:0,maxLife:550,r0:6,r1:radius,color:'rgba(143,217,217,.5)'});
    spawnBurst(x,y, 22, ['#B8E6E6','#8FD9D9','#E8FFFF','#4FC3F7'], 140, 14, 420);
  } else {
    spawnArrowRain(x,y,radius);
  }
}
function spawnArrowRain(x,y,radius){
  const arrows = [];
  const count = 18;
  for(let i=0;i<count;i++){
    arrows.push({
      dx: (Math.random()-0.5)*2*radius*0.9,
      dy: (Math.random()-0.5)*2*radius*0.55,
      delay: Math.random()*480,
      dropped: false,
    });
  }
  spellEffects.push({kind:'arrowrain', x, y, radius, life:0, maxLife:780, arrows});
  particles.push({x,y,kind:'shockwave',life:0,maxLife:700,r0:6,r1:radius,color:'rgba(180,220,255,.5)'});
}
function updateBuffZones(dt){
  for(let i=buffZones.length-1;i>=0;i--){
    const z = buffZones[i];
    z.life += dt;
    if(z.life>=z.maxLife) buffZones.splice(i,1);
  }
}
// Cólera: retorna o multiplicador ativo pra tropa (1 se ela não estiver em nenhuma zona do próprio dono)
function coleraMult(t){
  for(const z of buffZones){
    if(z.owner!==t.owner) continue;
    if(dist(t,z)<=z.radius) return 1+z.pct;
  }
  return 1;
}
function updateSpellEffects(dt){
  for(let i=spellEffects.length-1;i>=0;i--){
    const s = spellEffects[i];
    s.life += dt;
    if(s.kind==='arrowrain'){
      s.arrows.forEach(a=>{
        if(!a.dropped && s.life>=a.delay+170){
          a.dropped = true;
          particles.push(mkParticle(s.x+a.dx, s.y+a.dy, (Math.random()-0.5)*20,(Math.random()-0.5)*20,
            260, 2.4, '#DFF3FF', 'sparkle'));
        }
      });
    }
    if(s.kind==='coleraZone'){
      // fagulhas de fogo nascendo do chão em pontos aleatórios dentro da área, enquanto ela durar
      s.emberTimer = (s.emberTimer||0) + dt;
      if(s.emberTimer>=70 && s.life<s.maxLife-300){
        s.emberTimer = 0;
        const ang = Math.random()*Math.PI*2, rr = Math.random()*s.radius*0.9;
        const ex = s.x + Math.cos(ang)*rr, ey = s.y + Math.sin(ang)*rr*0.48;
        const col = Math.random()<0.5 ? '#FF6B1A' : '#FFD93D';
        particles.push(mkParticle(ex, ey, (Math.random()-0.5)*10, -30-Math.random()*20,
          520, 3+Math.random()*2.5, col, 'fire'));
      }
    }
    if(s.kind==='geloZone'){
      // névoa de gelo rolando rente ao chão dentro da área, enquanto ela durar
      s.frostTimer = (s.frostTimer||0) + dt;
      if(s.frostTimer>=110 && s.life<s.maxLife-300){
        s.frostTimer = 0;
        const ang = Math.random()*Math.PI*2, rr = Math.random()*s.radius*0.85;
        const ex = s.x + Math.cos(ang)*rr, ey = s.y + Math.sin(ang)*rr*0.48;
        const col = Math.random()<0.5 ? 'rgba(179,229,252,.55)' : 'rgba(225,245,254,.55)';
        const driftAng = Math.random()*Math.PI*2;
        particles.push(mkParticle(ex, ey, Math.cos(driftAng)*14, Math.sin(driftAng)*6-3,
          1400+Math.random()*500, 16+Math.random()*14, col, 'mist'));
      }
    }
    if(s.kind==='nuclearBlast'){
      // fumaça pesada subindo do local da explosão, indo bem além da onda de choque inicial
      s.smokeTimer = (s.smokeTimer||0) + dt;
      if(s.life>=200 && s.smokeTimer>=90 && s.life<s.maxLife-200){
        s.smokeTimer = 0;
        const ang = Math.random()*Math.PI*2, rr = Math.random()*s.radius*1.3;
        const ex = s.x + Math.cos(ang)*rr, ey = s.y + Math.sin(ang)*rr*0.48;
        const grey = Math.random()<0.5 ? '#6B6B6B' : '#3A3A3A';
        particles.push(mkParticle(ex, ey, (Math.random()-0.5)*10, -26-Math.random()*20,
          1100, 6+Math.random()*5, grey, 'smoke'));
      }
    }
    if(s.life>=s.maxLife) spellEffects.splice(i,1);
  }
}
function drawSpellEffects(){
  for(const s of spellEffects){
    if(s.kind==='coleraZone'){
      // Cólera: área de fúria em chamas no chão — brilho pulsante vermelho/laranja
      // com fagulhas de fogo subindo do chão enquanto a área estiver ativa
      ctx.save();
      const grow = Math.min(1, s.life/220);
      const fade = 1 - Math.max(0, (s.life-(s.maxLife-400))/400);
      const alpha = Math.max(0, Math.min(1, fade)) * grow;
      const r = s.radius*grow;
      const pulse = 0.85 + 0.15*Math.sin(Date.now()/160);

      ctx.globalAlpha = alpha*0.55*pulse;
      const grad = ctx.createRadialGradient(s.x,s.y,4,s.x,s.y,r);
      grad.addColorStop(0,'rgba(255,140,20,.55)');
      grad.addColorStop(0.55,'rgba(255,69,0,.30)');
      grad.addColorStop(1,'rgba(255,30,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r*0.48, 0, 0, Math.PI*2); ctx.fill();

      ctx.globalAlpha = alpha*0.8;
      ctx.lineWidth = 3; ctx.setLineDash([10,8]);
      ctx.lineDashOffset = -(Date.now()/45)%18;
      ctx.shadowBlur=12; ctx.shadowColor='#FF4500';
      ctx.strokeStyle = '#FF6B1A';

      ctx.setLineDash([]);
      ctx.restore();

    }
    if(s.kind==='geloZone'){
      // Gelo: área congelada no chão — brilho ciano pulsante e um aro gélido,

      ctx.save();
      const grow = Math.min(1, s.life/220);
      const fade = 1 - Math.max(0, (s.life-(s.maxLife-400))/400);

      const r = s.radius*grow;
      const pulse = 0.85 + 0.15*Math.sin(Date.now()/200);
