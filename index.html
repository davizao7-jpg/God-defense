      grad.addColorStop(0.55,'rgba(79,195,247,.32)');
      grad.addColorStop(1,'rgba(0,229,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r*0.48, 0, 0, Math.PI*2); ctx.fill();

      // camadas de névoa baixa rolando devagar de um lado pro outro dentro da área
      ctx.globalAlpha = alpha*0.4;
      for(let i=0;i<3;i++){
        const t = Date.now()/1400 + i*2.1;
        const fogX = s.x + Math.sin(t)*r*0.35;
        const fogY = s.y + r*0.48*0.55*Math.cos(i*1.7);
        const fogR = r*(0.5+i*0.18);
        const fg = ctx.createRadialGradient(fogX,fogY,0,fogX,fogY,fogR);
        fg.addColorStop(0,'rgba(236,251,255,.5)');
        fg.addColorStop(1,'rgba(236,251,255,0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.ellipse(fogX, fogY, fogR, fogR*0.42, 0, 0, Math.PI*2); ctx.fill();
      }

      ctx.globalAlpha = alpha*0.85;
      ctx.lineWidth = 3; ctx.setLineDash([9,7]);
      ctx.lineDashOffset = (Date.now()/60)%16;
      ctx.shadowBlur=14; ctx.shadowColor='#00E5FF';
      ctx.strokeStyle = '#B3E5FC';
      ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r*0.48, 0, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      continue;
    }
    if(s.kind==='perdaoRing'){
      // círculo ritual do Perdão: aro com 5 arcos coloridos (azul, rosa, amarelo, vermelho, verde)
      // que gira lentamente sobre o chão, com um núcleo pulsante ao centro
      ctx.save();
      const grow = Math.min(1, s.life/220); // cresce rápido até o raio total
      const r = s.radius*grow;
      const fade = 1 - Math.max(0, (s.life-420)/(s.maxLife-420)); // some suavemente no fim
      const alpha = Math.max(0, Math.min(1, fade));
      const colors = ['#4FC3F7','#FF3CAC','#FFD93D','#FF4B3E','#2ECC71'];
      const segAngle = (Math.PI*2)/colors.length;
      const spin = (Date.now()/900) % (Math.PI*2);

      ctx.globalAlpha = alpha;
      ctx.lineWidth = 7; ctx.lineCap='round';
      colors.forEach((col,i)=>{
        ctx.beginPath();
        ctx.shadowBlur=16; ctx.shadowColor=col;
        ctx.strokeStyle=col;

        ctx.stroke();
      });

      // aro interno fino, girando em sentido contrário
      const spin2 = -(Date.now()/650) % (Math.PI*2);
      ctx.globalAlpha = alpha*0.85;
      ctx.lineWidth = 2.4;
      colors.forEach((col,i)=>{
        ctx.beginPath();
        ctx.shadowBlur=10; ctx.shadowColor=col;
        ctx.strokeStyle=col;
        const a0 = spin2 + i*segAngle + 0.1;
        const a1 = spin2 + (i+1)*segAngle - 0.1;
        ctx.ellipse(s.x, s.y, r*0.62, r*0.62*0.48, 0, a0, a1);
        ctx.stroke();
      });

      // núcleo claro pulsando ao centro
      ctx.globalAlpha = alpha*0.5;
      const innerGrad = ctx.createRadialGradient(s.x,s.y,2,s.x,s.y,r*0.5);
      innerGrad.addColorStop(0,'rgba(255,255,255,.55)');
      innerGrad.addColorStop(0.45,'rgba(255,220,255,.22)');
      innerGrad.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = innerGrad;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, r*0.5, r*0.5*0.48, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      continue;
    }
    if(s.kind==='waterwave'){
      // onda pequena que cresce até o ápice e depois some
      ctx.save();
      const growEnd = s.maxLife*0.4;
      const growPhase = Math.min(1, s.life/growEnd);
      const fadePhase = Math.max(0, (s.life-growEnd)/(s.maxLife-growEnd));
      const r = s.radius * (0.12 + 0.88*growPhase);
      const alpha = growPhase<1 ? growPhase : (1-fadePhase);
      ctx.globalAlpha = Math.max(0,alpha)*0.85;
      ctx.lineWidth = 6*(1-fadePhase*0.5);
      ctx.shadowBlur = 14; ctx.shadowColor = '#29B6F6';
      ctx.strokeStyle = '#4FC3F7';
      ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r*0.45, 0, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = Math.max(0,alpha)*0.4;
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = '#E1F5FE';
      ctx.beginPath(); ctx.ellipse(s.x, s.y, r*0.68, r*0.68*0.45, 0, 0, Math.PI*2); ctx.stroke();
      // poça de água residual no chão
      ctx.globalAlpha = Math.max(0, 0.35*(1-fadePhase));
      ctx.fillStyle = '#0288D1';
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.radius*0.5, s.radius*0.5*0.35, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      continue;
    }
    if(s.kind==='furacao'){
      // vórtice girando com linhas de vento espiraladas puxando tudo pro centro
      ctx.save();
      const grow = Math.min(1, s.life/220);
      const fade = 1 - Math.max(0, (s.life-420)/(s.maxLife-420));
      const alpha = Math.max(0, Math.min(1, fade)) * grow;
      const r = s.radius*grow;
      const spin = (Date.now()/260) % (Math.PI*2);
      ctx.globalAlpha = alpha*0.7;
      ctx.strokeStyle = '#8FD9D9';
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      for(let i=0;i<3;i++){
        ctx.beginPath();
        ctx.shadowBlur=10; ctx.shadowColor='#8FD9D9';
        const turns = 1.6;
        const steps = 14;
        for(let j=0;j<=steps;j++){
          const p = j/steps;
          const ang = spin + i*(Math.PI*2/3) + p*Math.PI*2*turns;
          const rr = r*p;
          const px = s.x + Math.cos(ang)*rr, py = s.y + Math.sin(ang)*rr*0.5;
          if(j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.stroke();
      }
      ctx.restore();
      continue;
    }
    if(s.kind==='metratonsword'){
      ctx.save();
      const fallDur = 260;
      const p = Math.min(1, s.life/fallDur);
      const swordY = s.y - 220*(1-p);
      ctx.translate(s.x, swordY);
      ctx.rotate(Math.PI/10);
      ctx.shadowBlur=18; ctx.shadowColor='#FFD700';
      const grad = ctx.createLinearGradient(0,-46,0,26);
      grad.addColorStop(0,'#FFF6C8'); grad.addColorStop(1,'#FFD700');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.moveTo(0,-46); ctx.lineTo(9,-6); ctx.lineTo(6,20); ctx.lineTo(-6,20); ctx.lineTo(-9,-6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#B8860B'; ctx.fillRect(-12,20,24,6);
      ctx.fillStyle='#8C5A2B'; ctx.fillRect(-3,26,6,14);
      ctx.restore();
      const impactP = Math.max(0, Math.min(1, (s.life-fallDur)/(s.maxLife-fallDur)));
      if(impactP>0 && impactP<1){
        ctx.save();
        ctx.globalAlpha = 1-impactP;
        ctx.strokeStyle='rgba(255,215,0,.8)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.ellipse(s.x, s.y, s.radius*impactP, s.radius*0.5*impactP, 0, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      continue;
    }
    if(s.kind==='bolaFogoBlast'){
      // Bola de Fogo: explosão redonda concentrada, núcleo brilhante amarelo com anel de chamas se espalhando
      ctx.save();
      const grow = Math.min(1, s.life/160);
      const fade = 1 - Math.max(0, (s.life-260)/(s.maxLife-260));
      const alpha = Math.max(0, Math.min(1, fade)) * grow;
      const r = s.radius*grow;

      ctx.globalAlpha = alpha*0.75;
      const grad = ctx.createRadialGradient(s.x,s.y,4,s.x,s.y,r);
      grad.addColorStop(0,'rgba(255,246,200,.95)');
      grad.addColorStop(0.35,'rgba(255,140,20,.65)');
      grad.addColorStop(0.7,'rgba(183,28,28,.35)');
      grad.addColorStop(1,'rgba(183,28,28,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r*0.5, 0, 0, Math.PI*2); ctx.fill();

      ctx.globalAlpha = alpha*0.9;
      ctx.lineWidth = 3;
      ctx.shadowBlur=14; ctx.shadowColor='#FF6B35';
      ctx.strokeStyle = '#FFD93D';
      ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r*0.5, 0, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      continue;
    }
    if(s.kind==='nuclearBlast'){
      // Bomba Nuclear: flash branco ofuscante, onda de choque dupla (fuligem por fora, brasa por
      // dentro) e um pequeno cogumelo de fumaça subindo do centro — bem diferente da Bola de Fogo
      ctx.save();
      if(s.life<260){
        const flashP = Math.min(1, s.life/150);
        const flashFade = Math.max(0, 1-(s.life/260));
        ctx.globalAlpha = flashFade;
        const rf = s.radius*1.8*flashP;
        const g = ctx.createRadialGradient(s.x,s.y,2,s.x,s.y,Math.max(2,rf));
        g.addColorStop(0,'rgba(255,255,255,.98)');
        g.addColorStop(0.4,'rgba(255,240,180,.7)');
        g.addColorStop(1,'rgba(255,240,180,0)');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.ellipse(s.x,s.y,rf, rf*0.5,0,0,Math.PI*2); ctx.fill();
      }
      const ringGrow = Math.min(1, s.life/500);
      const ringFade = 1 - Math.max(0,(s.life-300)/(s.maxLife-300));
      const rOuter = s.radius*2.3*ringGrow;
      ctx.globalAlpha = Math.max(0,ringFade)*0.6;
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#5A5A5A';
      ctx.shadowBlur=10; ctx.shadowColor='#3A3A3A';
      ctx.beginPath(); ctx.ellipse(s.x, s.y, rOuter, rOuter*0.5, 0, 0, Math.PI*2); ctx.stroke();

      const rInner = s.radius*1.5*ringGrow;
      ctx.globalAlpha = Math.max(0,ringFade)*0.85;
      ctx.strokeStyle = '#FFD93D';
      ctx.lineWidth = 3;
      ctx.shadowBlur=10; ctx.shadowColor='#FF8C42';
      ctx.beginPath(); ctx.ellipse(s.x, s.y, rInner, rInner*0.5, 0, 0, Math.PI*2); ctx.stroke();

      const cloudP = Math.min(1, Math.max(0,(s.life-150))/500);
      const cloudFade = 1 - Math.max(0, (s.life-1200)/(s.maxLife-1200));
      const cloudY = s.y - 60*cloudP;
      ctx.globalAlpha = Math.min(0.55, cloudP)*Math.max(0,cloudFade);
      ctx.fillStyle = '#6B6B6B';
      ctx.beginPath(); ctx.rect(s.x-6, s.y-40*cloudP, 12, 40*cloudP); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s.x, cloudY, 22*(0.4+0.6*cloudP), 14*(0.4+0.6*cloudP), 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      continue;
    }
    if(s.kind==='ondaSpell'){
      // Onda: uma crista de água avança pra frente (rumo ao lado inimigo de quem lançou),
      // com espuma na frente e um rastro de água que vai sumindo atrás dela
      ctx.save();
      const dirY = s.owner==='enemy' ? 1 : -1; // avança em direção ao lado oposto de quem lançou
      const travel = s.radius*1.15;
      const p = Math.min(1, s.life/s.maxLife);
      const easeP = 1-Math.pow(1-p,2); // acelera no início, desacelera perto do fim
      const waveY = s.y + dirY*travel*easeP;
      const fadeIn = Math.min(1, p/0.12);
      const fadeOut = 1-Math.max(0,(p-0.6)/0.4);
      const alpha = Math.max(0, Math.min(1,fadeIn) * Math.min(1,fadeOut));
      const halfWidth = s.radius*(0.5+0.5*easeP);
      const crestDepth = dirY*20;

      // rastro de água que a onda vai deixando entre o ponto de origem e a posição atual
      ctx.globalAlpha = alpha*0.22;
      ctx.fillStyle = '#0288D1';
      ctx.beginPath();
      ctx.ellipse(s.x, (s.y+waveY)/2, halfWidth*0.85, Math.max(10,Math.abs(waveY-s.y)/2+10), 0, 0, Math.PI*2);
      ctx.fill();

      // corpo da onda logo atrás da crista, dando volume
      ctx.globalAlpha = alpha*0.5;
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#4FC3F7';
      ctx.beginPath();
      ctx.moveTo(s.x-halfWidth*0.85, waveY - dirY*11);
      ctx.quadraticCurveTo(s.x, waveY - dirY*11 + crestDepth, s.x+halfWidth*0.85, waveY - dirY*11);
      ctx.stroke();

      // crista da onda: arco curvo bem na frente, avançando
      ctx.globalAlpha = alpha*0.92;
      ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.shadowBlur = 16; ctx.shadowColor = '#4FC3F7';
      ctx.strokeStyle = '#E1F5FE';
      ctx.beginPath();
      ctx.moveTo(s.x-halfWidth, waveY);
      ctx.quadraticCurveTo(s.x, waveY+crestDepth, s.x+halfWidth, waveY);
      ctx.stroke();

      // espuma branca correndo ao longo da crista
      ctx.globalAlpha = alpha*0.95;
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowBlur = 4; ctx.shadowColor = '#FFFFFF';
      const foamCount = 9;
      for(let i=0;i<foamCount;i++){
        const t = i/(foamCount-1);
        const fx = s.x - halfWidth + t*halfWidth*2;
        const curveY = waveY + Math.sin(t*Math.PI)*crestDepth;
        ctx.beginPath(); ctx.arc(fx, curveY, 2.6, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
      continue;
    }
    if(s.kind!=='arrowrain') continue;
    ctx.save();
    const pulseA = 0.18+0.12*Math.sin(Date.now()/120);
    ctx.strokeStyle = `rgba(180,220,255,${pulseA+0.15})`;
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(s.x,s.y,s.radius,s.radius*0.55,0,0,Math.PI*2); ctx.stroke();
    s.arrows.forEach(a=>{
      const localLife = s.life-a.delay;
      if(localLife<0 || localLife>170) return;
      const p = Math.min(1, localLife/170);
      const ax = s.x+a.dx, ay = s.y+a.dy;
      const fallFrom = -130*(1-p);
      ctx.save();
      ctx.translate(ax, ay+fallFrom);
      ctx.globalAlpha = 0.45+0.55*p;
      ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=2.2; ctx.lineCap='round';
      ctx.shadowBlur=6; ctx.shadowColor='#DFF3FF';
      ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(0,9); ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.moveTo(0,9); ctx.lineTo(-3,4); ctx.lineTo(3,4); ctx.closePath(); ctx.fill();
      ctx.restore();
    });
    ctx.restore();
  }
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    if(p.piercing){
      // Espada de Frey: voa reto na direção fixada no disparo, sem perseguir alvo,
      // e acerta (uma única vez cada) todo inimigo que cruzar seu caminho.
      p.x += p.dirX*p.speed*(dt/1000);
      p.y += p.dirY*p.speed*(dt/1000);
      const oppOwner = p.owner==='player' ? 'enemy' : 'player';
      for(const o of troops){
        if(o.owner!==oppOwner || o.state==='dying' || o.invisible) continue;
        if(p.hitSet.has(o)) continue;
        if(Math.hypot(o.x-p.x, o.y-p.y) <= 16){
          applyDamage(o, p.dmg, p.bleedOwner);
          p.hitSet.add(o);
        }
      }
      p.trailTimer += dt;
      if(p.trailTimer>18){
        p.trailTimer=0;
        particles.push(mkParticle(p.x,p.y,(Math.random()-0.5)*10,(Math.random()-0.5)*10,
          260, 4+Math.random()*3, ['#FFD93D','#FFF6C8','#FFEE58'][Math.floor(Math.random()*3)], 'sparkle'));
      }
      if(p.x<-20 || p.x>W+20 || p.y<-20 || p.y>H+20){
        projectiles.splice(i,1);
      }
      continue;
    }
    if(targetStillValid(p.target, p.isTower)){
      p.targetX = p.target.x + (p.landOffsetX||0);
      p.targetY = p.target.y - (p.isTower?10:14) + (p.landOffsetY||0);
    }
    const dx = p.targetX-p.x, dy = p.targetY-p.y;
    const d = Math.hypot(dx,dy);
    const step = p.speed*(dt/1000);
    p.angle = Math.atan2(dy,dx);

    if(d<=step || d<8){
      const hitOk = targetStillValid(p.target, p.isTower);
      if(hitOk && !(p.hitSet && p.hitSet.has(p.target))){
        applyDamage(p.target, p.dmg, p.bleedOwner);
        if(p.hitSet) p.hitSet.add(p.target);
        // Hades: regenera 5% do próprio HP máximo sempre que uma de suas almas mata algo
        if(p.healOnKillPct && p.target.hp<=0) healTroopById(p.sourceId, p.healOnKillPct);
        // Jesus: quem ele mata renasce do lado dele (vira aliado de quem o matou),
        // com pouquíssimo HP, e passa a atacar sua própria base e antigos aliados
        if(p.reviveEnemyOnKillPct && p.target.hp<=0 && !p.isTower && troops.includes(p.target)){
          reviveAsTurncoat(p.target, p.owner, p.reviveEnemyOnKillPct);
        }
        // Luke/Obione: empurra o alvo atingido para trás (só funciona em tropas, não em torres)
        if(p.knockback && !p.isTower && troops.includes(p.target)){
          knockbackFrom(p.target, p.x, p.y, p.knockback);
        }
        // Bruxa: amaldiçoa o alvo atingido — se ele morrer depois (por qualquer motivo), vira um Demônio
        if(p.curseOnHit && !p.isTower && troops.includes(p.target)){
          p.target.bruxaOwner = p.owner;
        }
        // Miguel: marca o alvo com Paranoia — o próximo ataque dele será contra o aliado mais próximo (até 3x por Miguel)
        if(p.paranoiaOnHit && !p.isTower && troops.includes(p.target)){
          const caster = troops.find(o=>o.id===p.sourceId && o.state==='alive');
          if(caster){
            caster.paranoiaUses = caster.paranoiaUses||0;
            const maxUses = (CARD_TYPES[caster.key] && CARD_TYPES[caster.key].paranoiaCharges) || 3;
            if(caster.paranoiaUses<maxUses){
              caster.paranoiaUses++;
              p.target.paranoiaMark = true;
              const mx=p.target.x, my=p.target.y-18;
              spawnBurst(mx,my,10,['#8E44AD','#3B0764','#D8B4FE'],80,9,300);
              particles.push({x:mx,y:my,kind:'flash',life:0,maxLife:120,r0:2,r1:16,color:'rgba(142,68,173,.85)'});
            }
          }
        }
        // Maria: aplica Cegueira — o alvo fica 2s sem enxergar tropas inimigas, só avança pra torre (até 3x por Maria)
        if(p.blindOnHit && !p.isTower && troops.includes(p.target)){
          const caster = troops.find(o=>o.id===p.sourceId && o.state==='alive');
          if(caster){
            caster.blindUses = caster.blindUses||0;
            const maxUses = (CARD_TYPES[caster.key] && CARD_TYPES[caster.key].blindCharges) || 3;
            if(caster.blindUses<maxUses){
              caster.blindUses++;
              p.target.blindTimer = 2000;
              const mx=p.target.x, my=p.target.y-18;
              spawnBurst(mx,my,10,['#FFFFFF','#87CEEB','#DFF3FF'],80,9,300);
              particles.push({x:mx,y:my,kind:'flash',life:0,maxLife:140,r0:2,r1:18,color:'rgba(255,255,255,.9)'});
            }
          }
        }
      }

      // Pandora: cada flecha branca também causa dano numa área pequena ao redor do impacto
      // (sem acertar duas vezes o mesmo alvo dentro da mesma leva de flechas)
      if(p.splashRadius){
        for(const o of troops){
          if(o.owner===p.owner || o.state==='dying' || o.invisible) continue;
          if(o===p.target) continue;
          if(p.hitSet && p.hitSet.has(o)) continue;
          const dd = Math.hypot(o.x-p.x, o.y-p.y);
          if(dd<=p.splashRadius){
            applyDamage(o, p.dmg, p.bleedOwner);
            if(p.hitSet) p.hitSet.add(o);
            // Obione: empurra também todos os inimigos pegos pela área da explosão
            if(p.knockback) knockbackFrom(o, p.x, p.y, p.knockback);
          }
        }
      }
      // Ares: crava uma lança de fogo permanente no inimigo (nunca sai, acumula, não funciona em torres)
      if(p.fireLance && hitOk && !p.isTower && p.target.fireLances){
        p.target.fireLances.push({dps: p.dmg*0.2});
      }
      spawnImpact(p);
      projectiles.splice(i,1);
      continue;
    }
    p.x += Math.cos(p.angle)*step;
    p.y += Math.sin(p.angle)*step;
    p.spin += dt*0.02;

    p.trailTimer += dt;
    if(p.kind==='fireball' && p.trailTimer>26){
      p.trailTimer=0;
      particles.push(mkParticle(p.x,p.y, (Math.random()-0.5)*14,(Math.random()-0.5)*14,
        420, 5+Math.random()*4, ['#FFD93D','#FF8C42','#FF3C1A'][Math.floor(Math.random()*3)], 'fire'));
    } else if(p.kind==='arrow' && p.trailTimer>20){
      p.trailTimer=0;
      particles.push(mkParticle(p.x,p.y, (Math.random()-0.5)*10,(Math.random()-0.5)*10,
        340, 2+Math.random()*2, '#FFFFFF', 'sparkle'));
    } else if(p.kind==='bullet' && p.trailTimer>14){
      p.trailTimer=0;
      particles.push(mkParticle(p.x,p.y, 0,0, 140, 2, 'rgba(255,246,200,.9)', 'trail'));
    } else if(p.kind==='cannonball' && p.trailTimer>22){
      p.trailTimer=0;
      particles.push(mkParticle(p.x,p.y, (Math.random()-0.5)*6,(Math.random()-0.5)*6,
        320, 4+Math.random()*3, 'rgba(140,140,140,.6)', 'fire'));
    } else if(p.kind==='car' && p.trailTimer>24){
      p.trailTimer=0;
      particles.push(mkParticle(p.x,p.y, (Math.random()-0.5)*8,(Math.random()-0.5)*8,
        300, 3+Math.random()*3, 'rgba(120,40,40,.55)', 'fire'));
    } else if(p.kind==='parrow' && p.trailTimer>18){
      p.trailTimer=0;
      particles.push(mkParticle(p.x,p.y, (Math.random()-0.5)*8,(Math.random()-0.5)*8,
        300, 2+Math.random()*2, '#FFFFFF', 'sparkle'));
    } else if(p.kind==='spear' && p.trailTimer>20){
      p.trailTimer=0;
      particles.push(mkParticle(p.x,p.y, (Math.random()-0.5)*10,(Math.random()-0.5)*10,
        360, 4+Math.random()*3, ['#FF6A2E','#FFD93D','#B71C1C'][Math.floor(Math.random()*3)], 'fire'));
    }
  }
}

function spawnImpact(p){
  if(p.kind==='fireball'){
    // explosão grande e chamativa (maior ainda se o Dragão estiver evoluído)
    const evoMult = p.evoLvl>=1 ? 1.5 : 1;
    particles.push({x:p.x,y:p.y,kind:'shockwave',life:0,maxLife:340,r0:4,r1:46*evoMult,color:'rgba(255,140,20,.55)'});
    particles.push({x:p.x,y:p.y,kind:'flash',life:0,maxLife:140,r0:2,r1:30*evoMult,color:'rgba(255,255,255,.9)'});
    for(let i=0;i<Math.round(16*evoMult);i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 30+Math.random()*70;
      particles.push(mkParticle(p.x,p.y, Math.cos(ang)*spd, Math.sin(ang)*spd-30,
        400+Math.random()*260, (6+Math.random()*5)*evoMult,
        ['#FFD93D','#FF8C42','#FF5722','#FF3C1A'][Math.floor(Math.random()*4)], 'fire'));
    }
  } else if(p.kind==='bullet'){
    spawnBurst(p.x,p.y, 8, ['#FFF6C8','#FFD93D','#FFB627'], 110, 10, 220);
    particles.push({x:p.x,y:p.y,kind:'shockwave',life:0,maxLife:160,r0:2,r1:16,color:'rgba(255,217,61,.5)'});
  } else if(p.kind==='arrow'){
    spawnBurst(p.x,p.y, 14, ['#FFFFFF','#DFF3FF','#B6E8FF'], 130, 14, 380);
    particles.push({x:p.x,y:p.y,kind:'shockwave',life:0,maxLife:220,r0:2,r1:22,color:'rgba(255,255,255,.6)'});
  } else if(p.kind==='cannonball'){
    spawnBurst(p.x,p.y, 14, ['#5A5A5A','#8C8C8C','#FFD93D','#FF8C42'], 130, 14, 340);
    particles.push({x:p.x,y:p.y,kind:'shockwave',life:0,maxLife:240,r0:3,r1:30,color:'rgba(120,120,120,.55)'});
    particles.push({x:p.x,y:p.y,kind:'flash',life:0,maxLife:110,r0:2,r1:18,color:'rgba(255,220,140,.8)'});
  } else if(p.kind==='car'){
    spawnBurst(p.x,p.y, 16, ['#C0392B','#7A1F1F','#8C8C8C','#FFD93D'], 140, 14, 360);
    particles.push({x:p.x,y:p.y,kind:'shockwave',life:0,maxLife:250,r0:3,r1:32,color:'rgba(150,50,50,.5)'});
    particles.push({x:p.x,y:p.y,kind:'flash',life:0,maxLife:120,r0:2,r1:20,color:'rgba(255,200,140,.8)'});
  } else if(p.kind==='parrow'){
    spawnBurst(p.x,p.y, 12, ['#FFFFFF','#F0F0F0','#DFF3FF'], 100, 10, 280);
    particles.push({x:p.x,y:p.y,kind:'shockwave',life:0,maxLife:200,r0:2,r1:(p.splashRadius||28),color:'rgba(255,255,255,.45)'});
  } else if(p.kind==='spear'){
    spawnBurst(p.x,p.y, 12, ['#FF6A2E','#FFD93D','#B71C1C'], 110, 12, 300);
    particles.push({x:p.x,y:p.y,kind:'shockwave',life:0,maxLife:200,r0:2,r1:22,color:'rgba(255,90,30,.5)'});

    particles.push({x:p.x,y:p.y,kind:'shockwave',life:0,maxLife:240,r0:3,r1:26,color:'rgba(140,20,160,.5)'});
    particles.push({x:p.x,y:p.y,kind:'flash',life:0,maxLife:120,r0:2,r1:20,color:'rgba(200,140,220,.85)'});

    particles.push({x:p.x,y:p.y,kind:'shockwave',life:0,maxLife:200,r0:2,r1:18,color:'rgba(41,182,246,.5)'});

function spawnBurst(x,y,count,colors,spread,size,life,kind){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = spread*(0.3+Math.random()*0.7);
    particles.push(mkParticle(x,y, Math.cos(ang)*spd, Math.sin(ang)*spd,
      life*(0.6+Math.random()*0.6), size*(0.5+Math.random()*0.7),
      colors[Math.floor(Math.random()*colors.length)], kind||'spark'));
  }
}
/* névoa de gelo se espalhando a partir de um ponto de impacto — usada em vez de bolinhas
   pra qualquer efeito de gelo (feitiço Gelo, futuros ataques congelantes) */
function spawnMistBurst(x,y,count,radius){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = radius*(0.15+Math.random()*0.35);
    const col = Math.random()<0.5 ? 'rgba(179,229,252,.55)' : 'rgba(225,245,254,.55)';
    particles.push(mkParticle(x,y, Math.cos(ang)*spd, Math.sin(ang)*spd*0.4,
      900+Math.random()*500, 14+Math.random()*16, col, 'mist'));
  }
}
function mkParticle(x,y,vx,vy,maxLife,size,color,kind){
  return {x,y,vx,vy,life:0,maxLife,size,color,kind};
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const pt = particles[i];
    pt.life += dt;
    if(pt.life>=pt.maxLife){ particles.splice(i,1); continue; }
    if(pt.kind==='fire'){ pt.x+=pt.vx*(dt/1000); pt.y+=pt.vy*(dt/1000)-14*(dt/1000); pt.vx*=0.94; pt.vy*=0.94; pt.wobble=(pt.wobble||Math.random()*10)+dt*0.006; }
    else if(pt.kind==='spark'||pt.kind==='sparkle'){ pt.x+=pt.vx*(dt/1000); pt.y+=pt.vy*(dt/1000); pt.vx*=0.9; pt.vy*=0.9; }
    else if(pt.kind==='smoke'){ pt.x+=pt.vx*(dt/1000); pt.y+=pt.vy*(dt/1000); pt.vx*=0.97; pt.vy*=0.985; pt.size+=dt*0.012; }
    else if(pt.kind==='mist'){ pt.x+=pt.vx*(dt/1000); pt.y+=pt.vy*(dt/1000); pt.vx*=0.985; pt.vy*=0.96; pt.size+=dt*0.018; }
  }
}

function drawParticle(pt){
  const life = Math.min(1, pt.life/pt.maxLife);
  ctx.save();
  if(pt.kind==='shockwave'){
    const r = pt.r0 + (pt.r1-pt.r0)*life;
    ctx.globalAlpha = 1-life;
    ctx.strokeStyle = pt.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2); ctx.stroke();
  } else if(pt.kind==='flash'){
    const r = pt.r0 + (pt.r1-pt.r0)*life;
    ctx.globalAlpha = 1-life;
    const grad = ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,r);
    grad.addColorStop(0,pt.color); grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2); ctx.fill();
  } else if(pt.kind==='fire'){
    // chama de verdade: gotícula alongada que se afina pra cima e balança de lado a lado,
    // com núcleo amarelo-claro e ponta avermelhada — não é mais uma bolinha
    const size = pt.size*(1-life*0.55);
    const sway = Math.sin((pt.wobble||0) + pt.x*0.05)*size*0.35;
    ctx.globalAlpha = 1-life*0.92;
    ctx.translate(pt.x+sway, pt.y);
    ctx.shadowBlur=9; ctx.shadowColor=pt.color;
    const grad = ctx.createLinearGradient(0,size*1.5,0,-size*1.9);
    grad.addColorStop(0,'rgba(120,20,0,0)');
    grad.addColorStop(0.4,pt.color);
    grad.addColorStop(0.78,'#FFD93D');
    grad.addColorStop(1,'rgba(255,246,200,.95)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(0, size*1.5);
    ctx.quadraticCurveTo(size*0.85, size*0.15, size*0.22, -size*1.05);
    ctx.quadraticCurveTo(size*0.06, -size*1.55, 0, -size*1.9);
    ctx.quadraticCurveTo(-size*0.06, -size*1.55, -size*0.22, -size*1.05);
    ctx.quadraticCurveTo(-size*0.85, size*0.15, 0, size*1.5);
    ctx.closePath(); ctx.fill();
  } else if(pt.kind==='mist'){
    // névoa de gelo: nuvem baixa e achatada, sem brilho de bolinha — cresce e dissolve devagar
    const grow = 0.6+life*0.9;
    const w = pt.size*grow, h = pt.size*grow*0.5;
    ctx.globalAlpha = (1-life)*0.42;
    const grad = ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,w);
    grad.addColorStop(0, pt.color);
    grad.addColorStop(0.6, 'rgba(210,245,255,.35)');
    grad.addColorStop(1, 'rgba(210,245,255,0)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.ellipse(pt.x,pt.y,w,h,0,0,Math.PI*2); ctx.fill();
  } else if(pt.kind==='sparkle'){
    // brilho fino em cruz (glint), não uma bola sólida
    const size = pt.size*(1-life*0.4);
    ctx.globalAlpha = 1-life;
    ctx.translate(pt.x,pt.y);
    ctx.shadowBlur=6; ctx.shadowColor='#FFFFFF';
    ctx.strokeStyle=pt.color; ctx.lineWidth=Math.max(0.8,size*0.35); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-size,0); ctx.lineTo(size,0);
    ctx.moveTo(0,-size); ctx.lineTo(0,size);
    ctx.stroke();
  } else if(pt.kind==='trail'){
    ctx.globalAlpha = 1-life;
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size,0,Math.PI*2); ctx.fill();
  } else if(pt.kind==='smoke'){
    ctx.globalAlpha = (1-life)*0.5;
    const grad = ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,pt.size);
    grad.addColorStop(0,pt.color); grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.ellipse(pt.x,pt.y,pt.size,pt.size*0.7,0,0,Math.PI*2); ctx.fill();
  } else { // spark — faísca elétrica: risquinho fino alinhado ao movimento, não uma bolinha
    const size = pt.size*(1-life*0.4);
    const ang = Math.atan2(pt.vy||0, pt.vx||0.001);
    const len = size*2.4;
    ctx.globalAlpha = 1-life;
    ctx.translate(pt.x,pt.y);
    ctx.rotate(ang);
    ctx.shadowBlur=8; ctx.shadowColor=pt.color;
    ctx.strokeStyle=pt.color; ctx.lineWidth=Math.max(1,size*0.4); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-len/2,0);
    ctx.lineTo(-len/6,-size*0.3);
    ctx.lineTo(len/6,size*0.3);
    ctx.lineTo(len/2,0);
    ctx.stroke();
    ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=Math.max(0.6,size*0.18);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- TORRES ATIRANDO ---------- */
function updateTowers(dt){
  for(const tw of towers){
    if(tw.hp<=0) continue;
    // congelada pelo feitiço de Gelo: não consegue atacar até o congelamento acabar
    if(tw.freezeTimer>0){
      tw.freezeTimer = Math.max(0, tw.freezeTimer-dt);
      continue;
    }
    const oppOwner = tw.owner==='player'?'enemy':'player';
    let target=null, bestD=Infinity;
    for(const o of troops){
      if(o.owner!==oppOwner || o.state==='dying' || o.invisible) continue;
      const d = dist(tw,o);
      if(d<tw.range && d<bestD){ bestD=d; target=o; }
    }
    if(target){
      tw.lastAtk += dt;
      if(tw.lastAtk>=tw.atkSpeed){
        tw.lastAtk=0;
        spawnProjectile(tw, target, TOWER_ARROW_DEF, tw.dmg);
      }
    }
  }
}

/* ---------- REGENERAÇÃO PASSIVA (Hades: 5% do HP máximo por segundo) ---------- */
function updateRegen(dt){
  for(const t of troops){
    if(t.state==='dying') continue;
    const def = CARD_TYPES[t.key];
    if(!def.regenPct) continue;
    t.regenTimer = (t.regenTimer||0) + dt;
    while(t.regenTimer>=1000){
      t.regenTimer -= 1000;
      t.hp = Math.min(t.maxhp, t.hp + t.maxhp*def.regenPct);
    }
  }
}
function healTroopById(id, pct){
  if(!id || !pct) return;
  const tr = troops.find(o=>o.id===id && o.state==='alive');
  if(tr) tr.hp = Math.min(tr.maxhp, tr.hp + tr.maxhp*pct);
}

/* ---------- GELO (Troll de Gelo): lentidão temporária de 40% ao ser atingido ---------- */
const ICE_SLOW_DURATION = 2000;
const ICE_SLOW_MULT = 0.6;
function applyIceSlow(target, mult, duration){
  if(!target || target.state!=='alive' || target.medusaStage) return; // não sobrepõe a petrificação da Medusa
  mult = mult || ICE_SLOW_MULT;
  duration = duration || ICE_SLOW_DURATION;
  target.speedMult = mult;
  target.atkSpeedMult = 1/mult;
  target.iceSlowTimer = duration; // reseta a duração a cada novo golpe (não é acumulativo)
  const tx = target.x, ty = target.y-14;
  // congelamento: rajada de cristais de gelo + névoa gélida + brilho frio
  spawnBurst(tx, ty, 16, ['#B3E5FC','#E1F5FE','#4FC3F7','#FFFFFF'], 120, 10, 420);
  particles.push({x:tx,y:ty,kind:'shockwave',life:0,maxLife:320,r0:2,r1:26,color:'rgba(79,195,247,.55)'});
  particles.push({x:tx,y:ty,kind:'shockwave',life:0,maxLife:460,r0:4,r1:38,color:'rgba(179,229,252,.35)'});
  particles.push({x:tx,y:ty,kind:'flash',life:0,maxLife:180,r0:2,r1:24,color:'rgba(220,245,255,.9)'});
}
function updateIceSlow(dt){
  for(const t of troops){
    if(t.state==='dying' || !t.iceSlowTimer) continue;
    t.iceSlowTimer -= dt;
    if(t.iceSlowTimer<=0){
      t.iceSlowTimer = 0;
      if(!t.medusaStage){ t.speedMult = 1; t.atkSpeedMult = 1; } // Medusa continua controlando, se for o caso
    }
  }
}

/* ---------- CEGUEIRA (Maria): por 2s a tropa não enxerga inimigos e só avança rumo à torre inimiga ---------- */
function updateBlindness(dt){
  for(const t of troops){
    if(t.state==='dying' || !t.blindTimer) continue;
    t.blindTimer -= dt;
    if(t.blindTimer<0) t.blindTimer = 0;
  }
}

/* ---------- PARANOIA (Miguel): acha o aliado (ou a própria torre) mais perto da tropa marcada ---------- */
function findNearestAllyOrTower(t){
  let best=null, bestD=Infinity;
  for(const o of troops){
    if(o===t || o.owner!==t.owner || o.state==='dying') continue;
    const d = dist(t,o);
    if(d<bestD){ bestD=d; best=o; }
  }
  for(const tw of towers){
    if(tw.owner!==t.owner || tw.hp<=0) continue;
    const d = dist(t,tw);
    if(d<bestD){ bestD=d; best=tw; }
  }
  return best;
}

/* ---------- DECAIMENTO DAS CONSTRUÇÕES (Canhão e qualquer construção futura) ---------- */
function updateBuildingDecay(dt){
  for(const t of troops){
    if(t.state==='dying') continue;
    const def = CARD_TYPES[t.key];
    if(!def.isBuilding) continue;
    t.decayTimer += dt;
    while(t.decayTimer>=1000){
      t.decayTimer -= 1000;
      t.hp -= t.maxhp*0.05; // perde 5% do HP máximo por segundo
      if(t.hp<0) t.hp=0;
      if(t.hp<=0 && t.state==='alive'){ t.state='dying'; t.dieElapsed=0; }
    }
  }
}

/* ---------- SANGRAMENTO (Leão) ---------- */
function updateBleeds(dt){
  for(const t of troops){
    if(t.state==='dying' || !t.bleeds || !t.bleeds.length) continue;
    processBleedList(t, dt);
  }
  for(const tw of towers){
    if(tw.hp<=0 || !tw.bleeds || !tw.bleeds.length) continue;
    processBleedList(tw, dt);
  }
}
function processBleedList(entity, dt){
  for(const b of entity.bleeds){
    b.tickTimer += dt;
    while(b.tickTimer>=1000 && b.ticksLeft>0){
      b.tickTimer -= 1000;
      entity.hp -= b.dmgPerTick;
      if('timeSinceHit' in entity) entity.timeSinceHit = 0;
      if(entity.hp<0) entity.hp=0;
      b.ticksLeft--;
    }
  }
  entity.bleeds = entity.bleeds.filter(b=>b.ticksLeft>0);
  if(entity.hp<=0 && 'state' in entity && entity.state==='alive'){
    entity.state='dying'; entity.dieElapsed=0;
    onTroopDeath(entity);
  }
}

/* ---------- LANÇA DE FOGO (Ares) — permanente, acumulativa, só em tropas ---------- */
function updateFireLances(dt){
  for(const t of troops){
    if(t.state==='dying' || !t.fireLances || !t.fireLances.length) continue;
    t.lanceTickTimer = (t.lanceTickTimer||0) + dt;
    while(t.lanceTickTimer>=1000){
      t.lanceTickTimer -= 1000;
      let totalDps = 0;
      for(const lance of t.fireLances) totalDps += lance.dps;
      t.hp -= totalDps;
      if('timeSinceHit' in t) t.timeSinceHit = 0;
      if(t.hp<0) t.hp=0;
      spawnBurst(t.x, t.y, 3, ['#FF8C42','#FFD93D'], 30, 6, 260);
      if(t.hp<=0 && t.state==='alive'){ t.state='dying'; t.dieElapsed=0; onTroopDeath(t); }
    }
  }
}

/* ---------- RECAMUFLAGEM (Odin): fica invisível de novo após 5s sem receber dano ---------- */
const INVIS_RECLOAK_TIME = 5000;
function updateInvisCloak(dt){
  for(const t of troops){
    if(t.state==='dying' || t.invisible) continue;
    const def = CARD_TYPES[t.key];
    if(!def.invisibleRevealHits) continue;
    t.timeSinceHit = (t.timeSinceHit||0) + dt;
    if(t.timeSinceHit>=INVIS_RECLOAK_TIME){
      t.invisible = true;
      t.atkHits = 0; // precisa atacar duas vezes de novo pra se revelar
      spawnBurst(t.x, t.y-10, 12, ['#7E57C2','#4A0E7A','#E1BEE7'], 90, 10, 300);
      particles.push({x:t.x,y:t.y-10,kind:'shockwave',life:0,maxLife:240,r0:2,r1:24,color:'rgba(126,87,194,.5)'});
    }
  }
}

/* ---------- CONDIÇÕES DE VITÓRIA ---------- */
function checkWinConditions(){
  const pKing = towers.find(t=>t.id==='p_king');
  const eKing = towers.find(t=>t.id==='e_king');

  updateCrownsUI();

  if(eKing.hp<=0) return endMatch(true, 'Você destruiu a Torre Principal!');
  if(pKing.hp<=0) return endMatch(false, 'O rival destruiu sua Torre Principal!');

  if(suddenDeath){
    const anyPlayerDestroyedNow = towers.some(t=>t.owner==='enemy' && t.hp<=0);
    const anyEnemyDestroyedNow  = towers.some(t=>t.owner==='player' && t.hp<=0);
    if(anyPlayerDestroyedNow) return endMatch(true, 'Morte Súbita: você destruiu a primeira torre!');
    if(anyEnemyDestroyedNow)  return endMatch(false, 'Morte Súbita: o rival destruiu a primeira torre!');
  }
}
function updateCrownsUI(){
  const pc = towers.filter(t=>t.owner==='enemy' && t.hp<=0).length;
  const ec = towers.filter(t=>t.owner==='player'&& t.hp<=0).length;
  document.getElementById('player-crowns').textContent = pc;
  document.getElementById('enemy-crowns').textContent = ec;
}

function endMatch(playerWon, reason){
  if(!running) return;
  running = false;
  const title = document.getElementById('end-title');
  const sub = document.getElementById('end-sub');
  const coinsEl = document.getElementById('end-coins');
  const bailoutEl = document.getElementById('end-bailout');
  bailoutEl.classList.add('hidden');
  bailoutEl.textContent = '';
  if(playerWon){
    coins += currentBet*2;
    title.textContent='VITÓRIA!'; title.className='win';
    coinsEl.textContent = '+'+(currentBet*2)+' 🪙';
    coinsEl.style.color='#4FE37A';
  } else {
    title.textContent='DERROTA'; title.className='lose';
    coinsEl.textContent = '-'+currentBet+' 🪙';
    coinsEl.style.color='#FF6B6B';
    // Rede de segurança: se o jogador ficou zerado de moedas depois da derrota,
    // damos 1 moeda de graça pra ele não ficar travado sem poder abrir baú ou
    // jogar de novo. Só existem 2 dessas "vidas extras" no total, pra sempre.
    if(coins<=0 && bailoutsUsed<MAX_BAILOUTS){
      bailoutsUsed++;
      coins += 1;
      const restantes = MAX_BAILOUTS - bailoutsUsed;
      bailoutEl.textContent = `🎁 Moeda de segurança! Você recebeu 1 🪙 de graça pra não ficar travado (restam ${restantes}/${MAX_BAILOUTS} vezes).`;
      bailoutEl.classList.remove('hidden');
    }
  }
  sub.textContent = reason;
  saveGame();
  show('end-screen');
}

/* ============================================================
   DESENHO DO CAMPO (usa o tema da arena escolhida)
   ============================================================ */
function draw(){
  ctx.setTransform(CANVAS_DPR,0,0,CANVAS_DPR,0,0); // mantém a nitidez HiDPI a cada frame (sem isso, resetaria pra resolução baixa)
  ctx.clearRect(0,0,W,H);
  if(shakeMag>0.1){
    const sx=(Math.random()-0.5)*2*shakeMag, sy=(Math.random()-0.5)*2*shakeMag;
    ctx.translate(sx,sy);
  }
  const theme = activeArena;

  // ---------- CHÃO: textura pré-renderizada (luz direcional + blocos + grão) ----------
  // Desenhar toda essa textura de novo a cada frame seria pesado; em vez
  // disso ela é montada 1 única vez por arena/resolução num canvas
  // separado (getGroundLayer) e aqui só "colamos" o resultado pronto.
  const groundLayer = getGroundLayer(theme);
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0); // copia pixel a pixel, sem reescalar (mantém nítido)
  ctx.drawImage(groundLayer, 0, 0);
  ctx.restore();

  if(theme.fx==='tech') drawTechWires();
  else if(theme.fx==='volcano') drawEmbers();
  else if(theme.fx==='haven') drawHavenGlow();
  else if(theme.fx==='forest') drawForestScene();
  else if(theme.fx==='snow') drawSnowScene();
  else if(theme.fx==='desert') drawDesertScene();
  else if(theme.fx==='mistico') drawMysticForestScene();
  ctx.font='14px sans-serif';
  const flowerSpots = [[39,78],[442,117],[26,611],[455,676],[52,286],[429,325],[234,195],[234,559]];
  flowerSpots.forEach(([fx,fy])=>{
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=3; ctx.shadowOffsetY=1;
    ctx.fillText(theme.decor,fx,fy);
    ctx.restore();
  });

  // ---------- RIO: gradiente + reflexo de luz animado (água "viva") ----------
  const grad = ctx.createLinearGradient(0,RIVER_Y0,0,RIVER_Y1);
  grad.addColorStop(0,theme.river[0]); grad.addColorStop(1,theme.river[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0,RIVER_Y0,W,RIVER_Y1-RIVER_Y0);
  const rt = Date.now()/1000;
  ctx.save();
  ctx.globalAlpha = 0.22;
  for(let i=0;i<5;i++){
    const wy = RIVER_Y0 + (RIVER_Y1-RIVER_Y0) * (0.15 + i*0.18);
    const wx = ((rt*26 + i*72) % (W+140)) - 70;
    const wgrad = ctx.createLinearGradient(wx-70,0,wx+70,0);
    wgrad.addColorStop(0,'rgba(255,255,255,0)');
    wgrad.addColorStop(0.5,'rgba(255,255,255,.6)');
    wgrad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = wgrad;
    ctx.fillRect(wx-70, wy-1.5, 140, 2.6);
  }
  ctx.restore();
  // sombra de contato onde o rio encontra o chão (profundidade/AO)
  ctx.fillStyle='rgba(0,0,0,.20)';
  ctx.fillRect(0,RIVER_Y0,W,3);
  ctx.fillRect(0,RIVER_Y1-3,W,3);

  // ---------- PONTES: material com veio de madeira + sombra projetada ----------
  [BRIDGE_L, BRIDGE_R].forEach(br=>{
    const bw = br.x1-br.x0, bh = RIVER_Y1-RIVER_Y0+8, by = RIVER_Y0-4;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.42)'; ctx.shadowBlur=7; ctx.shadowOffsetY=3;
    const bgrad = ctx.createLinearGradient(0,by,0,by+bh);
    bgrad.addColorStop(0, shade(theme.bridge, 20));
    bgrad.addColorStop(0.55, theme.bridge);
    bgrad.addColorStop(1, shade(theme.bridge, -20));
    ctx.fillStyle = bgrad;
    ctx.fillRect(br.x0, by, bw, bh);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.2; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    for(let px=br.x0+4; px<br.x1-2; px+=6){ ctx.beginPath(); ctx.moveTo(px,by+2); ctx.lineTo(px,by+bh-2); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=2;
    ctx.strokeRect(br.x0, by, bw, bh);
  });

  ctx.fillStyle='rgba(79,195,247,0.06)';
  ctx.fillRect(0,RIVER_Y1,W,H-RIVER_Y1);

  drawDreamworldFloor();

  for(const t of towers) drawTower(t);
  for(const t of troops) drawTroop(t);
  drawPendingExplosions();
  for(const p of projectiles) drawProjectile(p);
  for(const b of beams) drawBeam(b);
  drawSpellEffects();
  for(const pt of particles) drawParticle(pt);

  // ---------- LUZ AMBIENTE + VINHETA CINEMATOGRÁFICA ----------
  // brilho suave descendo do topo (luz ambiente "de cena"), dá sensação de
  // iluminação real ao invés de tudo com o mesmo brilho plano
  const ambient = ctx.createLinearGradient(0,0,0,H*0.42);
  ambient.addColorStop(0,'rgba(255,255,255,.12)');
  ambient.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = ambient;
  ctx.fillRect(0,0,W,H*0.42);
  // vinheta nas bordas, mais forte que antes, tipo lente de câmera real
  const vig = ctx.createRadialGradient(W/2,H*0.46,H*0.30,W/2,H*0.46,H*0.76);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(0.72,'rgba(0,0,0,0.07)');
  vig.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle = vig;
  ctx.fillRect(0,0,W,H);
  drawHeldCardRange();
}

/* ---------- CAMADA DE CHÃO PRÉ-RENDERIZADA (textura + luz + grão) ----------
   Construída 1 vez por arena (e de novo se a resolução HiDPI mudar) e
   reaproveitada em todo frame, pra dar uma textura de material realista
   (luz direcional, blocos irregulares, grão fino tipo fotografia) sem
   pesar na performance — do contrário teríamos que redesenhar centenas
   de retângulos/pontos 60x por segundo. */
const groundLayerCache = {};
function buildGroundLayer(theme){
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(W*CANVAS_DPR));
  off.height = Math.max(1, Math.round(H*CANVAS_DPR));
  const octx = off.getContext('2d');
  octx.setTransform(CANVAS_DPR,0,0,CANVAS_DPR,0,0);

  // base com luz direcional (mais claro em cima, mais escuro embaixo — dá volume)
  const g = octx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, shade(theme.ground[0], 12));
  g.addColorStop(0.55, theme.ground[0]);
  g.addColorStop(1, shade(theme.ground[1], -16));
  octx.fillStyle = g;
  octx.fillRect(0,0,W,H);

  // mosaico irregular: cada bloco recebe uma variação leve de tom (textura
  // de material tipo pedra/grama real, ao invés de cor lisa/vetor)
  const TILE = 32;
  for(let ty=0; ty<H; ty+=TILE){
    for(let tx=0; tx<W; tx+=TILE){
      const seed = Math.abs(Math.sin(tx*12.9898 + ty*78.233) * 43758.5453);
      const v = (seed - Math.floor(seed)) - 0.5; // -0.5..0.5
      octx.globalAlpha = Math.abs(v) * 0.18;
      octx.fillStyle = v>0 ? '#fff' : '#000';
      octx.fillRect(tx, ty, TILE, TILE);
    }
  }
  octx.globalAlpha = 1;

  // grão fino espalhado (grunge/ruído fotográfico), tira o visual "vetor liso"
  for(let i=0;i<320;i++){
    const seed2 = Math.abs(Math.sin(i*91.345)*10000);
    const gx = (seed2*37) % W, gy = ((seed2*53)+i*17) % H;
    octx.globalAlpha = 0.045 + (i%3)*0.012;
    octx.fillStyle = (i%2===0) ? '#000' : '#fff';
    octx.fillRect(gx, gy, 1.6, 1.6);
  }
  octx.globalAlpha = 1;

  // linhas sutis (grade de tabuleiro discreta, mantém leitura do campo)
  octx.globalAlpha = 0.05;
  octx.strokeStyle = '#000';
  octx.lineWidth = 1;
  for(let gy=0; gy<H; gy+=14){ octx.beginPath(); octx.moveTo(0,gy); octx.lineTo(W,gy); octx.stroke(); }
  octx.globalAlpha = 1;

  // sombreamento nas laterais (ambient occlusion), dá profundidade nas bordas do campo
  const sideL = octx.createLinearGradient(0,0,26,0);
  sideL.addColorStop(0,'rgba(0,0,0,.22)'); sideL.addColorStop(1,'rgba(0,0,0,0)');
  octx.fillStyle = sideL; octx.fillRect(0,0,26,H);
  const sideR = octx.createLinearGradient(W-26,0,W,0);
  sideR.addColorStop(0,'rgba(0,0,0,0)'); sideR.addColorStop(1,'rgba(0,0,0,.22)');
  octx.fillStyle = sideR; octx.fillRect(W-26,0,26,H);

  return off;
}
function getGroundLayer(theme){
  const cached = groundLayerCache[theme.name];
  if(!cached || cached.dpr!==CANVAS_DPR){
    const layer = buildGroundLayer(theme);
    layer.dpr = CANVAS_DPR;
    groundLayerCache[theme.name] = layer;
  }
  return groundLayerCache[theme.name];
}

/* ---------- EFEITOS DE ARENA (batalha) ---------- */
function drawForestScene(){
  const t = Date.now()/1000;
  ctx.save();

  // luz solar difusa vinda de cima
  const sun = ctx.createRadialGradient(W*0.5,H*0.1,10,W*0.5,H*0.1,H*0.6);
  sun.addColorStop(0,'rgba(255,255,190,.22)');
  sun.addColorStop(1,'rgba(255,255,190,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(0,0,W,H);

  // manchas de luz salpicadas no chão (dappled light)
  const dapples = [[91,78],[390,124],[169,234],[338,266],[78,416],[429,442],[143,546],[364,611],[247,702]];
  dapples.forEach(([dx,dy],i)=>{
    const a = 0.10+0.06*Math.sin(t*1.4+i);
    ctx.fillStyle = `rgba(255,255,200,${a})`;
    ctx.beginPath(); ctx.ellipse(dx,dy,16,9,0.3,0,Math.PI*2); ctx.fill();
  });

  // tufos de mato coloridos espalhados pelo campo
  const grassSpots = [[26,72],[70,195],[21,312],[60,436],[23,559],[75,708],
                       [468,75],[426,195],[473,322],[439,445],[468,569],[424,708],
                       [182,75],[312,75],[156,708],[338,708],[247,260],[247,533]];
  grassSpots.forEach(([gx,gy],i)=> drawGrassTuft(gx,gy, 9+((i*7)%6), t, i));

  // árvores nas bordas, com sombra, brilho e balanço nas folhas
  const treesL = [[31,114],[26,341],[36,608]];
  const treesR = [[463,114],[468,341],[458,608]];
  treesL.forEach(([tx,ty],i)=> drawTree(tx,ty,t,i));
  treesR.forEach(([tx,ty],i)=> drawTree(tx,ty,t,i+10));

  ctx.restore();
}
function drawGrassTuft(x,y,size,t,seed){
  ctx.save();
  ctx.translate(x,y);
  const sway = Math.sin(t*1.8+seed)*0.18;
  const colors=['#3FA34D','#57C264','#2E8B3D','#7ED957'];
  for(let i=0;i<5;i++){
    const ang = -0.9+i*0.45+sway;
    ctx.strokeStyle = colors[i%colors.length];
    ctx.lineWidth=2.2;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(Math.sin(ang)*size*0.4, -size*0.6, Math.sin(ang)*size, -size);
    ctx.stroke();
  }
  ctx.restore();
}
function drawTree(x,y,t,seed){
  const sway = Math.sin(t*1.3+seed)*0.1;
  ctx.save();
  // sombra projetada no chão
  ctx.fillStyle='rgba(15,45,10,.3)';
  ctx.beginPath(); ctx.ellipse(x,y+30,22,7,0,0,Math.PI*2); ctx.fill();
  // tronco
  const trunkGrad = ctx.createLinearGradient(x-4,0,x+4,0);
  trunkGrad.addColorStop(0,'#5A3418'); trunkGrad.addColorStop(1,'#8B5A2B');
  ctx.fillStyle=trunkGrad;
  ctx.fillRect(x-4,y-4,8,26);

  // copa balançando (3 blobs com gradiente de brilho e sombra)
  ctx.translate(x,y-14);
  ctx.rotate(sway);
  const blobs=[[0,-15,20],[-14,1,16],[14,1,16]];
  blobs.forEach(([bx,by,r])=>{
    const grad = ctx.createRadialGradient(bx-r*0.3,by-r*0.35,2,bx,by,r);
    grad.addColorStop(0,'#A6F07A');
    grad.addColorStop(0.55,'#4CAF50');
    grad.addColorStop(1,'#256029');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
  });
  // brilho de sol na folhagem
  ctx.globalAlpha=0.55;
  ctx.fillStyle='#E8FFC2';
  ctx.beginPath(); ctx.arc(-7,-19,7,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ---------- FLORESTA MÍSTICA (nova arena, entre Vulcão e Haven) ----------
   Reaproveita a mesma composição da floresta comum (luz difusa, tufos de
   vegetação, árvores nas bordas), mas com paleta roxa/rosa em vez de verde,
   e as folhagens trocadas por flores para combinar com o tema místico. */
function drawMysticForestScene(){
  const t = Date.now()/1000;
  ctx.save();

  // luz difusa arroxeada vinda de cima
  const sun = ctx.createRadialGradient(W*0.5,H*0.1,10,W*0.5,H*0.1,H*0.6);
  sun.addColorStop(0,'rgba(220,170,255,.24)');
  sun.addColorStop(1,'rgba(220,170,255,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(0,0,W,H);

  // manchas de luz rosada salpicadas no chão
  const dapples = [[91,78],[390,124],[169,234],[338,266],[78,416],[429,442],[143,546],[364,611],[247,702]];
  dapples.forEach(([dx,dy],i)=>{
    const a = 0.10+0.06*Math.sin(t*1.4+i);
    ctx.fillStyle = `rgba(255,190,240,${a})`;
    ctx.beginPath(); ctx.ellipse(dx,dy,16,9,0.3,0,Math.PI*2); ctx.fill();
  });

  // tufos de vegetação roxa espalhados pelo campo
  const grassSpots = [[26,72],[70,195],[21,312],[60,436],[23,559],[75,708],
                       [468,75],[426,195],[473,322],[439,445],[468,569],[424,708],
                       [182,75],[312,75],[156,708],[338,708],[247,260],[247,533]];
  grassSpots.forEach(([gx,gy],i)=> drawMysticGrassTuft(gx,gy, 9+((i*7)%6), t, i));

  // árvores roxas nas bordas, com flores rosas na copa
  const treesL = [[31,114],[26,341],[36,608]];
  const treesR = [[463,114],[468,341],[458,608]];
  treesL.forEach(([tx,ty],i)=> drawMysticTree(tx,ty,t,i));
  treesR.forEach(([tx,ty],i)=> drawMysticTree(tx,ty,t,i+10));

  ctx.restore();
}
function drawMysticGrassTuft(x,y,size,t,seed){
  ctx.save();
  ctx.translate(x,y);
  const sway = Math.sin(t*1.8+seed)*0.18;
  const colors=['#8E5FD1','#B968F0','#6A3FA0','#D9A3FF'];
  for(let i=0;i<5;i++){
    const ang = -0.9+i*0.45+sway;
    ctx.strokeStyle = colors[i%colors.length];
    ctx.lineWidth=2.2;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(Math.sin(ang)*size*0.4, -size*0.6, Math.sin(ang)*size, -size);
    ctx.stroke();
  }
  // florzinha rosa na ponta de um dos talos
  ctx.fillStyle = '#FF8FD8';
  ctx.beginPath(); ctx.arc(Math.sin(0.45+sway)*size, -size, 2.4, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawMysticTree(x,y,t,seed){
  const sway = Math.sin(t*1.3+seed)*0.1;
  ctx.save();
  // sombra projetada no chão
  ctx.fillStyle='rgba(30,10,45,.35)';
  ctx.beginPath(); ctx.ellipse(x,y+30,22,7,0,0,Math.PI*2); ctx.fill();
  // tronco (mais escuro, arroxeado)
  const trunkGrad = ctx.createLinearGradient(x-4,0,x+4,0);
  trunkGrad.addColorStop(0,'#3A2050'); trunkGrad.addColorStop(1,'#5B3A8E');
  ctx.fillStyle=trunkGrad;
  ctx.fillRect(x-4,y-4,8,26);

  // copa balançando (3 blobs roxos com gradiente de brilho)
  ctx.translate(x,y-14);
  ctx.rotate(sway);
  const blobs=[[0,-15,20],[-14,1,16],[14,1,16]];
  blobs.forEach(([bx,by,r])=>{
    const grad = ctx.createRadialGradient(bx-r*0.3,by-r*0.35,2,bx,by,r);
    grad.addColorStop(0,'#E0B3FF');
    grad.addColorStop(0.55,'#9B4FE0');
    grad.addColorStop(1,'#4A1A6B');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
  });
  // flores rosas espalhadas na copa
  ctx.fillStyle = '#FF8FD8';
  [[-6,-20],[8,-8],[-10,4],[10,6]].forEach(([fx,fy])=>{
    ctx.beginPath(); ctx.arc(fx,fy,2.6,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

function drawTechWires(){
  const t = Date.now()/300;
  ctx.save();

  // grade de circuito sutil no fundo
  ctx.strokeStyle='rgba(79,195,247,0.12)'; ctx.lineWidth=1;
  for(let gx=0; gx<=W; gx+=28){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  for(let gy=0; gy<=H; gy+=28){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

  // brilho neon pulsante (ciano + roxo)
  const glow1 = ctx.createRadialGradient(W*0.5,H*0.25,10,W*0.5,H*0.25,H*0.5);
  glow1.addColorStop(0,`rgba(79,195,247,${0.16+0.06*Math.sin(t)})`); glow1.addColorStop(1,'rgba(79,195,247,0)');
  ctx.fillStyle=glow1; ctx.fillRect(0,0,W,H);
  const glow2 = ctx.createRadialGradient(W*0.5,H*0.78,10,W*0.5,H*0.78,H*0.5);
  glow2.addColorStop(0,`rgba(183,109,255,${0.12+0.06*Math.cos(t)})`); glow2.addColorStop(1,'rgba(183,109,255,0)');
  ctx.fillStyle=glow2; ctx.fillRect(0,0,W,H);

  // fios de energia ondulando e brilhando
  ctx.shadowBlur = 10; ctx.shadowColor = '#4FC3F7';
  ctx.strokeStyle = 'rgba(79,195,247,0.6)'; ctx.lineWidth = 2;
  const rows = [90,240,390,520];
  rows.forEach((y,i)=>{
    ctx.globalAlpha = 0.4 + 0.35*Math.sin(t+i);
    ctx.beginPath(); ctx.moveTo(0,y);
    for(let x=0;x<=W;x+=30) ctx.lineTo(x, y + Math.sin(x/25+t+i)*6);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // faíscas nos fios
  const sparks = [[78,117],[390,312],[195,507],[338,676],[260,117],[130,676]];
  sparks.forEach(([sx,sy],i)=>{
    const a = 0.5+0.5*Math.sin(t*2+i);
    ctx.shadowBlur=9; ctx.shadowColor='#B6FFFA';
    ctx.fillStyle = `rgba(182,255,250,${a})`;
    ctx.beginPath(); ctx.arc(sx,sy,3,0,Math.PI*2); ctx.fill();
  });

  // hologramas hexagonais de dados subindo
  ctx.shadowBlur=7; ctx.shadowColor='#B968F0';
  for(let i=0;i<10;i++){
    const seed=i*29.7;
    let bx=(seed*19)%W; if(bx<0) bx+=W;
    bx += Math.sin(t*0.5+i)*4;
    const by = H - ((t*24 + seed*17) % (H+30));
    const a = 0.3+0.5*Math.abs(Math.sin(t*1.3+i));
    ctx.fillStyle=`rgba(183,109,255,${a})`;
    drawHex(bx,by,3.5+((i%3)));
  }
  ctx.shadowBlur=0;
  ctx.restore();
}
function drawHex(cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const ang = Math.PI/3*i - Math.PI/6;
    const px = cx+r*Math.cos(ang), py=cy+r*Math.sin(ang);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
}

function drawEmbers(){
  const t = Date.now()/500;
  ctx.save();

  // brilho de lava pulsante vindo de baixo
  const lavaGlow = ctx.createRadialGradient(W*0.5,H*0.9,10,W*0.5,H*0.9,H*0.65);
  const ga = 0.28+0.16*Math.sin(t*1.3);
  lavaGlow.addColorStop(0,`rgba(255,110,30,${ga})`);
  lavaGlow.addColorStop(1,'rgba(255,110,30,0)');
  ctx.fillStyle=lavaGlow; ctx.fillRect(0,0,W,H);

  // rachaduras incandescentes no chão, pulsando
  const cracks = [[30,60,80,10],[300,90,70,-14],[60,300,90,8],[320,330,70,-10],[50,500,85,12],[310,530,75,-8]];
  cracks.forEach(([cx,cy,len,ang],i)=>{
    const a = 0.5+0.5*Math.sin(t*2.4+i);
    const rad = ang*Math.PI/180;
    const x2 = cx+Math.cos(rad)*len, y2 = cy+Math.sin(rad)*len;
    const grad = ctx.createLinearGradient(cx,cy,x2,y2);
    grad.addColorStop(0,'rgba(255,122,26,0)');
    grad.addColorStop(0.5,`rgba(255,190,60,${a})`);
    grad.addColorStop(1,'rgba(255,122,26,0)');
    ctx.strokeStyle=grad; ctx.lineWidth=3;
    ctx.shadowBlur=10*a; ctx.shadowColor='#FF7A1A';
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x2,y2); ctx.stroke();
  });
  ctx.shadowBlur=0;

  // fumaça subindo suavemente
  for(let i=0;i<7;i++){
    const seed=i*33.1;
    let sx=(seed*15)%W; if(sx<0) sx+=W;
    const cyclePos = (t*22 + seed*14) % (H+60);
    const sy = H - cyclePos;
    const a = 0.16*(1-cyclePos/(H+60));
    const grad = ctx.createRadialGradient(sx,sy,1,sx,sy,14);
    grad.addColorStop(0,`rgba(150,150,150,${Math.max(a,0.03)})`);
    grad.addColorStop(1,'rgba(150,150,150,0)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(sx,sy,14,0,Math.PI*2); ctx.fill();
  }

  // partículas de lava/brasas subindo, brilhantes e numerosas
  for(let i=0;i<20;i++){
    const seed = i*37.3;
    let x = (seed*13) % W; if(x<0) x+=W;
    x += Math.sin(t*0.7+i)*6;
    const y = H - ((t*45 + seed*20) % (H+40));
    const a = 0.35+0.6*Math.abs(Math.sin(t+i));
    const size = 1.8+(i%3)*1.1;
    ctx.shadowBlur=9; ctx.shadowColor='#FF5722';
    const g = ctx.createRadialGradient(x,y,0,x,y,size);
    g.addColorStop(0,'#FFF3B0'); g.addColorStop(.5,'#FF8C42'); g.addColorStop(1,'rgba(255,87,34,0)');
    ctx.fillStyle=g;
    ctx.globalAlpha=a;
    ctx.beginPath(); ctx.arc(x,y,size,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
  ctx.restore();
}
function drawHavenGlow(){

  // brilho dourado central pulsante
  const grad = ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,H*0.7);

  grad.addColorStop(1,'rgba(255,217,61,0)');

  // raios de luz divina descendo do topo
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const rays = [-0.35,-0.15,0.05,0.25,0.42];

    const rAlpha = 0.1+0.07*Math.sin(t*0.7+i);

function drawCloud(cx,cy,r){
  ctx.save();

  g.addColorStop(0,'#FFFFFF'); g.addColorStop(1,'#FFF3D6');

  blobs.forEach(([bx,by,br])=>{
    ctx.beginPath(); ctx.arc(cx+bx,cy+by,br,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

    g.addColorStop(0,'#FFFFFF'); g.addColorStop(.6,'#EAF6FF'); g.addColorStop(1,'#B9DEF4');
    ctx.fillStyle=g;

  });

  // brilhos cintilantes na neve
  const glints=[[91,78],[390,124],[169,234],[338,266],[78,416],[429,442],[143,546],[364,611],[247,195]];
  ctx.shadowColor='#ffffff';

function drawDesertScene(){

  const dunas = [[58,52,40,14],[322,80,46,16],[40,498,42,15],[340,528,38,14],[190,44,34,12],[190,552,34,12]];

function drawCactus(x,y,t,seed){
  const sway = Math.sin(t*1+seed)*0.04;
  ctx.save();
  ctx.fillStyle='rgba(80,50,10,.28)';
  ctx.beginPath(); ctx.ellipse(x,y+22,14,5,0,0,Math.PI*2); ctx.fill();
  ctx.translate(x,y);
  ctx.rotate(sway);
  const g = ctx.createLinearGradient(-8,0,8,0);
  g.addColorStop(0,'#2E7D32'); g.addColorStop(.5,'#4CAF50'); g.addColorStop(1,'#1B5E20');
  ctx.fillStyle=g;
  roundRect(ctx,-6,-22,12,26,6); ctx.fill();
  roundRect(ctx,-14,-10,10,7,4); ctx.fill();
  roundRect(ctx,4,-16,10,7,4); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-2,-20); ctx.lineTo(-2,2); ctx.stroke();
